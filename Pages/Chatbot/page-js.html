<script>
window.DIVINE_PAGE_MODULES = window.DIVINE_PAGE_MODULES || {};
window.DIVINE_PAGE_MODULES["chatbot"] = {
  "id": "chatbot",
  "sheet": "System_Config",
  "templateId": "dc-page-chatbot",
  "renderer": "renderChatbotDedicatedView",
  "access": []
};

function renderChatbotDedicatedView() {
  if (!isChatbotEnabled(state.currentRole)) {
    return `
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center max-w-lg mx-auto my-12 space-y-4">
        <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 mx-auto flex items-center justify-center text-2xl">
          <i class="fa-solid fa-robot"></i>
        </div>
        <h3 class="text-base font-bold text-slate-800 dark:text-slate-100">AI Assistant is Currently Disabled</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
          The Divine AI Chatbot is currently turned OFF for ${state.currentRole || "your role"}. The Developer can enable it anytime from Developer Settings.
        </p>
        ${state.currentRole === 'developer' ? `
          <button onclick="navigateTo('settings')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition">
            Open Settings
          </button>
        ` : ''}
      </div>
    `;
  }

  // When enabled, render the full-screen interactive AI workspace
  setTimeout(() => {
    initDedicatedChatbot();
  }, 50);

  return `
    <div class="max-w-5xl mx-auto space-y-4 fade-in">
      <!-- Chatbot Hub Top Banner -->
      <div class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-2xl bg-white/15 backdrop-blur-md border border-white/20 flex items-center justify-center text-2xl shrink-0 shadow-inner">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h2 class="text-lg font-extrabold tracking-tight">Divine AI Assistant & Doubts Helpdesk</h2>
              <span id="page-gemini-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-wider uppercase bg-amber-400 text-slate-900 flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Gemini AI
              </span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live Online
              </span>
            </div>
            <p class="text-xs text-indigo-100 mt-1 max-w-xl">
              Ask any academic doubt in Physics, Chemistry, Maths & Biology, check real-time student dues & marks, or use oral voice recognition to speak and add students.
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="dedicated-gemini-config-btn" type="button" onclick="toggleGeminiSettingsDrawer()" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 backdrop-blur-xs border border-white/20 text-xs font-semibold flex items-center gap-2 transition cursor-pointer" title="Configure Gemini & ChatGPT API Keys">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
            <span>AI Keys & Models</span>
          </button>
          <button type="button" onclick="resetDivineChatbot()" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 backdrop-blur-xs border border-white/20 text-xs font-semibold flex items-center gap-2 transition cursor-pointer">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- Main Dedicated Chat Workspace Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <!-- Left Sidebar: Quick Actions & Help Topics -->
        <div class="lg:col-span-1 space-y-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-xs space-y-3">
            <h4 class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-bolt text-amber-500"></i>
              <span>Quick Prompts</span>
            </h4>
            <div class="space-y-1.5">
              <button onclick="handleQuickPillClick('My live fee dues')" class="w-full text-left px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:text-indigo-600 text-xs text-slate-700 dark:text-slate-300 transition flex items-center justify-between group">
                <span>💰 Live Fee Status</span>
                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400 group-hover:translate-x-0.5 transition-transform"></i>
              </button>
              <button onclick="handleQuickPillClick('Today class timing')" class="w-full text-left px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:text-indigo-600 text-xs text-slate-700 dark:text-slate-300 transition flex items-center justify-between group">
                <span>⏰ Class Timetable</span>
                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400 group-hover:translate-x-0.5 transition-transform"></i>
              </button>
              <button onclick="handleQuickPillClick('Institute Address & Helpline')" class="w-full text-left px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:text-indigo-600 text-xs text-slate-700 dark:text-slate-300 transition flex items-center justify-between group">
                <span>📍 Coaching Helpline</span>
                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400 group-hover:translate-x-0.5 transition-transform"></i>
              </button>
              <button onclick="handleQuickPillClick('Explain Ohms Law with formula and units')" class="w-full text-left px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:text-indigo-600 text-xs text-slate-700 dark:text-slate-300 transition flex items-center justify-between group">
                <span>⚡ Ohm's Law</span>
                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400 group-hover:translate-x-0.5 transition-transform"></i>
              </button>
              <button onclick="handleQuickPillClick('Explain Newtons three laws of motion with examples')" class="w-full text-left px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:text-indigo-600 text-xs text-slate-700 dark:text-slate-300 transition flex items-center justify-between group">
                <span>🍎 Newton's Laws</span>
                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400 group-hover:translate-x-0.5 transition-transform"></i>
              </button>
            </div>
          </div>

          <!-- Oral Voice Student Enrollment Card -->
          <div class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 dark:from-indigo-950/30 dark:via-purple-950/30 dark:to-pink-950/30 border border-indigo-100 dark:border-indigo-900/40 rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center gap-2 text-indigo-700 dark:text-indigo-300">
              <i class="fa-solid fa-microphone-lines text-base"></i>
              <h5 class="text-xs font-bold">Oral Voice Admission</h5>
            </div>
            <p class="text-[11px] text-slate-600 dark:text-slate-400 leading-relaxed">
              Click the microphone button and speak aloud:
              <br><em class="text-indigo-600 dark:text-indigo-400 font-semibold">"Add student Rahul Sharma, father Mukesh Sharma, phone 9876543210, batch Class 11 Physics, fee 12000"</em>
            </p>
          </div>
        </div>

        <!-- Right 3 Cols: Dedicated Chat Stream & Input -->
        <div class="lg:col-span-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm flex flex-col h-[650px] overflow-hidden">
          <!-- Voice Listening Banner -->
          <div id="dedicated-voice-banner" class="hidden bg-rose-500 text-white px-4 py-2 text-xs flex items-center justify-between shrink-0 shadow-inner animate-pulse">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-microphone-lines"></i>
              <span class="font-bold">Listening orally... Speak clearly into your microphone!</span>
            </div>
            <button type="button" onclick="stopChatbotVoiceRecognition()" class="px-2 py-0.5 bg-black/20 hover:bg-black/30 rounded text-[10px] font-bold">Stop</button>
          </div>

          <!-- Chat Stream Messages Container -->
          <div id="dedicated-chatbot-messages" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
            <!-- Messages populated by script -->
          </div>

          <!-- Bottom Form -->
          <form onsubmit="handleDedicatedChatbotSubmit(event)" class="p-3 sm:p-4 bg-slate-50 dark:bg-slate-900/90 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2 shrink-0">
            <button type="button" id="dedicated-chatbot-voice-btn" onclick="toggleChatbotVoiceRecognition()" title="Speak orally to ask doubts or add students" class="w-10 h-10 rounded-2xl bg-white dark:bg-slate-800 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950/60 dark:hover:text-indigo-400 text-slate-600 dark:text-slate-300 flex items-center justify-center transition shadow-xs cursor-pointer shrink-0 border border-slate-200 dark:border-slate-700">
              <i id="dedicated-mic-icon" class="fa-solid fa-microphone text-sm"></i>
            </button>
            <input type="text" id="dedicated-chatbot-input" placeholder="Ask any academic doubt or say 'Add student Rahul, phone 9876543210...'" class="flex-1 px-4 py-2.5 bg-white dark:bg-slate-800 dark:text-slate-100 rounded-2xl text-xs border border-slate-200 dark:border-slate-700 focus:border-indigo-500 focus:outline-none transition shadow-inner" autocomplete="off">
            <button type="submit" class="w-10 h-10 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center transition shadow-md shadow-indigo-600/30 cursor-pointer shrink-0">
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  `;
}

function initDedicatedChatbot() {
  const container = document.getElementById('dedicated-chatbot-messages');
  if (!container) return;
  if (window.divineChatbotState && window.divineChatbotState.messages && window.divineChatbotState.messages.length > 0) {
    container.innerHTML = '';
    window.divineChatbotState.messages.forEach(m => {
      appendDedicatedChatMessage(m.role, m.text);
    });
  } else {
    const isStudent = state.currentRole === 'student';
    const welcome = isStudent
      ? `👋 **Namaste! I am Divine AI Assistant.**\n\nI can help you check your live fee dues, attendance records, test marks, and solve academic doubts in Physics, Chemistry, Maths & Biology. How can I assist you today?`
      : `👋 **Namaste! I am Divine AI Assistant & Institute Helpdesk.**\n\nAsk any question, resolve physics/maths doubts, or speak aloud to enroll students orally. Type below or press the microphone!`;
    appendDedicatedChatMessage('bot', welcome);
  }
}

function appendDedicatedChatMessage(role, text) {
  const container = document.getElementById('dedicated-chatbot-messages');
  if (!container) return;
  const isBot = role === 'bot' || role === 'model';
  const bubble = document.createElement('div');
  bubble.className = isBot ? 'flex gap-3 max-w-2xl' : 'flex justify-end';

  const formatted = typeof formatGeminiMarkdown === 'function' ? formatGeminiMarkdown(text) : text;

  if (isBot) {
    bubble.innerHTML = `
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white flex items-center justify-center text-xs shrink-0 shadow-xs">
        <i class="fa-solid fa-robot"></i>
      </div>
      <div class="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl rounded-tl-xs px-4 py-3 text-xs shadow-xs space-y-1.5 leading-relaxed overflow-x-auto">
        ${formatted}
      </div>
    `;
  } else {
    bubble.innerHTML = `
      <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-xs px-4 py-2.5 text-xs shadow-xs max-w-lg leading-relaxed">
        ${formatted}
      </div>
    `;
  }
  container.appendChild(bubble);
  container.scrollTop = container.scrollHeight;
}

function handleDedicatedChatbotSubmit(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('dedicated-chatbot-input');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  appendDedicatedChatMessage('user', val);

  const drawerInput = document.getElementById('chatbot-input');
  if (drawerInput) drawerInput.value = val;
  if (typeof handleChatbotSubmit === 'function') {
    handleChatbotSubmit(e);
  }
}
</script>
