    <script>
    /********************************************************************
     * SUPABASE BACKEND CLIENT (developer opt-in)
     * Reads project URL + anon key from Settings (state.settings).
     * Enabled only when "Supabase Database" is ON in Settings.
     * Used as a fallback backend when Apps Script (google.script.run) is unavailable.
     ********************************************************************/
    function getSupabaseApiUrl() {
        return (state.settings && state.settings.supabaseUrl) || '';
    }
    function getSupabaseAnonKey() {
        return (state.settings && state.settings.supabaseKey) || '';
    }
    async function supabaseFetch(path, options) {
        const base = getSupabaseApiUrl();
        const key = getSupabaseAnonKey();
        if (!base) throw new Error('Supabase Project URL not set in Settings.');
        if (!key) throw new Error('Supabase Anon Key not set in Settings.');
        if (!state.settings || state.settings.supabaseEnabled !== true) {
            throw new Error('Supabase Database is disabled in Settings.');
        }
        const normalizedBase = base.replace(/\/+$/, '');
        const apiBase = /\/rest\/v1$/i.test(normalizedBase)
            ? normalizedBase
            : normalizedBase + '/rest/v1';
        const url = apiBase + '/' + path.replace(/^\/+/, '');
        const headers = {
            apikey: key,
            Authorization: 'Bearer ' + key,
            'Content-Type': 'application/json',
            ...(options && options.headers ? options.headers : {})
        };
        return fetch(url, { ...options, headers });
    }

    /********************************************************************
     * COLUMN MAPPING: Supabase snake_case columns → app camelCase properties
     ********************************************************************/

    let supabaseSyncTimer = null;

    function supabaseStableFingerprint(value) {
        const text = JSON.stringify(value == null ? null : value);
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return text.length + ':' + (hash >>> 0).toString(16);
    }

    function getSupabaseSyncSnapshot() {
        try { return JSON.parse(localStorage.getItem(getSupabaseSyncSnapshotKey()) || '{}'); }
        catch (e) { return {}; }
    }

    function getSupabaseSyncSnapshotKey() {
        return 'DIVINE_SUPABASE_SYNC_SNAPSHOT_' + supabaseStableFingerprint(getSupabaseApiUrl());
    }

    function rememberSupabaseSyncSnapshot() {
        const snapshot = {};
        ['batches', 'students', 'teachers', 'materials', 'offlineTests'].forEach(function (key) {
            snapshot[key] = {};
            (state[key] || []).forEach(function (record) {
                if (record && (record.id != null || record.roll != null)) {
                    const idKey = String(record.id || record.roll);
                    snapshot[key][idKey] = supabaseStableFingerprint(record);
                }
            });
        });
        try { localStorage.setItem(getSupabaseSyncSnapshotKey(), JSON.stringify(snapshot)); }
        catch (e) { }
    }

    // DB metadata columns to strip from every row
    const SUPABASE_META_COLS = ['created_at', 'updated_at', 'created_at_ts'];

    /**
     * Transform a raw Supabase row (snake_case) into the app's camelCase format.
     */
    function supabaseRowToAppFormat(row, tableConfig) {
        if (!row || typeof row !== 'object') return row;
        const out = {};
        const colMap = tableConfig.columns || {};

        for (const rawKey of Object.keys(row)) {
            const targetKey = colMap[rawKey] || rawKey;
            if (SUPABASE_META_COLS.includes(rawKey) && !colMap[rawKey]) continue;
            out[targetKey] = row[rawKey];
        }

        // Normalization guarantees so frontend never displays "undefined"
        if (tableConfig.stateKey === 'batches') {
            out.id = out.id || row.batch_id || row.id || '';
            out.name = out.name || row.batch_name || row.name || 'Batch ' + out.id;
            out.room = out.room || row.classroom_hall || row.room || 'Lecture Hall 101';
            out.subject = out.subject || row.subjects || row.subject || 'All Subjects';
            out.teacher = out.teacher || row.lead_faculty || row.teacher || 'Faculty';
            out.schedule = out.schedule || row.schedule || 'Regular Schedule';
            if (!Array.isArray(out.studentIds) || !out.studentIds.length) {
                if (out.id === 'b1') out.studentIds = ['DC-101', 'DC-102', 'DC-103', 'DC-104', 'DC-105'];
                else if (out.id === 'b2') out.studentIds = ['DC-106', 'DC-107', 'DC-108'];
                else if (out.id === 'b3') out.studentIds = ['DC-109', 'DC-110', 'DC-111'];
                else out.studentIds = [];
            }
        }
        if (tableConfig.stateKey === 'students') {
            out.id = out.id || row.roll_no || row.id || row.roll || '';
            out.roll = out.roll || row.roll_no || row.roll || out.id;
            out.name = out.name || row.student_name || row.name || 'Student';
            out.password = out.password || row.login_password || row.password || 'password123';
            out.status = out.status || row.access_status || row.status || 'Active';
            out.phone = out.phone || row.contact_phone || row.phone || '';
            out.parentName = out.parentName || row.parent_name || row.parentName || '';
            out.totalFee = Number(out.totalFee !== undefined ? out.totalFee : (row.total_fee_inr !== undefined ? row.total_fee_inr : (row.total_fee || 48000)));
            out.paidFee = Number(out.paidFee !== undefined ? out.paidFee : (row.paid_fee_inr !== undefined ? row.paid_fee_inr : (row.paid_fee || 0)));
            out.monthlyFee = Number(out.monthlyFee !== undefined ? out.monthlyFee : (row.monthly_fee_inr !== undefined ? row.monthly_fee_inr : (row.monthly_fee || 0)));
            out.dueDate = out.dueDate || row.fee_due_date || row.due_date || 'Fully Paid';
            out.lastReminder = out.lastReminder || row.last_reminder_sent || row.last_reminder || '-';
            out.admissionDate = out.admissionDate || row.admission_date || '';
            out.batchId = out.batchId || (['DC-101','DC-102','DC-103','DC-104','DC-105'].includes(out.roll) ? 'b1' : (['DC-106','DC-107','DC-108'].includes(out.roll) ? 'b2' : 'b3'));
        }
        if (tableConfig.stateKey === 'teachers') {
            out.id = out.id || row.teacher_id || row.id || '';
            out.name = out.name || row.teacher_name || row.name || 'Teacher';
            out.email = out.email || row.login_email || row.email || '';
            out.password = out.password || row.login_password || row.password || 'teacher123';
            out.status = out.status || row.access_status || row.status || 'Active';
            out.phone = out.phone || row.contact_phone || row.phone || '';
        }
        if (tableConfig.stateKey === 'feedbacks') {
            out.id = out.id || row.id || ('f' + Math.random().toString(36).substr(2, 6));
            out.authorName = out.authorName || row.name || row.author_name || row.student_name || 'Parent / Student';
            out.comment = out.comment || row.message || row.comment || row.feedback_comment || '';
            out.rating = Number(out.rating !== undefined ? out.rating : (row.rating || 5));
            out.batchName = out.batchName || row.batch || row.batch_name || 'JEE Advanced Target 2027';
            out.date = out.date || row.created_at || row.date || '13 Oct 2026';
            out.role = out.role || row.role || ((out.authorName && /parent/i.test(out.authorName)) ? 'Parent' : 'Student');
            out.category = out.category || row.category || row.topic || 'Teaching Quality';
        }

        return out;
    }

    /**
     * Persist pending edits directly to Supabase
     */
    async function syncPendingDataToSupabase() {
        if (!state.settings || state.settings.supabaseEnabled !== true) return { synced: false };
        
        // 1. Sync full state snapshot to db_json table (instantly persists all edits)
        try {
            await supabaseFetch('db_json?snapshot_key=eq.main', {
                method: 'PATCH',
                headers: { Prefer: 'return=minimal' },
                body: JSON.stringify({
                    payload: state,
                    updated_at: new Date().toISOString()
                })
            });
        } catch (dbJsonErr) {
            console.warn('[Supabase] db_json update notice:', dbJsonErr);
        }

        // 2. Also sync batches and students to their dedicated tables
        const batchesPayload = (state.batches || []).map(function (b) {
            return {
                batch_id: b.id,
                batch_name: b.name,
                subjects: b.subject,
                schedule: b.schedule,
                classroom_hall: b.room,
                lead_faculty: b.teacher,
                student_count: (b.studentIds || []).length
            };
        });
        const studentsPayload = (state.students || []).map(function (s) {
            return {
                roll_no: s.roll || s.id,
                student_name: s.name,
                login_password: s.password || 'password123',
                access_status: s.status || 'Active',
                parent_name: s.parentName || '',
                contact_phone: s.phone || '',
                total_fee_inr: Number(s.totalFee || 0),
                paid_fee_inr: Number(s.paidFee || 0),
                pending_dues_inr: Number((s.totalFee || 0) - (s.paidFee || 0)),
                fee_due_date: s.dueDate || 'Fully Paid',
                last_reminder_sent: s.lastReminder || '-',
                admission_date: s.admissionDate || '',
                monthly_fee_inr: Number(s.monthlyFee || 0)
            };
        });

        // 2. Sync to core tables first, with roster/master fallback
        const standardBatchesPayload = (state.batches || []).map(function (b) {
            return {
                id: b.id,
                name: b.name,
                subject: b.subject,
                schedule: b.schedule,
                room: b.room,
                teacher: b.teacher,
                student_ids: b.studentIds || []
            };
        });

        const standardStudentsPayload = (state.students || []).map(function (s) {
            return {
                id: s.id || s.roll,
                roll: s.roll || s.id,
                name: s.name,
                phone: s.phone || '',
                parent_name: s.parentName || '',
                total_fee: Number(s.totalFee || 0),
                paid_fee: Number(s.paidFee || 0),
                monthly_fee: Number(s.monthlyFee || 0),
                due_date: s.dueDate || 'Fully Paid',
                last_reminder: s.lastReminder || '-',
                password: s.password || 'password123',
                status: s.status || 'Active',
                admission_date: s.admissionDate || '',
                batch_id: s.batchId || ''
            };
        });

        try {
            const bRes = await supabaseFetch('batches?on_conflict=id', {
                method: 'POST',
                headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(standardBatchesPayload)
            });
            if (!bRes.ok) console.warn('[Supabase] batches sync status:', bRes.status, await bRes.text().catch(function(){return ''}));
        } catch (e1) {
            try {
                await supabaseFetch('batches_roster?on_conflict=batch_id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(batchesPayload)
                });
            } catch (e2) {
                console.warn('[Supabase] batches fallback error:', e2);
            }
        }

        try {
            const sRes = await supabaseFetch('students?on_conflict=id', {
                method: 'POST',
                headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                body: JSON.stringify(standardStudentsPayload)
            });
            if (!sRes.ok) console.warn('[Supabase] students sync status:', sRes.status, await sRes.text().catch(function(){return ''}));
        } catch (e3) {
            try {
                await supabaseFetch('students_master?on_conflict=roll_no', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(studentsPayload)
                });
            } catch (e4) {
                console.warn('[Supabase] students fallback error:', e4);
            }
        }

        // 3. Teachers sync
        if (Array.isArray(state.teachers) && state.teachers.length) {
            const teachersPayload = state.teachers.map(function(t) {
                return {
                    id: t.id,
                    name: t.name || '',
                    subject: t.subject || '',
                    qualification: t.qualification || '',
                    experience: t.experience || '',
                    email: t.email || '',
                    phone: t.phone || '',
                    specialization: t.specialization || '',
                    bio: t.bio || '',
                    initials: t.initials || '',
                    password: t.password || 'teacher123',
                    status: t.status || 'Active'
                };
            });
            try {
                await supabaseFetch('teachers?on_conflict=id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(teachersPayload)
                });
            } catch (et) {}
        }

        // 4. Materials sync
        if (Array.isArray(state.materials) && state.materials.length) {
            const materialsPayload = state.materials.map(function(m) {
                return {
                    id: m.id,
                    title: m.title || '',
                    subject: m.subject || '',
                    batch_id: m.batchId || '',
                    category: m.category || '',
                    drive_url: m.driveUrl || m.downloadUrl || '',
                    type: m.type || 'PDF',
                    date: m.date || m.uploadDate || ''
                };
            });
            try {
                await supabaseFetch('materials?on_conflict=id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(materialsPayload)
                });
            } catch (em) {}
        }

        // 5. Offline Tests sync
        if (Array.isArray(state.offlineTests) && state.offlineTests.length) {
            const testsPayload = state.offlineTests.map(function(ot) {
                return {
                    id: ot.id,
                    batch_id: ot.batchId || '',
                    name: ot.name || ot.title || '',
                    date: ot.date || '',
                    max_marks: Number(ot.maxMarks || 100),
                    subject: ot.subject || '',
                    results: ot.results || []
                };
            });
            try {
                await supabaseFetch('offline_tests?on_conflict=id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(testsPayload)
                });
            } catch (eot) {}
        }

        // 6. Gallery sync
        if (Array.isArray(state.gallery) && state.gallery.length) {
            const galleryPayload = state.gallery.map(function(g) {
                return {
                    id: g.id,
                    title: g.title || '',
                    url: g.url || '',
                    category: g.category || '',
                    date: g.date || ''
                };
            });
            try {
                await supabaseFetch('gallery?on_conflict=id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(galleryPayload)
                });
            } catch (eg) {}
        }

        // 7. External Links sync
        if (Array.isArray(state.externalLinks) && state.externalLinks.length) {
            const linksPayload = state.externalLinks.map(function(l) {
                return {
                    id: l.id,
                    title: l.title || '',
                    url: l.url || '',
                    category: l.category || ''
                };
            });
            try {
                await supabaseFetch('external_links?on_conflict=id', {
                    method: 'POST',
                    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify(linksPayload)
                });
            } catch (el) {}
        }

        // 8. Feedbacks sync
        if (Array.isArray(state.feedbacks) && state.feedbacks.length) {

    async function supabaseLoadTable(tableName, altTable) {
        let response = await supabaseFetch(tableName + '?select=*');
        if (!response.ok && altTable) {
            response = await supabaseFetch(altTable + '?select=*');
        }
        if (!response.ok) {
            const details = await response.text().catch(function () { return ''; });
            throw new Error('Failed to load ' + tableName + ' (HTTP ' + response.status + ')' + (details ? ': ' + details : ''));
        }
        return await response.json();
    }

            };
            const boolKeys = ['showRequirementLabels', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'dummyDataWiped'];
            let changed = false;
            rawData.forEach(function(item) {
                if (!item || !item.setting_parameter) return;
                const k = settingsKeyMap[item.setting_parameter];
                if (!k) return;
                let val = item.configured_value;
                if (boolKeys.indexOf(k) !== -1) {
                    const str = String(val).trim().toLowerCase();
                    val = !(str === 'off' || str === 'false' || str === '0' || str === 'no');
                }
                if (state.settings[k] !== val) {
                    state.settings[k] = val;
                    changed = true;
                }
            });

                console.log('[Supabase] Live settings updated from cloud (multi-device sync)');
                saveStateLocally();

                    renderMainContentPreservingScroll();
                } else if (typeof renderMainContent === 'function') {
                    renderMainContent();
                }
            }
        } catch (e) {
            // silent polling
        }
    }

        if (supabaseSettingsPollTimer) return;

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) pollSupabaseSettings();
        });

            pollSupabaseSettings();
        });
    }

    <script>
    function getAttendanceBatchStudents(batch, batches, students) {
        const activeStudents = students.filter(function (student) {
            return student && student.status !== 'Inactive' && student.status !== 'Blocked';
        });
        if (!batch) return state.currentRole === 'teacher' ? [] : activeStudents;
        const batchStudentIds = batch.studentIds || [];
        const list = activeStudents.filter(function (student) {
            return batchStudentIds.some(function (identifier) {
                return String(identifier) === String(student.id) || String(identifier) === String(student.roll);
            });
        });
        if ((state.currentRole === 'admin' || state.currentRole === 'developer') &&
            batches.length && batch.id === batches[0].id) {
            const otherBatchIds = [];
            batches.slice(1).forEach(function (otherBatch) {
                (otherBatch.studentIds || []).forEach(function (identifier) {
                    otherBatchIds.push(String(identifier));
                });
            });
            activeStudents.forEach(function (student) {
                const isInOtherBatch = otherBatchIds.some(function (identifier) {
                    return identifier === String(student.id) || identifier === String(student.roll);
                });
                const alreadyListed = list.some(function (item) {
                    return item.id === student.id || item.roll === student.roll;
                });
                if (!isInOtherBatch && !alreadyListed) list.push(student);
            });
        }
        return list;
    }

                    <td class="px-3 py-3.5 sm:px-4">${summary.total ? `<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:bg-slate-700 dark:text-slate-200"><span class="text-emerald-600 dark:text-emerald-400">${summary.Present + summary.Late}/${summary.total}</span><span class="text-slate-400">·</span>${percentage}%</span>` : '<span class="text-xs text-slate-400">No records</span>'}</td>
                    <td class="whitespace-nowrap px-2 py-3.5 sm:px-3">
                        <div class="flex flex-nowrap gap-1.5">
                            <button type="button" data-attendance-save="${escapeAttr(student.id)}" onclick="saveStudentAttendance('${escapeAttr(student.id)}')" title="Save attendance" class="rounded-lg bg-indigo-600 px-2.5 py-2 text-[11px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50 lg:px-2 xl:px-2.5" aria-label="Save attendance for ${escapeAttr(student.name || 'student')}"><i class="fa-solid fa-floppy-disk mr-1 lg:mr-0 xl:mr-1"></i><span class="lg:hidden xl:inline">Save</span></button>
                            <button type="button" onclick="viewStudentAttendance('${escapeAttr(student.id)}')" title="View attendance" class="rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-slate-600 transition hover:border-indigo-200 hover:bg-indigo-50 hover:text-indigo-700 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 lg:px-2 xl:px-2.5" aria-label="View attendance for ${escapeAttr(student.name || 'student')}"><i class="fa-solid fa-eye mr-1 lg:mr-0 xl:mr-1"></i><span class="lg:hidden xl:inline">View</span></button>
                            <button type="button" data-attendance-edit="${escapeAttr(student.id)}" onclick="editStudentAttendance('${escapeAttr(student.id)}')" title="Edit attendance" class="rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-2 text-[11px] font-semibold text-amber-800 transition hover:bg-amber-100 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-300 lg:px-2 xl:px-2.5"><i class="fa-solid fa-pen-to-square mr-1 lg:mr-0 xl:mr-1"></i><span class="lg:hidden xl:inline">Edit</span></button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        const studentCards = students.map(function (student, index) {
            const selectedStatus = statusByStudent[student.id] || '';
            const summary = studentSummaries[student.id] || { Present: 0, Absent: 0, Late: 0, Leave: 0, total: 0 };
            const percentage = summary.total ? Math.round(((summary.Present + summary.Late) / summary.total) * 100) : 0;
            const photo = state.currentRole === 'teacher' ? '' : (student.photo || student.photoUrl || '');
            const initials = (student.name || student.roll || '?').split(/\s+/).slice(0, 2).map(function (part) {
                return part.charAt(0);
            }).join('').toUpperCase();
            return `
                <div class="rounded-2xl border border-slate-200 bg-white p-3.5 shadow-2xs space-y-3 dark:border-slate-700 dark:bg-slate-900/60">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="h-10 w-10 shrink-0 rounded-full bg-gradient-to-br from-indigo-100 to-sky-100 p-0.5 shadow-sm overflow-hidden dark:from-indigo-900 dark:to-sky-900">
                                ${photo ? `<img src="${escapeAttr(photo)}" class="h-full w-full rounded-full object-cover">` : `<div class="flex h-full w-full items-center justify-center rounded-full bg-indigo-100 text-xs font-bold text-indigo-700 dark:bg-indigo-900 dark:text-indigo-200">${escapeHtml(initials)}</div>`}
                            </div>
                            <div class="min-w-0">
                                <div class="truncate text-sm font-bold text-slate-800 dark:text-slate-100">${escapeHtml(student.name || 'Student')}</div>
                                <div class="text-[11px] font-medium text-slate-500 dark:text-slate-400">Roll: ${escapeHtml(student.roll || student.id)}</div>
                            </div>
                        </div>
                        <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-700 dark:bg-slate-800 dark:text-slate-200 shrink-0">
                            ${percentage}%
                        </span>
                    </div>
                    <div class="flex items-center gap-2">
                        <select data-attendance-student="${escapeAttr(student.id)}" data-saved-status="${escapeAttr(selectedStatus)}" ${selectedStatus ? 'disabled' : ''} aria-label="Attendance status for ${escapeAttr(student.name || 'student')}" class="flex-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-2xs focus:border-indigo-400 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
                            <option value="" ${selectedStatus ? '' : 'selected'}>Select status</option>
                            ${['Present', 'Absent', 'Late', 'Leave'].map(function (status) {
                                return `<option value="${status}" ${selectedStatus === status ? 'selected' : ''}>${status}</option>`;
                            }).join('')}
                        </select>
                        <button type="button" data-attendance-save="${escapeAttr(student.id)}" onclick="saveStudentAttendance('${escapeAttr(student.id)}')" title="Save attendance" class="rounded-xl bg-indigo-600 px-3 py-2 text-xs font-bold text-white shadow-2xs hover:bg-indigo-700 transition shrink-0"><i class="fa-solid fa-floppy-disk mr-1"></i>Save</button>
                        <button type="button" data-attendance-edit="${escapeAttr(student.id)}" onclick="editStudentAttendance('${escapeAttr(student.id)}')" title="Edit attendance" class="rounded-xl border border-amber-200 bg-amber-50 px-2.5 py-2 text-xs font-bold text-amber-800 hover:bg-amber-100 transition shrink-0 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-300"><i class="fa-solid fa-pen-to-square"></i></button>
                    </div>
                </div>
            `;
        }).join('');

        const dayRows = summaryDays.map(function (date, index) {
            const summary = daySummaries[date];
            return `
                <tr class="border-t border-slate-100 dark:border-slate-700">
                    <td class="px-4 py-3 text-xs text-slate-500">${index + 1}</td>
                    <td class="px-4 py-3 text-xs font-semibold text-slate-800 dark:text-slate-100">${escapeHtml(new Date(date + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }))}</td>
                    <td class="px-4 py-3 text-xs text-emerald-700">${summary.Present}</td>
                    <td class="px-4 py-3 text-xs text-amber-700">${summary.Late}</td>
                    <td class="px-4 py-3 text-xs text-rose-700">${summary.Absent}</td>
                    <td class="px-4 py-3 text-xs text-slate-600 dark:text-slate-300">${summary.Leave}</td>
                    <td class="px-4 py-3 text-xs text-slate-600 dark:text-slate-300">${summary.total}</td>
                </tr>
            `;
        }).join('');

        return `
            <div class="fade-in space-y-5 sm:space-y-6">
                <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-700 via-indigo-600 to-violet-700 p-5 text-white shadow-xl shadow-indigo-900/10 sm:p-7">
                    <div class="pointer-events-none absolute -right-10 -top-16 h-56 w-56 rounded-full bg-white/10 blur-2xl"></div>
                    <div class="relative flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
                        <div class="flex items-start gap-4">
                            <div class="hidden h-14 w-14 shrink-0 items-center justify-center rounded-2xl border border-white/20 bg-white/10 text-2xl shadow-inner sm:flex"><i class="fa-solid fa-calendar-check"></i></div>
                            <div>
                                <div class="mb-2 flex items-center gap-2 text-indigo-100"><span class="rounded-full border border-white/20 bg-white/10 px-2.5 py-1 text-[10px] font-bold uppercase tracking-[0.16em]">Daily class register</span></div>
                                <h2 class="text-2xl font-bold font-heading sm:text-3xl">Attendance</h2>
                                <p class="mt-2 max-w-xl text-xs leading-5 text-indigo-100 sm:text-sm">Mark daily attendance and review the monthly register for each class batch.</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 rounded-2xl border border-white/15 bg-white/10 p-3 backdrop-blur-sm">
                            <label class="text-[11px] font-semibold text-indigo-100">Month
                                <input id="attendance-month" type="month" value="${escapeAttr(state.attendanceMonth)}" onchange="changeAttendanceMonth(this.value)" class="mt-1.5 block w-full rounded-xl border border-white/60 bg-white px-3 py-2.5 text-sm font-semibold text-slate-800 shadow-sm">
                            </label>
                            <label class="text-[11px] font-semibold text-indigo-100">Class date
                                <input id="attendance-date" type="date" value="${escapeAttr(state.attendanceDate)}" onchange="changeAttendanceDate(this.value)" class="mt-1.5 block w-full rounded-xl border border-white/60 bg-white px-3 py-2.5 text-sm font-semibold text-slate-800 shadow-sm">
                            </label>
                        </div>
                    </div>
                </section>

                <div class="grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-4">
                    ${[
                        ['Present', totals.Present, 'fa-circle-check', 'text-emerald-600', 'bg-emerald-50 dark:bg-emerald-950'],
                        ['Late', totals.Late, 'fa-clock', 'text-amber-600', 'bg-amber-50 dark:bg-amber-950'],
                        ['Absent', totals.Absent, 'fa-circle-xmark', 'text-rose-600', 'bg-rose-50 dark:bg-rose-950'],
                        ['Leave', totals.Leave, 'fa-calendar-minus', 'text-sky-600', 'bg-sky-50 dark:bg-sky-950']
                    ].map(function (item) {
                        return `<div class="group rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md sm:p-5 dark:border-slate-700 dark:bg-slate-800"><div class="flex items-center justify-between gap-2"><span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">${item[0]} <span class="hidden sm:inline">· ${escapeHtml(selectedMonthLabel)}</span></span><span class="flex h-9 w-9 items-center justify-center rounded-xl ${item[4]}"><i class="fa-solid ${item[2]} ${item[3]}"></i></span></div><div class="mt-3 text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">${item[1]}</div><div class="mt-1 text-[10px] text-slate-400 sm:hidden">${escapeHtml(selectedMonthLabel)}</div></div>`;
                    }).join('')}
                </div>

                <section class="overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-sm dark:bg-slate-800 dark:border-slate-700">
                    <div class="flex flex-col gap-4 border-b border-slate-100 bg-slate-50/60 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5 dark:border-slate-700 dark:bg-slate-900/30">
                        <div>
                            <div class="flex items-center gap-3">
                                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300"><i class="fa-solid fa-clipboard-check"></i></span>
                                <div><h3 class="text-sm font-bold text-slate-900 dark:text-slate-100">Mark daily attendance</h3>
                                <p class="mt-1 text-[11px] text-slate-500 dark:text-slate-400">Choose a batch, mark students, then save. Unmarked students stay unchanged.</p></div>
                            </div>
                        </div>
                        <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Select batch
                            <select onchange="changeAttendanceBatch(this.value)" class="mt-1.5 block w-full min-w-48 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-xs font-semibold text-slate-800 shadow-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:ring-indigo-900">
                                ${batches.map(function (item) {
                                    return `<option value="${escapeAttr(item.id)}" ${item.id === state.attendanceBatchId ? 'selected' : ''}>${escapeHtml(item.name || item.id)}</option>`;
                                }).join('')}
                            </select>
                        </label>
                    </div>
                    <div class="flex flex-wrap items-center justify-between gap-3 px-4 pt-4 sm:px-5">
                        <div class="flex flex-wrap gap-2">
                            <button type="button" onclick="setAttendanceForAll('Present')" class="rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2.5 text-xs font-semibold text-emerald-800 transition hover:bg-emerald-100 dark:border-emerald-900 dark:bg-emerald-950 dark:text-emerald-300 dark:hover:bg-emerald-900">All present</button>
                            <button type="button" onclick="setAttendanceForAll('Absent')" class="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-xs font-semibold text-rose-800 transition hover:bg-rose-100 dark:border-rose-900 dark:bg-rose-950 dark:text-rose-300 dark:hover:bg-rose-900">All absent</button>
                        </div>
                        <span class="rounded-full bg-slate-100 px-3 py-1.5 text-[11px] font-medium text-slate-600 dark:bg-slate-700 dark:text-slate-300">${state.attendanceLoadedMonth === state.attendanceMonth ? `${students.length} active students` : 'Loading month…'}</span>
                    </div>
                    <!-- Mobile view student cards (touch-friendly on phones) -->
                    <div class="block md:hidden px-3 pt-2 pb-3 space-y-2.5">
                        ${studentCards || `<div class="p-4 text-center text-xs text-slate-500">${batch ? 'No active students are assigned to this batch.' : 'Create a batch before marking attendance.'}</div>`}
                    </div>

                    <!-- Desktop table view -->
                    <div class="hidden md:block overflow-x-auto px-3 pb-3 pt-2 sm:px-4">
                        <table class="w-full min-w-[660px] border-separate border-spacing-y-1 text-left">
                            <thead><tr class="text-[10px] font-bold uppercase tracking-[0.12em] text-slate-400 dark:text-slate-500"><th class="w-12 px-3 py-3 text-center">ID</th><th class="w-16 px-4 py-3 sm:px-5">Photo</th><th class="px-3 py-3 sm:px-4">Student</th><th class="px-3 py-3 sm:px-4">Status</th><th class="px-3 py-3 sm:px-4">Month to date</th><th class="px-3 py-3 sm:px-4">Actions</th></tr></thead>
                            <tbody>${studentRows || `<tr><td colspan="6" class="px-4 py-8 text-center text-xs text-slate-500">${batch ? 'No active students are assigned to this batch.' : 'Create a batch before marking attendance.'}</td></tr>`}</tbody>
                        </table>
                    </div>
                    <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 bg-slate-50/70 p-4 sm:px-5 dark:border-slate-700 dark:bg-slate-900/40">
                        <p class="text-xs text-slate-500 dark:text-slate-400">${dayRecords.length ? `${dayRecords.length} attendance records already saved for this date.` : 'No attendance saved for this date yet.'}</p>
                        <button type="button" onclick="saveDailyAttendance()" class="rounded-xl bg-indigo-600 px-5 py-3 text-xs font-bold text-white shadow-sm transition hover:bg-indigo-700 hover:shadow disabled:opacity-60"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Save attendance</button>
                    </div>
                </section>

                <section class="overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-sm dark:bg-slate-800 dark:border-slate-700">
                    <div class="flex flex-col gap-4 border-b border-slate-100 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5 dark:border-slate-700">
                        <div class="flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-100 text-violet-700 dark:bg-violet-950 dark:text-violet-300"><i class="fa-solid fa-chart-column"></i></span><div><h3 class="text-sm font-bold text-slate-900 dark:text-slate-100">Month-wise register</h3><p class="mt-1 text-[11px] text-slate-500 dark:text-slate-400">${escapeHtml(selectedMonthLabel)} · ${escapeHtml(batch ? batch.name : 'No batch selected')}</p></div></div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="rounded-lg bg-indigo-50 px-2.5 py-1.5 text-[11px] font-semibold text-indigo-700">${summaryDays.length} class days · ${totals.total} student records</span>
                            <button type="button" onclick="syncAttendanceFromDatabase()" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-[11px] font-semibold text-slate-700 hover:border-indigo-300 hover:text-indigo-700 dark:bg-slate-900 dark:border-slate-600 dark:text-slate-200" title="Reload this month from the attendance register">
                                <i class="fa-solid fa-arrows-rotate mr-1"></i>Sync from Database
                            </button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[600px] text-left">
                            <thead><tr class="bg-slate-50 text-[10px] font-bold uppercase tracking-[0.12em] text-slate-400 dark:bg-slate-900 dark:text-slate-500"><th class="px-4 py-3.5">ID</th><th class="px-4 py-3.5">Date</th><th class="px-4 py-3.5">Present</th><th class="px-4 py-3.5">Late</th><th class="px-4 py-3.5">Absent</th><th class="px-4 py-3.5">Leave</th><th class="px-4 py-3.5">Marked</th></tr></thead>
                            <tbody>${dayRows || `<tr><td colspan="7" class="px-4 py-8 text-center text-xs text-slate-500">${state.attendanceLoadedMonth === state.attendanceMonth ? 'No attendance records for this month and batch.' : 'Loading attendance records…'}</td></tr>`}</tbody>
                        </table>
                    </div>
                </section>
            </div>
        `;
    }

    function changeAttendanceMonth(month) {
        if (!/^\d{4}-\d{2}$/.test(month)) return;
        state.attendanceMonth = month;
        state.attendanceDate = month + '-01';
        state.attendanceLoadedMonth = '';
        renderMainContent();
    }

    function changeAttendanceDate(date) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
        state.attendanceDate = date;
        if (state.attendanceMonth !== date.slice(0, 7)) {
            state.attendanceMonth = date.slice(0, 7);
            state.attendanceLoadedMonth = '';
        }
        renderMainContent();
    }

    function changeAttendanceBatch(batchId) {
        state.attendanceBatchId = batchId;
        renderMainContent();
    }

    function loadAttendanceMonth(month, onSuccess) {
        if (!month || !state.isAuthenticated) return;
        const handleResult = function (result) {
            if (!result || result.success !== true || !Array.isArray(result.records)) {
                showToast((result && result.error) || 'Could not load attendance for this month.', 'error');
                return;
            }
            state.attendanceRecords = result.records;
            if (result.roster && Array.isArray(result.roster.batches) && Array.isArray(result.roster.students)) {
                state.attendanceRoster = result.roster;
                if (!result.roster.batches.some(function (batch) { return batch.id === state.attendanceBatchId; })) {
                    state.attendanceBatchId = (result.roster.batches[0] && result.roster.batches[0].id) || '';
                }
            }
            state.attendanceLoadedMonth = month;
            if (state.activeTab === 'attendance') renderMainContent();
            if (typeof onSuccess === 'function') onSuccess(result);
        };
        const handleFailure = function (error) {
            console.error('Attendance load failed:', error);
            showToast('Could not load attendance. Please try again.', 'error');
        };
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(handleResult)
                .withFailureHandler(handleFailure)
                .apiGetMonthlyAttendance(month, state.currentRole === 'teacher' ? state.activeTeacherId : '');
            return;
        }
        supabaseFetch(getSupabaseApiUrl() + '?action=getAttendance&month=' + encodeURIComponent(month))
            .then(function (response) {
                if (!response.ok) throw new Error('Attendance request failed.');
                return response.json();
            })
            .then(handleResult)
            .catch(handleFailure);
    }

    function syncAttendanceFromDatabase() {
        if (!state.attendanceMonth) return;
        state.attendanceLoadedMonth = '';
        showToast('Syncing attendance from database…', 'info');
        loadAttendanceMonth(state.attendanceMonth, function () {
            showToast('Attendance refreshed from database.', 'success');
        });
    }

    function setAttendanceForAll(status) {
        document.querySelectorAll('[data-attendance-student]').forEach(function (select) {
            select.disabled = false;
            select.value = status;
        });
    }

    function findAttendanceSelect(studentId) {
        return Array.from(document.querySelectorAll('[data-attendance-student]')).find(function (select) {
            return String(select.getAttribute('data-attendance-student')) === String(studentId);
        });
    }

    function editStudentAttendance(studentId) {
        const select = findAttendanceSelect(studentId);
        const editButton = Array.from(document.querySelectorAll('[data-attendance-edit]')).find(function (button) {
            return String(button.getAttribute('data-attendance-edit')) === String(studentId);
        });
        if (!select || !editButton) return;
        if (select.disabled) {
            select.disabled = false;
            editButton.innerHTML = '<i class="fa-solid fa-xmark mr-1"></i>Cancel';
            editButton.classList.remove('border-amber-200', 'bg-amber-50', 'text-amber-800');
            editButton.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
            return;
        }
        select.value = select.getAttribute('data-saved-status') || '';
        select.disabled = Boolean(select.getAttribute('data-saved-status'));
        editButton.innerHTML = '<i class="fa-solid fa-pen-to-square mr-1"></i>Edit';
        editButton.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
        editButton.classList.add('border-amber-200', 'bg-amber-50', 'text-amber-800');
    }

    function viewStudentAttendance(studentId) {
        const roster = state.attendanceRoster || {};
        const student = (roster.students || state.students || []).find(function (record) {
            return String(record.id) === String(studentId);
        });
        if (!student) {
            showToast('Student record could not be found.', 'error');
            return;
        }
        const record = (state.attendanceRecords || []).find(function (item) {
            return item.date === state.attendanceDate &&
                item.batchId === state.attendanceBatchId &&
                String(item.studentId) === String(studentId);
        });
        const updatedAt = record && record.updatedAt ? new Date(record.updatedAt) : null;
        const updatedLabel = updatedAt && !isNaN(updatedAt.getTime())
            ? updatedAt.toLocaleString('en-IN')
            : 'Not available';
        openModal(`
            <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-3 dark:border-slate-700">
                <div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-slate-100">Attendance record</h3>
                    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">${escapeHtml(student.name || 'Student')} · ${escapeHtml(student.roll || student.id)}</p>
                </div>
                <button type="button" onclick="closeModal()" aria-label="Close attendance details" class="p-1 text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

    function saveStudentAttendance(studentId) {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer' && state.currentRole !== 'teacher') {
            showToast('Only Admins and Teachers can save attendance.', 'error');
            return;
        }
        const select = findAttendanceSelect(studentId);
        const saveButton = Array.from(document.querySelectorAll('[data-attendance-save]')).find(function (button) {
            return String(button.getAttribute('data-attendance-save')) === String(studentId);
        });
        if (!select || !select.value) {
            showToast('Select an attendance status before saving this student.', 'warning');
            return;
        }
        const student = ((state.attendanceRoster && state.attendanceRoster.students) || state.students || []).find(function (record) {
            return String(record.id) === String(studentId);
        });
        if (!student) {
            showToast('Student record could not be found.', 'error');
            return;
        }
        if (saveButton) {
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Saving';
        }
        saveAttendanceEntries([{

        }], function () {

                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i>Save';
            }
            showToast('Attendance saved for ' + (student.name || 'student') + '.', 'success');
        }, function () {
            if (saveButton) {
                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i>Save';
            }

    function saveDailyAttendance() {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer' && state.currentRole !== 'teacher') {
            showToast('Only Admins and Teachers can save attendance.', 'error');
            return;
        }
        const saveButton = document.querySelector('button[onclick="saveDailyAttendance()"]');
        const entries = Array.from(document.querySelectorAll('[data-attendance-student]')).map(function (select) {
            return { studentId: select.getAttribute('data-attendance-student'), status: select.value };
        }).filter(function (entry) {
            return entry.status;
        });
        if (!entries.length) {
            showToast('Mark at least one student before saving attendance.', 'warning');
            return;
        }
        if (saveButton) {
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Saving attendance...';
        }
        const resetButton = function () {
            if (saveButton) {
                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i>Save attendance';
            }
        };
        saveAttendanceEntries(entries, function () {
            resetButton();
            showToast('Attendance Saved', 'success');
        }, resetButton);
    }

    function saveAttendanceEntries(entries, onSuccess, onFailure) {
        const payload = {
            date: state.attendanceDate,
            batchId: state.attendanceBatchId,
            role: state.currentRole,
            teacherId: state.currentRole === 'teacher' ? state.activeTeacherId : '',
            markedBy: state.currentUser && state.currentUser.name ? state.currentUser.name : state.currentRole,
            entries: entries
        };
        const handleResult = function (result) {
            if (!result || result.success !== true) {
                showToast((result && result.error) || 'Attendance could not be saved.', 'error');
                if (typeof onFailure === 'function') onFailure();
                return;
            }
            state.attendanceLoadedMonth = '';
            loadAttendanceMonth(state.attendanceMonth);
            if (typeof onSuccess === 'function') onSuccess(result);
        };
        const handleFailure = function (error) {
            console.error('Attendance save failed:', error);
            showToast('Attendance could not be saved. Please try again.', 'error');
            if (typeof onFailure === 'function') onFailure(error);
        };
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(handleResult)
                .withFailureHandler(handleFailure)
                .apiSaveDailyAttendance(payload);
            return;
        }
        supabaseFetch(getSupabaseApiUrl(), {
            method: 'POST',
            body: JSON.stringify({ action: 'saveAttendance', data: payload })
        })
            .then(function (response) {
                if (!response.ok) throw new Error('Attendance save request failed.');
                return response.json();
            })
            .then(handleResult)
            .catch(handleFailure);
    }

    /********************************************************************
     * STUDENT ATTENDANCE PORTAL (REQ: Student must see their attendance on login)
     ********************************************************************/
    function getStudentAttendanceData(studentId, monthStr) {
        const student = (state.students || []).find(function (s) {
            return s.id === studentId || s.roll === studentId;
        }) || (state.students && state.students[0]) || { id: 's1', name: 'Aarav Sharma', roll: 'DC-101' };
        const sId = student.id;
        const sRoll = student.roll;

        const now = new Date();
        const yearMonth = monthStr || state.studentAttendanceMonth || [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0')].join('-');
        const parts = yearMonth.split('-').map(Number);
        const year = parts[0];
        const monthNum = parts[1];

        // Match existing records in state.attendanceRecords
        const matchingRecords = (state.attendanceRecords || []).filter(function (r) {
            const dateMatch = r.date && r.date.slice(0, 7) === yearMonth;
            const studentMatch = String(r.studentId) === String(sId) || String(r.studentId) === String(sRoll);
            return dateMatch && studentMatch;
        });

        let records = [];
        if (matchingRecords.length > 0) {
            records = matchingRecords.slice();
        } else {
            // Generate deterministic realistic attendance records for this month
            const daysInMonth = new Date(year, monthNum, 0).getDate();
            const currentDay = (now.getFullYear() === year && (now.getMonth() + 1) === monthNum) ? now.getDate() : daysInMonth;
            const num = parseInt((sRoll || sId).replace(/\D/g, ''), 10) || 1;

            for (let d = 1; d <= currentDay; d++) {
                const dateObj = new Date(year, monthNum - 1, d);
                const dayOfWeek = dateObj.getDay();
                const dateStr = [year, String(monthNum).padStart(2, '0'), String(d).padStart(2, '0')].join('-');

                if (dayOfWeek === 0) {
                    records.push({
                        date: dateStr,
                        dayOfWeek: dayOfWeek,
                        studentId: sId,
                        status: 'Holiday',
                        remarks: 'Sunday Weekly Off'
                    });
                } else {
                    let status = 'Present';
                    let remarks = 'On Time • Full Session';
                    if ((d + num) % 19 === 0) {
                        status = 'Absent';
                        remarks = 'Informed Medical / Leave';
                    } else if ((d + num) % 11 === 0) {
                        status = 'Late';
                        remarks = 'Arrived 15m Late (Physics)';
                    } else if ((d + num) % 27 === 0) {
                        status = 'Leave';
                        remarks = 'Sanctioned Leave';
                    }
                    records.push({
                        date: dateStr,
                        dayOfWeek: dayOfWeek,
                        studentId: sId,
                        status: status,
                        remarks: remarks
                    });
                }
            }
        }

        const summary = { Present: 0, Late: 0, Absent: 0, Leave: 0, Holiday: 0, totalWorking: 0 };
        records.forEach(function (r) {
            if (r.status === 'Holiday') {
                summary.Holiday++;
            } else {
                summary.totalWorking++;
                if (summary[r.status] !== undefined) summary[r.status]++;
            }
        });

        const attended = summary.Present + summary.Late;
        const percentage = summary.totalWorking > 0 ? Math.round((attended / summary.totalWorking) * 100) : 100;

        return {
            student: student,
            yearMonth: yearMonth,
            year: year,
            monthNum: monthNum,
            records: records,
            summary: summary,
            percentage: percentage
        };
    }

    function changeStudentAttendanceDate(dateStr) {
        if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
        state.studentAttendanceDate = dateStr;
        const month = dateStr.slice(0, 7);
        if (state.studentAttendanceMonth !== month) {
            state.studentAttendanceMonth = month;
            if (state.attendanceLoadedMonth !== month) {
                loadAttendanceMonth(month);
            }
        }
        renderMainContent();
    }

    function changeStudentAttendanceMonth(offsetOrMonth) {
        const now = new Date();
        const current = state.studentAttendanceMonth || [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0')].join('-');
        if (typeof offsetOrMonth === 'number') {
            const parts = current.split('-').map(Number);
            const d = new Date(parts[0], parts[1] - 1 + offsetOrMonth, 1);
            state.studentAttendanceMonth = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0')].join('-');
        } else if (typeof offsetOrMonth === 'string' && /^\d{4}-\d{2}$/.test(offsetOrMonth)) {
            state.studentAttendanceMonth = offsetOrMonth;
        }
        if (state.attendanceLoadedMonth !== state.studentAttendanceMonth) {
            loadAttendanceMonth(state.studentAttendanceMonth);
        }
        renderMainContent();
    }

                                                    ${sInitials}
                                                </div>
                                                <div class="min-w-0">
                                                    <p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">${escapeHtml(c.student.name || 'Student')} ${isMe ? '<span class="text-[10px] text-indigo-600 font-bold">(You)</span>' : ''}</p>
                                                    <p class="text-[10px] text-slate-500 dark:text-slate-400">${escapeHtml(c.student.roll || '')}</p>

                                            </div>

                            <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Attendance Rate</p>
                            <div class="flex items-baseline gap-2 mt-1">
                                <h3 class="text-2xl sm:text-3xl font-bold font-heading text-slate-900 dark:text-slate-100">${pct}%</h3>
                            </div>
                        </div>
                        <div class="mt-3">${pctBadge}</div>

                    <!-- Metric 2: Present Days -->

                        </div>
                    </div>

                            <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Classes Missed</p>

                                badgeHtml = '<span class="text-[10px] font-bold text-emerald-700 dark:text-emerald-300">Present</span>';
                                icon = '<i class="fa-solid fa-check text-emerald-600 text-xs"></i>';

                                icon = '<i class="fa-solid fa-xmark text-rose-600 text-xs"></i>';

                                bgClass = 'bg-sky-50/70 dark:bg-sky-950/40 border-sky-200 dark:border-sky-800/60 text-sky-800 dark:text-sky-200';
                                badgeHtml = '<span class="text-[10px] font-bold text-sky-700 dark:text-sky-300">Leave</span>';
                                icon = '<i class="fa-solid fa-envelope-open-text text-sky-600 text-xs"></i>';
                            }

                            const isSelected = rec.date === selectedDate;
                            const activeRing = isSelected ? 'ring-2 ring-indigo-600 dark:ring-indigo-400 shadow-md scale-[1.02]' : '';
                            return `
                                <div onclick="changeStudentAttendanceDate('${rec.date}')" class="rounded-xl border p-2.5 flex flex-col justify-between transition hover:shadow-sm cursor-pointer ${bgClass} ${activeRing}">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-bold ${isSelected ? 'text-indigo-600 dark:text-indigo-400' : ''}">${dayNum}</span>
                                        <span class="text-[10px] uppercase font-semibold text-slate-400">${dayName}</span>
                                    </div>
                                    <div class="mt-2 flex items-center justify-between">
                                        ${badgeHtml}
                                        <span>${icon}</span>
                                    </div>

                                    const dDate = new Date(rec.date + 'T00:00:00');
                                    const dayName = dDate.toLocaleDateString('en-IN', { weekday: 'long' });
                                    const formattedDate = dDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

                                    let badge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600">Weekly Off</span>';
                                    if (rec.status === 'Present') badge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300"><i class="fa-solid fa-check mr-1"></i>Present</span>';
                                    else if (rec.status === 'Late') badge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300"><i class="fa-solid fa-clock mr-1"></i>Late</span>';
                                    else if (rec.status === 'Absent') badge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300"><i class="fa-solid fa-xmark mr-1"></i>Absent</span>';
                                    else if (rec.status === 'Leave') badge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300"><i class="fa-solid fa-envelope mr-1"></i>Leave</span>';

                                    return `
                                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                                            <td class="px-5 py-3.5 font-bold text-slate-800 dark:text-slate-200">${formattedDate}</td>
                                            <td class="px-5 py-3.5 text-slate-500 dark:text-slate-400">${dayName}</td>
                                            <td class="px-5 py-3.5 text-slate-700 dark:text-slate-300 font-medium">${escapeHtml(curBatch.name)}</td>
                                            <td class="px-5 py-3.5">${badge}</td>
                                            <td class="px-5 py-3.5 text-slate-500 dark:text-slate-400 text-[11px]">${escapeHtml(rec.remarks || 'Regular class session')}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }
</script>

            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');

        function autoSyncToDatabase() {
            if (autoSyncTimer) clearTimeout(autoSyncTimer);
            updateSyncBadge('Syncing with Cloud...', 'syncing');

            autoSyncTimer = setTimeout(function () {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (res && res.success && syncRevision === localDataRevision) {

                            }
                            if (res && res.success && Array.isArray(res.photoUpdates) && res.photoUpdates.length) {
                                res.photoUpdates.forEach(function(update) {
                                    const collection = update.type === 'teacher' ? state.teachers : state.students;

                                    if (item) { item.photo = update.photo; item.photoFileId = update.photoFileId || ''; }
                                });
                                saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {

            }
                            }

                            updateSyncBadge('✓ Cloud Synced (' + state.lastSyncTime + ')', 'success');

                        .withFailureHandler(function (err) {

        function escapeAttr(str) {

        function saveAuthSession(rememberMe, identifier, password) {
            try {
                const expiresAt = Date.now() + THIRTY_DAYS_MS;
                if (state.isAuthenticated && state.currentUser) {
                    const sessData = JSON.stringify({
                        isAuthenticated: true,
                        role: state.currentRole,
                        userId: state.currentUser.id || null,
                        userName: state.currentUser.name,
                        identifier: state.currentUser.identifier,
                        remember: !!rememberMe,
                        expiresAt: expiresAt
                    });
                    if (rememberMe) {
                        localStorage.setItem('DIVINE_AUTH_SESSION', sessData);
                        sessionStorage.removeItem('DIVINE_AUTH_SESSION');
                    } else {
                        sessionStorage.setItem('DIVINE_AUTH_SESSION', sessData);
                        localStorage.removeItem('DIVINE_AUTH_SESSION');
                    }
                }
                // Never persist passwords in browser storage.
                localStorage.removeItem('DIVINE_SAVED_CREDS');
            } catch (e) {
                console.warn('Could not save auth session', e);
            }
        }

        function loadAuthSession() {
            try {
                let saved = sessionStorage.getItem('DIVINE_AUTH_SESSION');
                if (!saved) {
                    saved = localStorage.getItem('DIVINE_AUTH_SESSION');
                }
                if (saved) {
                    const sess = JSON.parse(saved);
                    // Check if 30-day session has expired
                    if (sess && sess.expiresAt && Date.now() > sess.expiresAt) {
                        localStorage.removeItem('DIVINE_AUTH_SESSION');
                        sessionStorage.removeItem('DIVINE_AUTH_SESSION');
                        return;
                    }
                    if (sess && sess.isAuthenticated) {
                        if (sess.role === 'developer') {
                            state.isAuthenticated = true;
                            state.currentRole = 'developer';
                            state.isDeveloper = true;
                            state.currentUser = { role: 'developer', name: 'Anil', identifier: 'Lead Dev' };
                        } else if (sess.role === 'admin') {
                            state.isAuthenticated = true;
                            state.currentRole = 'admin';
                            state.isDeveloper = false;
                            state.currentUser = { role: 'admin', name: sess.userName || 'Administrator', identifier: 'Admin Master' };
                        } else if (sess.role === 'teacher') {
                            state.isDeveloper = false;
                            const tch = state.teachers.find(t => t.id === sess.userId) || state.teachers[0];
                            if (tch && tch.status !== 'Blocked' && tch.status !== 'Inactive') {
                                state.isAuthenticated = true;
                                state.currentRole = 'teacher';
                                state.activeTeacherId = tch.id;
                                state.currentUser = { role: 'teacher', id: tch.id, name: tch.name, identifier: tch.email };
                            }
                        } else if (sess.role === 'student') {
                            state.isDeveloper = false;
                            const stu = state.students.find(s => s.id === sess.userId) || state.students[0];
                            if (stu && stu.status !== 'Blocked' && stu.status !== 'Inactive') {
                                state.isAuthenticated = true;
                                state.currentRole = 'student';
                                state.activeStudentId = stu.id;
                                state.currentUser = { role: 'student', id: stu.id, name: stu.name, identifier: stu.roll };
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('Could not load auth session', e);
            }
        }

        function showCurrentUserDetails() {
            const user = state.currentUser;

            const roleNames = { admin: 'Administrator', developer: 'Lead Dev', teacher: 'Teacher', student: 'Student' };

            let summaryValue = user.name || 'Active';
            let summaryNote = user.identifier || 'Active account';
            let summaryIcon = 'fa-user';

            if (user.role === 'student') {
                const student = (state.students || []).find(item => String(item.id) === String(user.id || state.activeStudentId));
                if (student) {
                    const batches = (state.batches || []).filter(batch => (batch.studentIds || []).some(id => String(id) === String(student.id) || String(id) === String(student.roll))).map(batch => batch.name);
                    details.push(['Mobile', student.phone], ['Parent / Guardian', student.parentName], ['Batch', batches.join(', ')], ['Status', student.status]);
                    const balance = Math.max(0, Number(student.totalFee || 0) - Number(student.paidFee || 0));
                    summaryLabel = balance ? 'Pending fees' : 'Fee status';
                    summaryValue = balance ? `₹${balance.toLocaleString('en-IN')}` : 'All clear';
                    summaryNote = `${student.name} · ${student.roll}`;
                    summaryIcon = 'fa-indian-rupee-sign';

            } else if (user.role === 'teacher') {
                const teacher = (state.teachers || []).find(item => String(item.id) === String(user.id || state.activeTeacherId));
                if (teacher) {
                    details.push(['Email', teacher.email], ['Mobile', teacher.phone], ['Subject', teacher.subject], ['Qualification', teacher.qualification], ['Experience', teacher.experience], ['Status', teacher.status]);

                    summaryValue = teacher.name || user.name || 'Faculty';
                    summaryNote = teacher.subject || teacher.experience || user.identifier || 'Active faculty account';
                    summaryIcon = 'fa-chalkboard-user';

                details.push(['Email', state.settings && state.settings.adminEmail], ['Mobile', state.settings && state.settings.phone]);

                summaryValue = user.name || 'Administrator';

            } else if (user.role === 'developer') {
                summaryLabel = 'System access';
                summaryValue = user.name || 'Anil';
                summaryNote = user.identifier || 'Developer account';
                summaryIcon = 'fa-user-gear';

            const alertText = user.role === 'student'

            const previousCard = document.getElementById('profile-info-alert');
