            updateRoleUI();
            renderMainContent();
        }

        function navigateTo(tabId) {
            if (tabId === 'fees' && state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Access Denied! Student fees are visible ONLY to Admin.', 'error');
                return;
            }
            if (tabId === 'access' && state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Access Denied! Access Control is restricted to Admin.', 'error');
                return;
            }
            if (tabId === 'settings' && state.currentRole !== 'developer') {
                showToast('Access Denied! Institute Settings are visible ONLY to the Developer role.', 'error');
                return;
            }
            state.activeTab = tabId;
            renderSidebar();
            renderMainContent();
            // Close mobile sidebar if open
            if (window.innerWidth < 1024) {
                const sb = document.getElementById('sidebar');
                if (sb && !sb.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            if (!sb) return;
            if (window.innerWidth >= 1024) {
                sb.classList.toggle('lg:hidden');
            } else {
                sb.classList.toggle('-translate-x-full');
                if (bd) bd.classList.toggle('hidden');
            }
        }
        window.toggleSidebar = toggleSidebar;
        window.toggleMobileSidebar = toggleSidebar;

        function toggleSidebarSubmenu(groupId) {
            const menu = document.getElementById('sidebar-submenu-' + groupId);
            const button = document.getElementById('sidebar-menu-' + groupId);
            if (!menu || !button) return;
            const open = menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !open);
            button.setAttribute('aria-expanded', String(open));
            const arrow = button.querySelector('.sidebar-menu-arrow');
            if (arrow) arrow.classList.toggle('rotate-180', open);
            if (!window.sidebarSubmenuState) window.sidebarSubmenuState = {};
            window.sidebarSubmenuState[groupId] = open;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            const navContainer = document.getElementById('nav-links');
            if (!state.isAuthenticated) {
                if (sidebar) sidebar.style.display = 'none';
                if (navContainer) navContainer.innerHTML = '';
                const primaryLinks = document.getElementById('primary-menu-links');
                if (primaryLinks) primaryLinks.innerHTML = '';
                return;
            }
            if (sidebar) sidebar.style.display = '';
            if (!navContainer) return;

            // Rebuilding the navigation can reset its own scroll position. Keep
            // the sidebar where the user left it when switching pages (including
            // opening Settings), and restore after the browser has laid out the
            // replacement buttons.
            const navScrollTop = navContainer.scrollTop;

            // Developer sees every Admin tab plus Settings.
            const allowedItems = navItems.filter(item =>
                item.roles.includes(state.currentRole) ||
                (state.currentRole === 'developer' && (item.roles.includes('admin') || item.roles.includes('developer')))
            );

            try {
                if (!window.sidebarSubmenuState) window.sidebarSubmenuState = {};
                const activeGroup = sidebarNavigationGroups.find(group => group.items.includes(state.activeTab));
                if (activeGroup) window.sidebarSubmenuState[activeGroup.id] = true;
                const renderNavItem = item => {
                    const active = state.activeTab === item.id;
                    return `<button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition group ${active ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'}"><i class="fa-solid ${item.icon} w-5 text-center shrink-0 ${active ? 'text-white' : 'text-slate-400 group-hover:text-indigo-400'}"></i><span class="text-left whitespace-normal leading-snug">${item.label}</span></button>`;
                };
                navContainer.innerHTML = sidebarNavigationGroups.map(group => {
                    const groupItems = allowedItems.filter(item => group.items.includes(item.id));
                    if (!groupItems.length) return '';
                    const open = window.sidebarSubmenuState[group.id] === true || groupItems.some(item => item.id === state.activeTab);
                    window.sidebarSubmenuState[group.id] = open;
                    return `<section class="mb-2"><button id="sidebar-menu-${group.id}" type="button" onclick="toggleSidebarSubmenu('${group.id}')" aria-expanded="${open}" aria-controls="sidebar-submenu-${group.id}" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[10px] font-bold tracking-wider text-slate-400 hover:text-white hover:bg-slate-800/70 transition"><span>${group.label}</span><i class="fa-solid fa-chevron-down sidebar-menu-arrow text-[9px] transition-transform ${open ? 'rotate-180' : ''}"></i></button><div id="sidebar-submenu-${group.id}" class="space-y-1 px-1 ${open ? '' : 'hidden'}">${groupItems.map(renderNavItem).join('')}</div></section>`;
                }).join('');
            } catch (menuError) {
                console.error('Sidebar menu fallback:', menuError);
                navContainer.innerHTML = allowedItems.map(item => `<button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800/80 hover:text-white"><i class="fa-solid ${item.icon} w-5 text-center shrink-0"></i><span class="text-left whitespace-normal leading-snug">${item.label}</span></button>`).join('');
            }

            const primaryLinks = document.getElementById('primary-menu-links');
            if (primaryLinks) {
                primaryLinks.innerHTML = allowedItems.filter(item => primaryMenuIds.includes(item.id)).map(item => {
                    const active = state.activeTab === item.id;
                    return `<button type="button" onclick="navigateTo('${item.id}')" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition ${active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}" ${active ? 'aria-current="page"' : ''}><i class="fa-solid ${item.icon}"></i><span>${item.label}</span></button>`;
                }).join('');
            }
            navContainer.scrollTop = navScrollTop;
            requestAnimationFrame(() => {
                if (navContainer.isConnected) navContainer.scrollTop = navScrollTop;
            });
        }

        /********************************************************************
         * MAIN CONTENT ROUTER
         ********************************************************************/
        function renderMainContent() {
            const container = document.getElementById('main-content');
            const titleEl = document.getElementById('page-title');
            const subtitleEl = document.getElementById('page-subtitle');
            if (!container) return;
            normalizeAppCollections();
            try {

            if (!state.isAuthenticated) {
                if (titleEl) titleEl.textContent = 'Institute Authentication Portal';
                if (subtitleEl) subtitleEl.textContent = 'Sign in with your credentials to access Student, Faculty, or Administrative tools';
                container.innerHTML = renderLoginScreenView();
                return;
            }

            const titles = {
                dashboard: ['Institute Overview Dashboard', 'Divine Classes • Real-time stats, batches, results, and quick actions'],
                batches: ['Batch Creation & Student Roster', 'Requirement #1: Create batches and add or remove students seamlessly'],
                attendance: ['Student Attendance Register', 'Mark daily attendance and review monthly class records'],
                fees: ['Student Fees & Reminder Center', 'Requirement #2 & #5: Strictly Admin-only fee tracking & instant WhatsApp/SMS reminders'],
                materials: ['Batch Assignments, DPPs & Test Papers', 'Requirement #3: Upload and download PDF assignments, worksheets, and papers'],
                marks: ['Offline Class Test Marks Tracker', 'Requirement #4: Track and update student marks scored in offline tests & report cards'],
                teachers: ['Expert Faculty Profiles', 'Requirement #6: View teacher qualifications, subjects, and doubt-clearing timings'],
                gallery: ['Result Banners & Coaching Gallery', 'Requirement #8: Previous result banners and classroom achievements'],
                links: ['External Study Material Hub', 'Requirement #9: Curated study material links from trusted educational websites'],
                feedback: ['Parent & Student Feedback Portal', 'Requirement #10: Submit and review feedback from parents and students'],
                access: ['Access Control & Password Settings', 'Requirement #11: Manage student/faculty passwords and authorize app access synced with the database'],
                settings: ['Settings', 'Manage institute details, access, and connected services']
            };

            const [rawTitle, rawSubtitle] = titles[state.activeTab] || titles.dashboard;
            let title = rawTitle;
            let subtitle = rawSubtitle;
            // Client demo mode: strip "Requirement #N:" tags from page headers when OFF
            if (!shouldShowReqLabels()) {
                subtitle = subtitle.replace(/^Requirement\s*[^:]*:\s*/i, '');
            }
            if (titleEl) titleEl.textContent = title;
            if (subtitleEl) subtitleEl.textContent = subtitle;

            const pageModule = window.DIVINE_PAGE_MODULES && window.DIVINE_PAGE_MODULES[state.activeTab];
            if (pageModule) {
                if (container.dataset) container.dataset.pageModule = pageModule.id;
                const allowed = !pageModule.access || pageModule.access.length === 0 || pageModule.access.includes(state.currentRole) || (state.activeTab === 'attendance' && state.currentRole === 'student');
                const templateExists = document.getElementById(pageModule.templateId);
                const renderer = (state.activeTab === 'attendance' && state.currentRole === 'student' && typeof window.renderStudentAttendanceView === 'function')
                    ? window.renderStudentAttendanceView
                    : window[pageModule.renderer];
                if (!allowed) {
                    container.innerHTML = '';
                    return;
                }
                if (templateExists && typeof renderer === 'function') {
                    const pageShell = templateExists.content.cloneNode(true);
                    const pageRoot = pageShell.querySelector('[data-page-root]');
                    if (pageRoot) {
                        pageRoot.innerHTML = renderer();
                        if (typeof container.replaceChildren === 'function') {
                            container.replaceChildren(pageShell);
                        } else {
                            container.innerHTML = '';
                            container.appendChild(pageShell);
                        }
                    } else {
                        container.innerHTML = renderer();
                    }
                    return;
                }
            } else {
                if (container.dataset) delete container.dataset.pageModule;
            }

            switch (state.activeTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'batches':
                    container.innerHTML = renderBatchesView();
                    break;
                case 'attendance':
                    container.innerHTML = (state.currentRole === 'student') ? renderStudentAttendanceView() : ((state.currentRole === 'admin' || state.currentRole === 'developer' || state.currentRole === 'teacher') ? renderAttendanceView() : '');
                    break;
                case 'fees':
                    container.innerHTML = (state.currentRole === 'admin' || state.currentRole === 'developer') ? renderFeesView() : '';
                    break;
                case 'access':
                    container.innerHTML = (state.currentRole === 'admin' || state.currentRole === 'developer') ? renderAccessView() : '';
                    break;
                case 'settings':
                    container.innerHTML = (state.currentRole === 'developer') ? renderSettingsView() : '';
                    break;
                case 'materials':
                    container.innerHTML = renderMaterialsView();
                    break;
                case 'marks':
                    container.innerHTML = renderMarksView();
                    break;
                case 'teachers':
                    container.innerHTML = renderTeachersView();
                    break;
                case 'gallery':
                    container.innerHTML = renderGalleryView();
                    break;
                case 'links':
                    container.innerHTML = renderLinksView();
                    break;
                case 'feedback':
                    container.innerHTML = renderFeedbackView();
                    break;
            }
            } catch (renderError) {
                console.error('App page render failed:', renderError);
                container.innerHTML = `<div class="m-6 rounded-2xl border border-rose-200 bg-white p-6 text-slate-800 shadow-sm"><h2 class="text-base font-bold text-rose-700">This page could not be displayed</h2><p class="mt-2 text-sm text-slate-600">Your data is still available. Reload the page to try again.</p><button type="button" onclick="renderMainContent()" class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">Reload this page</button></div>`;
            }
        }

        // Refresh data without moving the user's position in the scrollable panel.
        function renderMainContentPreservingScroll() {
            const container = document.getElementById('main-content');
            const panelScrollTop = container ? container.scrollTop : 0;
            renderMainContent();
            requestAnimationFrame(function() {
                if (container) container.scrollTop = panelScrollTop;
            });
        }

        /********************************************************************
         * HELPER: RESOLVE CURRENT STUDENT & ENROLLED BATCH
         ********************************************************************/
        function getCurrentStudentAndBatch() {
            const curStudent = (state.students || []).find(s =>
                (state.activeStudentId && String(s.id) === String(state.activeStudentId)) ||
                (state.currentUser && String(s.id) === String(state.currentUser.id)) ||
                (state.currentUser && String(s.roll) === String(state.currentUser.identifier))
            ) || (state.currentRole === 'student' ? (state.students && state.students[0]) : null);

            if (!curStudent) return { student: null, batch: null, batchId: '' };

            let curBatch = null;
            if (curStudent.batchId) {
                curBatch = (state.batches || []).find(b => String(b.id) === String(curStudent.batchId));
            }
            if (!curBatch) {
                curBatch = (state.batches || []).find(b => {
                    const ids = Array.isArray(b.studentIds) ? b.studentIds : (Array.isArray(b.student_ids) ? b.student_ids : []);
                    return ids.some(id => String(id) === String(curStudent.id) || String(id) === String(curStudent.roll));
                });
            }
            if (!curBatch && state.batches && state.batches.length > 0) {
                curBatch = state.batches[0];
            }
            const batchId = curBatch ? (curBatch.id || curBatch.batch_id || '') : '';
            return { student: curStudent, batch: curBatch, batchId: batchId };
        }

        function isBatchAssignedToCurrentTeacher(batch) {
            if (state.currentRole !== 'teacher') return true;
            if (!batch) return false;
            const teacher = (state.teachers || []).find(function(item) { 
                return String(item.id) === String(state.activeTeacherId); 
            }) || (state.currentUser && state.currentUser.role === 'teacher' ? state.currentUser : null);
            if (!teacher) return false;

            const tId = String(teacher.id || '').trim();
            const tEmail = String(teacher.email || teacher.identifier || '').trim().toLowerCase();
            const bTeacherId = String(batch.teacherId || batch.teacher_id || '').trim();
            const bTeacherEmail = String(batch.teacherEmail || batch.teacher_email || '').trim().toLowerCase();

            // 1. Direct ID match
            if (tId && bTeacherId && tId === bTeacherId) return true;

            // 2. Direct Email match
            if (tEmail && bTeacherEmail && tEmail === bTeacherEmail) return true;

            // 3. Name match with normalized titles / suffixes stripped (e.g. "Er. Rajesh Chahar (Ex-IITian)" matches "Er. Rajesh Chahar")
            const cleanTName = String(teacher.name || '')
                .toLowerCase()
                .replace(/\(.*?\)/g, '')
                .replace(/^(er\.|dr\.|mr\.|mrs\.|ms\.)\s*/i, '')
                .trim();
            const cleanBTeacher = String(batch.teacher || batch.lead_faculty || '')
                .toLowerCase()
                .replace(/\(.*?\)/g, '')
                .replace(/^(er\.|dr\.|mr\.|mrs\.|ms\.)\s*/i, '')
                .trim();

            if (cleanTName && cleanBTeacher) {
                if (cleanTName === cleanBTeacher) return true;
                if (cleanBTeacher.includes(cleanTName) || cleanTName.includes(cleanBTeacher)) return true;
            }

            return false;
        }

            return false;

        function nextMonthlyDueDate(isoDate) {
            const parts = String(isoDate || '').split('-').map(Number);
            if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return '';
            const target = new Date(parts[0], parts[1], 1);
            const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
            return `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}-${String(Math.min(parts[2], lastDay)).padStart(2, '0')}`;
        }

        function executeRemoveStudent(studentId) {
            if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Only Admin can remove students.', 'error');
                return;

            const stu = state.students.find(s => s.id === studentId);

            stu.status = 'Inactive';

            // Remove from all batch enrollment lists
            (state.batches || []).forEach(b => {
                b.studentIds = (b.studentIds || []).filter(id => id !== studentId);
            });

            // If activeStudentId was this student, fall back to an active student
            if (state.activeStudentId === studentId) {
                const fallback = state.students.find(s => s.status !== 'Inactive');
                if (fallback) state.activeStudentId = fallback.id;
            }

            saveStateLocally();
            closeModal();
            renderMainContent();
            updateRoleUI();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        showToast(`Student ${stu.name} (${stu.roll}) marked Inactive in the database.`, 'warning');

        /********************************************************************
         * STUDENT PHOTO UPLOAD & IMAGE RESIZING HELPERS
         ********************************************************************/
        function processImageUpload(file, maxWidth = 260, maxHeight = 260, quality = 0.82) {
            return new Promise((resolve, reject) => {
                if (!file) return reject('No file selected');
                if (!file.type || !file.type.startsWith('image/')) return reject('Please select a valid image file');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > h) {
                            if (w > maxWidth) {
                                h = Math.round((h * maxWidth) / w);
                                w = maxWidth;
                            }
                        } else {
                            if (h > maxHeight) {
                                w = Math.round((w * maxHeight) / h);
                                h = maxHeight;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = () => reject('Could not decode image');
                    img.src = e.target.result;
                };
                reader.onerror = () => reject('Could not read image file');
                reader.readAsDataURL(file);
            });
        }

        async function handleStudentPhotoUploadDirect(event, studentId) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (!canCurrentUserViewStudentProfile(studentId) || (state.currentRole !== 'admin' && state.currentRole !== 'developer')) {
                showToast('You do not have permission to update this student photo.', 'error');
                return;
            }

            try {
                const photoDataUrl = await processImageUpload(file);
                await persistStudentPhoto(studentId, photoDataUrl, true);
            } catch (err) {
                console.error(err);
                showToast('Failed to process image: ' + err, 'error');
            }
        }

        function persistStudentPhoto(studentId, photoDataUrl, reopenCard) {
            return new Promise(resolve => {
                const stu = state.students.find(item => String(item.id) === String(studentId));
                if (!stu || !canCurrentUserViewStudentProfile(studentId)) { showToast('Student profile is not available.', 'error'); resolve(false); return; }
                showToast(`Saving photo for ${stu.name}...`, 'info');
                const finish = function(result) {
                    if (!result || !result.success) {
                        showToast((result && (result.error || result.message)) || 'Photo could not be saved. Please try again.', 'error');
                        resolve(false);

        async function openStudentCamera(studentId) {
            if (!canCurrentUserViewStudentProfile(studentId) || (state.currentRole !== 'admin' && state.currentRole !== 'developer')) {
                showToast('You do not have permission to photograph this student.', 'error');
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('Live camera is unavailable here. Use the photo upload control instead.', 'warning');
                return;
            }
            openModal(`
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div><h3 class="text-base font-bold text-slate-900">Capture Student Photo</h3><p class="text-xs text-slate-500">Allow camera access, then take the photo.</p></div>
                    <button type="button" onclick="closeModal()" class="p-1 text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-4 py-4">
                    <video id="student-camera-preview" autoplay playsinline muted class="mx-auto max-h-[55vh] w-full rounded-xl bg-slate-950 object-contain"></video>
                    <div class="flex justify-center gap-2">
                        <button id="btn-capture-student-photo" type="button" onclick="captureStudentCameraPhoto('${studentId}')" disabled class="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white opacity-50">Take Photo</button>
                        <button type="button" onclick="closeModal()" class="rounded-xl bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-700">Cancel</button>
                    </div>
                    <p id="student-camera-message" class="text-center text-xs text-slate-500">Starting camera…</p>
                </div>
            `);
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                window.studentCameraStream = stream;
                const video = document.getElementById('student-camera-preview');
                if (!video) { stream.getTracks().forEach(track => track.stop()); return; }
                video.srcObject = stream;
                await video.play();
                const capture = document.getElementById('btn-capture-student-photo');
                if (capture) { capture.disabled = false; capture.classList.remove('opacity-50'); }
                const message = document.getElementById('student-camera-message');
                if (message) message.textContent = 'Center the student’s face and take the photo.';
            } catch (error) {
                const message = document.getElementById('student-camera-message');
                if (message) message.textContent = 'Camera access was blocked. Close this window and use Upload Photo.';
                showToast('Could not start camera: ' + (error && error.message ? error.message : String(error)), 'error');
            }

        async function captureStudentCameraPhoto(studentId) {
            const video = document.getElementById('student-camera-preview');
            if (!video || !video.videoWidth || !video.videoHeight) { showToast('Camera is not ready yet.', 'warning'); return; }
            const canvas = document.createElement('canvas');
            const size = Math.min(video.videoWidth, video.videoHeight);
            const sx = Math.round((video.videoWidth - size) / 2);
            const sy = Math.round((video.videoHeight - size) / 2);
            canvas.width = 320; canvas.height = 320;
            canvas.getContext('2d').drawImage(video, sx, sy, size, size, 0, 0, 320, 320);
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.84);
            closeModal();
            await persistStudentPhoto(studentId, photoDataUrl, true);
        }

            stu.status = status;
            stu.totalFee = totalFee;
            stu.paidFee = paidFee;
            stu.dueDate = dueDate || stu.dueDate;
            stu.monthlyFee = monthlyFee;
            stu.admissionDate = admissionDate || stu.admissionDate || '';
            stu.password = password || 'password123';

            // Batch assignment
            (state.batches || []).forEach(b => {
                b.studentIds = (b.studentIds || []).filter(id => id !== studentId);
                if (b.id === batchId && status !== 'Inactive') {
                    b.studentIds.push(studentId);

            saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {

            closeModal();
            renderMainContent();
            updateRoleUI();

            if (typeof google !== 'undefined' && google.script && google.script.run) {

        async function handleEditTeacherPhotoPick(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            window.editTeacherPhotoProcessing = true;
            try {
                const dataUrl = await processImageUpload(file);
                window.editTeacherPhotoData = dataUrl;
                window.editTeacherPhotoDirty = true;
                const preview = document.getElementById('edit-tch-photo-preview');
                if (preview) preview.innerHTML = `<img src="${dataUrl}" alt="Faculty photo preview" class="h-full w-full object-cover">`;
                showToast('Faculty photo ready. Save the profile to apply it.', 'success');
            } catch (error) {
                showToast('Could not process faculty photo: ' + error, 'error');
                event.target.value = '';
            } finally {
                window.editTeacherPhotoProcessing = false;
            }
        }

        function handleSaveEditTeacher(e, teacherId) {
            e.preventDefault();
            if (window.editTeacherPhotoProcessing) {
                showToast('Please wait for the faculty photo to finish processing.', 'warning');
                return;
            }
            const tch = state.teachers.find(t => t.id === teacherId);
            if (!tch) return;

            const name = document.getElementById('edit-tch-name').value.trim();
            const email = document.getElementById('edit-tch-email').value.trim();
            const subject = document.getElementById('edit-tch-subject').value.trim();
            const qualification = document.getElementById('edit-tch-qual').value.trim();
            const experience = document.getElementById('edit-tch-exp').value.trim();
            const phone = document.getElementById('edit-tch-phone').value.trim();
            const status = document.getElementById('edit-tch-status').value;
            const specialization = document.getElementById('edit-tch-spec').value.trim();
            const bio = document.getElementById('edit-tch-bio').value.trim();
            const password = document.getElementById('edit-tch-pwd').value.trim();
            const photo = window.editTeacherPhotoDirty ? (window.editTeacherPhotoData || '') : (tch.photo || '');

            tch.name = name;
            tch.email = email;
            tch.subject = subject;
            tch.qualification = qualification;
            tch.experience = experience;
            tch.phone = phone;
            tch.status = status;
            tch.specialization = specialization;
            tch.bio = bio;
            tch.password = password || 'teacher123';
            tch.photo = photo;
            tch.initials = name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();

            saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
            closeModal();
            renderMainContent();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (!result || !result.success) {
                            saveStateLocally();
                            showToast((result && result.error) || 'Faculty profile saved on this device; cloud sync will retry.', 'warning');
                            return;
                        }
                        if (result.photo) { tch.photo = result.photo; tch.photoFileId = result.photoFileId || ''; saveStateLocally(true); }
                        window.editTeacherPhotoDirty = false;
                        showToast(`Faculty ${name} profile saved.`, 'success');
                    })
                    .withFailureHandler(function(error) {
                        saveStateLocally();
                        showToast('Faculty profile saved on this device; cloud sync will retry: ' + (error && error.message ? error.message : String(error)), 'warning');
                    })
                    .apiUpdateTeacherProfile(teacherId, {
                        name, email, subject, qualification, experience, phone, status, specialization, bio, password, photo
                    });
            } else {
                showToast(`Faculty ${name} updated successfully!`, 'success');
            }
        }

            details.classList.toggle('hidden', !willExpand);
            button.setAttribute('aria-expanded', String(willExpand));
            button.title = willExpand ? 'Hide fee details' : 'Show all fee details';
            const icon = button.querySelector('i');
            if (icon) icon.className = willExpand ? 'fa-solid fa-minus' : 'fa-solid fa-plus';
        }

        function addFeeReminderNotification(studentId, channel = 'App Notification') {
            const stu = state.students.find(s => s.id === studentId);
            if (!stu) return;
            const balance = stu.totalFee - stu.paidFee;
            if (balance <= 0) return;

            if (!state.notifications) state.notifications = [];

            // Remove any older unread fee reminder for this specific student to avoid duplicates
            state.notifications = state.notifications.filter(n => !(n.targetStudentId === stu.id && n.actionTab === 'fees' && !n.read));

            const newNotif = {
                id: 'notif_fee_' + stu.id + '_' + Date.now(),
                title: `Fee Payment Reminder: ₹${balance.toLocaleString('en-IN')}`,
                message: `Dear ${stu.name} (${stu.roll}), your tuition fee installment balance of ₹${balance.toLocaleString('en-IN')} is due on ${stu.dueDate || 'this week'}. Sent via ${channel}. Please clear via UPI: ${state.settings.upiId || 'divineclasses@upi'}.`,
                time: 'Just now',
                timestamp: Date.now(),
                read: false,
                adminSeen: false,
                type: 'warning',
                icon: 'fa-bell',
                iconColor: 'text-amber-500',
                bgColor: 'bg-amber-100 dark:bg-amber-950/40',
                actionTab: 'fees',
                targetStudentId: stu.id,
                targetRoll: stu.roll,
                targetRole: 'student',
                studentName: stu.name,
                feeBalance: balance
            };

            state.notifications.unshift(newNotif);
            saveStateLocally();
            updateNotificationBadge();
        }

            if (state.currentRole === 'student' && String(studentId || state.activeStudentId) !== String(state.activeStudentId)) {

            // If viewed by the student, mark fee notification as seen/read so badge updates to 0
            if (state.currentRole === 'student' && state.notifications && Array.isArray(state.notifications)) {
                let changed = false;
                state.notifications.forEach(n => {
                    if ((n.targetStudentId === stu.id || (stu.roll && n.targetRoll === stu.roll)) && n.actionTab === 'fees' && !n.read) {
                        n.read = true;
                        n.readAt = new Date().toISOString();
                        changed = true;

                if (changed) {
                    saveStateLocally();
                    updateNotificationBadge();
                    if (state.currentTab === 'dashboard') {
                        renderMainContent();

            const balance = stu.totalFee - stu.paidFee;
            const isPaid = balance <= 0;
            const upiId = (state.settings && state.settings.upiId) ? state.settings.upiId : 'divineclasses@upi';

            const modalHtml = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-lg">

        function handleRecordPayment(e, studentId) {
            e.preventDefault();
            const stu = state.students.find(s => s.id === studentId);
            if (!stu) { showToast('Student record could not be found.', 'error'); return; }
            const amount = Number(document.getElementById('pay-amount').value) || 0;
            const mode = document.getElementById('pay-mode').value;
            const ref = document.getElementById('pay-ref').value.trim() || 'N/A';
            const balance = Math.max(0, Number(stu.totalFee || 0) - Number(stu.paidFee || 0));
            if (!Number.isFinite(amount) || amount <= 0 || amount > balance) {
                showToast(amount > balance ? 'Payment cannot exceed the outstanding balance.' : 'Enter a valid payment amount.', 'error');
                return;
            }
            const button = document.getElementById('btn-record-payment');
            if (button) { button.disabled = true; button.textContent = 'Saving payment…'; }
            const finish = function(result) {
                if (!result || !result.success) {
                    if (button) { button.disabled = false; button.textContent = 'Record & Generate Receipt'; }
                    showToast((result && (result.error || result.message)) || 'Could not save this payment. Please try again.', 'error');
                    return;
                }
                stu.paidFee = Number(result.paidFee);
                stu.dueDate = result.dueDate || stu.dueDate;
                if (!Array.isArray(stu.paymentHistory)) stu.paymentHistory = [];
                if (result.payment) stu.paymentHistory.unshift(result.payment);
                saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
                closeModal();
                renderMainContent();
                showToast(`₹${amount.toLocaleString('en-IN')} payment recorded for ${stu.name}!`, 'success');
                printFeeReceipt(stu.id, amount, mode, ref);
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(finish).withFailureHandler(function(err) {
                    if (button) { button.disabled = false; button.textContent = 'Record & Generate Receipt'; }
                    showToast('Could not save payment: ' + (err && err.message ? err.message : String(err)), 'error');
                }).apiRecordStudentPayment(studentId, amount, mode, ref);
            } else {
                stu.paidFee = Number(stu.paidFee || 0) + amount;
                if (!Array.isArray(stu.paymentHistory)) stu.paymentHistory = [];
                stu.paymentHistory.unshift({ id: 'pay_' + Date.now(), amount, mode, reference: ref, paidAt: new Date().toISOString() });
                if (stu.paidFee >= Number(stu.totalFee || 0)) { stu.paidFee = Number(stu.totalFee || 0); stu.dueDate = 'Paid'; }
                finish({ success: true, paidFee: stu.paidFee, dueDate: stu.dueDate, payment: stu.paymentHistory[0] });
            }
        }

                s.totalFee - s.paidFee,
                s.paidFee >= s.totalFee ? 'Fully Paid' : s.dueDate,

            ]);

            const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        }

        function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle) {
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
            ctx.fill();
        }

        function loadCanvasImage(src) {
            return new Promise(resolve => {
                if (!src) { resolve(null); return; }
                const image = new Image();
                image.crossOrigin = 'anonymous';
                image.onload = () => resolve(image);
                image.onerror = () => resolve(null);
                image.src = src;
            });
        }

        async function createStudentIdCardCanvas() {
            const card = document.getElementById('student-id-card');
            const studentId = card && card.dataset.studentId;
            const stu = (state.students || []).find(item => String(item.id) === String(studentId));
            if (!stu || !canCurrentUserViewStudentProfile(studentId)) throw new Error('This student ID card is not available.');
            const batch = (state.batches || []).find(item => (item.studentIds || []).some(id => String(id) === String(stu.id) || String(id) === String(stu.roll)));
            const canvas = document.createElement('canvas');
            canvas.width = 840; canvas.height = 1060;
            const ctx = canvas.getContext('2d');
            drawRoundedRect(ctx, 0, 0, 840, 1060, 46, '#ffffff');
            const gradient = ctx.createLinearGradient(0, 0, 840, 200);
            gradient.addColorStop(0, '#312e81'); gradient.addColorStop(1, '#6d28d9');
            drawRoundedRect(ctx, 0, 0, 840, 220, 46, gradient);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 44px Arial'; ctx.textAlign = 'left';
            ctx.fillText('DIVINE CLASSES', 235, 92);

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url; anchor.download = filename; document.body.appendChild(anchor); anchor.click(); anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function buildSingleImagePdf(jpegDataUrl, width, height) {
            const binary = atob(jpegDataUrl.split(',')[1]);
            const imageBytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) imageBytes[i] = binary.charCodeAt(i);
            const encoder = new TextEncoder();
            const ascii = value => encoder.encode(value);
            const pageWidth = 252, pageHeight = Math.round(pageWidth * height / width);
            const content = `q ${pageWidth} 0 0 ${pageHeight} 0 0 cm /Im0 Do Q`;
            const objects = [
                ascii('<< /Type /Catalog /Pages 2 0 R >>'),
                ascii('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'),
                ascii(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`),
                [ascii(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imageBytes.length} >>\nstream\n`), imageBytes, ascii('\nendstream')],
                ascii(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)
            ];
            const parts = [ascii('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
            const offsets = [0]; let position = parts[0].length;
            objects.forEach((object, index) => {
                offsets.push(position);
                const start = ascii(`${index + 1} 0 obj\n`); const end = ascii('\nendobj\n');
                parts.push(start); position += start.length;
                const objectParts = Array.isArray(object) ? object : [object];
                objectParts.forEach(part => { parts.push(part); position += part.length; });
                parts.push(end); position += end.length;
            });
            const xrefOffset = position;
            let xref = `xref\n0 ${offsets.length}\n0000000000 65535 f \n`;
            offsets.slice(1).forEach(offset => { xref += String(offset).padStart(10, '0') + ' 00000 n \n'; });
            xref += `trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
            parts.push(ascii(xref));
            return new Blob(parts, { type: 'application/pdf' });
        }

        async function makeStudentIdCardFile(format) {
            const canvas = await createStudentIdCardCanvas();
            const jpeg = canvas.toDataURL('image/jpeg', 0.94);
            const studentId = document.getElementById('student-id-card').dataset.studentId;
            const student = state.students.find(item => String(item.id) === String(studentId));
            const safeName = String(student.name || 'Student').replace(/[^a-z0-9_-]+/gi, '_');
            return format === 'pdf'
                ? { blob: buildSingleImagePdf(jpeg, canvas.width, canvas.height), filename: `Divine_Classes_ID_${safeName}.pdf` }
                : { blob: await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.94)), filename: `Divine_Classes_ID_${safeName}.jpg` };
        }

        async function downloadStudentIdCard(format) {
            try {
                const file = await makeStudentIdCardFile(format);
                if (!file.blob) throw new Error('Could not create the ID card file.');
                downloadBlob(file.blob, file.filename);
                showToast(`ID card downloaded as ${format.toUpperCase()}.`, 'success');
            } catch (error) { showToast('ID card download failed: ' + (error.message || error), 'error'); }
        }

        async function shareStudentIdCard() {
            try {
                const output = await makeStudentIdCardFile('pdf');
                const file = new File([output.blob], output.filename, { type: 'application/pdf' });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'Student ID Card', text: 'Divine Classes student ID card' });
                } else {
                    downloadBlob(output.blob, output.filename);
                    showToast('ID card saved as PDF. Attach it in WhatsApp to send.', 'info');
                }
            } catch (error) {
                if (error && error.name === 'AbortError') return;
                showToast('Could not share directly. Download the PDF and attach it in WhatsApp.', 'warning');
            }
        }

            printableArea.innerHTML = card.outerHTML;

            window.addEventListener('afterprint', clearPrintableArea);

        function getMaterialFileMeta(mat) {
            const name = String(mat.fileName || '').toLowerCase();
            let ext = String(mat.fileType || '').toLowerCase();
            if (!ext && name.includes('.')) ext = name.split('.').pop();
            if (!ext) {
                const t = String(mat.title || '').toLowerCase();
                if (/\.pdf|\bpdf\b/.test(t)) ext = 'pdf';
                else if (/\.docx?|\bdocx?\b/.test(t)) ext = 'docx';
                else if (/\.xlsx?|excel|\bxls\b/.test(t)) ext = 'xlsx';
                else if (/\.pptx?|\bpptx?\b/.test(t)) ext = 'pptx';
            }
            if (ext === 'pdf') return { ext: 'PDF', icon: 'fa-file-pdf', color: 'text-red-600', kind: 'pdf' };
            if (ext === 'doc' || ext === 'docx') return { ext: 'Word', icon: 'fa-file-word', color: 'text-blue-600', kind: 'office' };
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return { ext: 'Excel', icon: 'fa-file-excel', color: 'text-emerald-600', kind: 'office' };
            if (ext === 'ppt' || ext === 'pptx') return { ext: 'PPT', icon: 'fa-file-powerpoint', color: 'text-orange-600', kind: 'office' };
            return { ext: 'File', icon: 'fa-file-lines', color: 'text-slate-500', kind: 'other' };
        }

        function downloadMaterial(matId) {
            const mat = (state.materials || []).find(m => m.id === matId);
            if (!mat) {
                showToast('Material not found.', 'error');
                return;
            }

            // Strict authorization check for student role: only enrolled batch
            if (state.currentRole === 'student') {
                const { batchId: myBatchId } = getCurrentStudentAndBatch();
                const mBatch = String(mat.batchId || mat.batch || '').trim();
                if (mBatch && mBatch !== 'all' && mBatch !== 'general' && myBatchId && String(mBatch) !== String(myBatchId)) {
                    showToast('Access Denied: You are only allowed to download study materials uploaded for your enrolled batch.', 'error');
                    return;
                }
            }

            const fileId = mat.driveFileId || '';
            const mobileUrl = fileId ? 'https://drive.usercontent.google.com/download?id=' + fileId + '&export=download&confirm=t' : '';
            const url = mat.downloadUrl || mobileUrl || mat.driveUrl || '';
            if (!url) {
                showToast('No download link is attached to this material yet. Your teacher/admin needs to upload the file to generate the link.', 'warning');
                return;
            }
            mat.downloads = (mat.downloads || 0) + 1;
            saveStateLocally();
            window.open(url, '_blank');
            renderMainContent();
            const fm = getMaterialFileMeta(mat);
            if (fm.kind === 'pdf') {
                showToast(`Opening PDF "${mat.title}" — it opens directly in your browser. Tap ⋮ → Download to save it on your phone.`, 'success');
            } else if (fm.kind === 'office') {
                showToast(`${fm.ext} file "${mat.title}" is downloading — open it from your Files/Downloads app or the notification panel.`, 'success');
            } else {
                showToast(`Downloading "${mat.title}" (${mat.fileSize}) — check your Files/Downloads app on your phone.`, 'success');
            }
        }

        function deleteMaterial(matId) {
            if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Only Admin can delete assignments. Teachers can upload & edit, but deletion is admin-only.', 'error');
                return;
            }
            const mat = state.materials.find(m => m.id === matId);
            if (!mat) return;
            const hasLink = !!(mat.downloadUrl || mat.driveUrl || mat.driveFileId);
            showConfirmDialog({
                title: 'Delete "' + mat.title + '"?',
                message: hasLink
                    ? 'This will remove the material from the portal and database, and delete its Google Drive file. Students will no longer be able to download it.'
                    : '⚠ This is an old record with NO Drive link — the file was never actually uploaded.\n\nDelete it, then re-upload the file so students get a working download.',
                confirmText: 'Yes, Delete',
                cancelText: 'Keep It',
                danger: true
            }).then(function (confirmed) {
                if (!confirmed) return;

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (res && res.success) {
                                state.materials = state.materials.filter(m => m.id !== matId);
                                saveStateLocally();
                                renderMainContent();
                                showToast('"' + mat.title + '" deleted from the database and Drive.', 'success');
                            } else {
                                showToast('Delete failed: ' + ((res && res.error) || 'unknown error'), 'error');
                            }
                        })
                        .withFailureHandler(function (err) {
                            showToast('Delete failed: ' + (err && err.message ? err.message : String(err)), 'error');
                        })
                        .apiDeleteMaterial(matId);
                } else {
                    state.materials = state.materials.filter(m => m.id !== matId);
                    saveStateLocally();
                    renderMainContent();
                }
            });
        }

        function handleUploadMaterial(e) {
            e.preventDefault();
            const fileInput = document.getElementById('mat-file');
            const file = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0] : null;

            const metadata = {
                batchId: document.getElementById('mat-batch').value,
                category: document.getElementById('mat-category').value,
                uploadedBy: document.getElementById('mat-author').value.trim(),
                title: document.getElementById('mat-title').value.trim(),
                description: document.getElementById('mat-desc').value.trim()
            };

            if (!file) {
                showToast('Please choose a PDF/DOC file — the download link is generated from the uploaded file.', 'error');
                return;
            }

            const btn = document.getElementById('btn-publish-material');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Reading file...';
            }
            showToast('Preparing "' + file.name + '" for Google Drive...', 'info');

            const reader = new FileReader();
            reader.onprogress = function (progressEvent) {
                if (btn && progressEvent.lengthComputable) {
                    const percent = Math.round((progressEvent.loaded / progressEvent.total) * 100);
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Reading ' + percent + '%';
                }
            };
            reader.onload = function (evt) {
                const dataUrl = evt.target.result;

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    // Real upload: file → Google Drive, URL → database
                    if (btn) btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Saving to Drive...';
                    showToast('File read. Saving it to Drive now...', 'info');
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (res && res.success && res.material) {
                                state.materials = state.materials.filter(m => m.id !== res.material.id);
                                state.materials.unshift(res.material);

                                // Instant in-app notification (server also persists one for other devices)
                                if (!state.notifications) state.notifications = [];
                                state.notifications = state.notifications.filter(n => n.id !== 'notif_mat_' + res.material.id);
                                state.notifications.unshift({
                                    id: 'notif_mat_' + res.material.id,
                                    title: 'New ' + res.material.category + ' Uploaded',
                                    message: '"' + res.material.title + '" (' + res.material.fileSize + ') is now available in Assignments & DPPs. Download link saved to the database.',
                                    time: 'Just now',
                                    timestamp: Date.now(),
                                    read: false,
                                    adminSeen: false,
                                    type: 'info',
                                    icon: 'fa-file-arrow-up',
                                    iconColor: 'text-indigo-500',
                                    bgColor: 'bg-indigo-100 dark:bg-indigo-950/40',
                                    actionTab: 'materials',
                                    targetRole: 'all',
                                    materialId: res.material.id
                                });

                                saveStateLocally();
                                closeModal();
                                renderMainContent();
                                updateNotificationBadge();
                                checkNewNotificationSound();
                                const folderNote = res.uploadTargetFolder ? ' Saved in the owner\'s Drive folder.' : '';
                                showToast(`"${res.material.title}" uploaded ✓ — link saved in the database.${folderNote}`, 'success');
                            } else {
                                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }
                                showToast('Upload failed: ' + ((res && res.error) || 'unknown server error'), 'error');
                            }
                        })
                        .withFailureHandler(function (err) {
                            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }
                            showToast('Upload failed: ' + (err && err.message ? err.message : String(err)), 'error');
                        })
                        .apiUploadMaterialToDrive(dataUrl, file.name, metadata);
                } else {
                    // Local browser mode: metadata only (no Apps Script backend)
                    const newMat = {
                        id: 'm' + Date.now(),
                        batchId: metadata.batchId,
                        category: metadata.category,
                        uploadedBy: metadata.uploadedBy,
                        title: metadata.title,
                        description: metadata.description,
                        uploadDate: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                        fileSize: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
                        downloads: 0
                    };
                    state.materials.unshift(newMat);
                    saveStateLocally();
                    closeModal();
                    renderMainContent();
                    showToast('Local mode: material saved WITHOUT a Drive link. Deploy via clasp to enable real uploads.', 'warning');
                }
            };
            reader.onerror = function () {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }
                showToast('Could not read the selected file. Please try again.', 'error');
            };
            reader.readAsDataURL(file);
        }

                    <!-- Selected Test Analytics & Scoreboard -->

        function selectOfflineTest(testId) {
            state.selectedTestId = testId;
            renderMainContent();
        }

        function saveStudentTestMark(testId, studentId) {
            const test = state.offlineTests.find(t => t.id === testId);
            const stu = state.students.find(s => s.id === studentId);
            const batch = test && state.batches.find(b => String(b.id) === String(test.batchId));
            if (!test || !stu || (state.currentRole === 'teacher' && (!batch || !isBatchAssignedToCurrentTeacher(batch) ||
                !(batch.studentIds || []).some(id => String(id) === String(stu.id) || String(id) === String(stu.roll))))) {
                showToast('You can update marks only for students in your assigned batches.', 'error');
                return;
            }
            const scoreVal = parseInt(document.getElementById(`score-${studentId}`).value, 10) || 0;
            const remarkVal = document.getElementById(`remark-${studentId}`).value.trim();

            if (scoreVal > test.maxMarks || scoreVal < 0) {
                showToast(`Marks must be between 0 and ${test.maxMarks}`, 'error');
                return;
            }

            test.marks[studentId] = { score: scoreVal, remarks: remarkVal || 'Updated' };
            saveStateLocally();
            renderMainContent();
            showToast(`Marks saved for ${stu.name} (${scoreVal}/${test.maxMarks})`, 'success');
        }

        async function ensureHtml2Canvas() {
            if (window.html2canvas) return window.html2canvas;
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                s.onload = () => resolve(window.html2canvas);
                s.onerror = () => reject(new Error('Failed to load html2canvas. Check internet connection.'));
                document.head.appendChild(s);
            });
        }

        async function downloadReportCard(format, studentId) {
            const stu = state.students.find(s => s.id === studentId);
            const card = document.getElementById('student-report-card-container');
            if (!card || !stu) {
                showToast('Report card content not found.', 'error');
                return;
            }
            const safeName = String(stu.name || 'Student').replace(/[^a-z0-9_-]+/gi, '_');

            showToast(`Generating ${format.toUpperCase()} report card...`, 'info');

            try {
                const h2c = await ensureHtml2Canvas();
                const canvas = await h2c(card, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                if (format === 'jpeg') {
                    canvas.toBlob(blob => {
                        if (!blob) throw new Error('Could not create JPEG blob');
                        downloadBlob(blob, `Divine_Classes_Report_${safeName}.jpg`);
                        showToast('Report Card downloaded as high-resolution JPEG!', 'success');
                    }, 'image/jpeg', 0.95);
                } else if (format === 'pdf') {
                    const jpegUrl = canvas.toDataURL('image/jpeg', 0.95);
                    const pdfBlob = buildSingleImagePdf(jpegUrl, canvas.width, canvas.height);
                    downloadBlob(pdfBlob, `Divine_Classes_Report_${safeName}.pdf`);
                    showToast('Report Card downloaded as Digitally Signed PDF!', 'success');
                }
            } catch (err) {
                console.error('Report card download error:', err);
                showToast('Download failed: ' + (err.message || err), 'error');
            }
        }

        async function handleSelfTeacherPhotoPick(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            window.selfTeacherPhotoProcessing = true;
            try {
                window.selfTeacherPhotoData = await processImageUpload(file);
                window.selfTeacherPhotoDirty = true;
                const preview = document.getElementById('self-tch-photo-preview');
                if (preview) preview.innerHTML = `<img src="${window.selfTeacherPhotoData}" alt="Faculty photo preview" class="h-full w-full object-cover">`;
                showToast('Photo ready. Save it to update your faculty profile.', 'success');
            } catch (error) {
                event.target.value = '';
                showToast('Could not process this photo: ' + error, 'error');
            } finally {
                window.selfTeacherPhotoProcessing = false;
            }
        }

        function saveSelfTeacherPhoto(teacherId) {
            if (state.currentRole !== 'teacher' || String(state.activeTeacherId) !== String(teacherId)) {
                showToast('You can update only your own faculty photo.', 'error');
                return;
            }
            if (window.selfTeacherPhotoProcessing) { showToast('Please wait for the photo to finish processing.', 'warning'); return; }
            if (!window.selfTeacherPhotoDirty || !window.selfTeacherPhotoData) { showToast('Choose a photo before saving.', 'warning'); return; }
            const button = document.getElementById('btn-save-self-tch-photo');
            if (button) { button.disabled = true; button.textContent = 'Saving…'; }
            const finish = function(result) {
                if (!result || !result.success) {
                    if (button) { button.disabled = false; button.textContent = 'Save Photo'; }
                    showToast((result && (result.error || result.message)) || 'Could not save your photo. Please try again.', 'error');
                    return;
                }
                const teacher = (state.teachers || []).find(item => String(item.id) === String(teacherId));
                if (teacher) {
                    teacher.photo = result.photo || window.selfTeacherPhotoData;
                    teacher.photoFileId = result.photoFileId || '';
                }
                saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
                closeModal();
                renderMainContent();
                showToast('Your faculty photo has been updated.', 'success');
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(finish).withFailureHandler(function(error) {
                    if (button) { button.disabled = false; button.textContent = 'Save Photo'; }
                    showToast('Could not save photo: ' + (error && error.message ? error.message : String(error)), 'error');
                }).apiUpdateTeacherPhoto(teacherId, window.selfTeacherPhotoData);
            } else {
                finish({ success: true });
            }
        }

        function toggleStudentStatus(stuId) {
            const stu = state.students.find(s => s.id === stuId);
            if (!stu) return;
            const newStatus = stu.status === 'Blocked' ? 'Active' : 'Blocked';
            stu.status = newStatus;
            saveStateLocally();
            renderMainContent();
            updateRoleUI();

            showToast(`Student ${stu.name} access ${newStatus === 'Active' ? 'Authorized (Active)' : 'Blocked'} immediately!`, newStatus === 'Active' ? 'success' : 'warning');

            if (state.currentRole === 'student' && state.activeStudentId === stuId && newStatus === 'Blocked') {
                showAccessBlockedModal('student', stu.name, stu.roll);
            }

            // Push to Database
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        console.log(`Student ${stu.name} status synced to Database`);
                    })
                    .apiUpdateStudentAuth(stuId, stu.password, newStatus);
            }
        }

        function toggleTeacherStatus(trId) {
            const tr = state.teachers.find(t => t.id === trId);
            if (!tr) return;
            const newStatus = tr.status === 'Blocked' ? 'Active' : 'Blocked';
            tr.status = newStatus;
            saveStateLocally();
            renderMainContent();
            updateRoleUI();

            showToast(`Teacher ${tr.name} access ${newStatus === 'Active' ? 'Authorized (Active)' : 'Blocked'} immediately!`, newStatus === 'Active' ? 'success' : 'warning');

            if (state.currentRole === 'teacher' && state.activeTeacherId === trId && newStatus === 'Blocked') {
                showAccessBlockedModal('teacher', tr.name, tr.email);

                    })
                    .apiUpdateTeacherAuth(trId, tr.password, newStatus);
            }
        }

        function openEditPasswordModal(userType, id) {
            const target = userType === 'student' ? state.students.find(s => s.id === id) : state.teachers.find(t => t.id === id);
            if (!target) return;

            const modalHtml = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">

                        </div>
                        <div>

                            <p class="text-xs text-slate-500">${target.name} (${userType === 'student' ? target.roll : target.email})</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleSavePassword(event, '${userType}', '${id}')" class="py-4 space-y-4 text-xs">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">New Password *</label>
                        <input type="text" id="edit-pwd-val" value="${target.password || (userType === 'student' ? 'password123' : 'teacher123')}" required minlength="4" class="w-full px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-mono">
                        <p class="text-[11px] text-slate-400 mt-1">This password will be updated directly in the Cloud Database.</p>
                    </div>
                    <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>

                    </div>
                </form>
            `;
            openModal(modalHtml);

        function handleSavePassword(e, userType, id) {
            e.preventDefault();
            const newPwd = document.getElementById('edit-pwd-val').value.trim();
            if (!newPwd) return;

            const target = userType === 'student' ? state.students.find(s => s.id === id) : state.teachers.find(t => t.id === id);
            if (!target) return;
            target.password = newPwd;
            saveStateLocally();
            closeModal();
            renderMainContent();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                if (userType === 'student') {
                    google.script.run
                        .withSuccessHandler(function() { showToast(`Password for ${target.name} updated in the database.`, 'success'); })
                        .apiUpdateStudentAuth(id, newPwd, target.status);
                } else {
                    google.script.run
                        .withSuccessHandler(function() { showToast(`Password for ${target.name} updated in the database.`, 'success'); })
                        .apiUpdateTeacherAuth(id, newPwd, target.status);
                }
            } else {
                showToast(`Password updated for ${target.name} successfully!`, 'success');
            }
        }

        function handleAdminPasswordUpdate(e) {
            e.preventDefault();
            const p1 = document.getElementById('new-admin-pwd').value.trim();
            const p2 = document.getElementById('confirm-admin-pwd').value.trim();
            if (p1 !== p2) {
                showToast('Passwords do not match! Please check again.', 'warning');
                return;
            }
            if (!state.settings) state.settings = {};
            state.settings.adminPassword = p1;
            saveStateLocally();
            renderMainContent();

            if (typeof supabaseSyncSettings === 'function') {
                supabaseSyncSettings(state.settings);
            }

            if (typeof syncPendingDataToSupabase === 'function' && state.settings && state.settings.supabaseEnabled === true) {
                syncPendingDataToSupabase().catch(function() {});
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() { showToast('✓ Admin master password saved to Cloud successfully!', 'success'); })
                    .apiUpdateAdminPassword(p1);
            } else {
                showToast('✓ Admin master password updated successfully!', 'success');
            }
        }

                renderMainContent();

        function shareWhatsAppCredentials(type, id) {
            let target = null;
            let msg = '';
            let phone = '';

            if (type === 'student') {
                const s = state.students.find(x => x.id === id);
                if (!s) return;
                target = s;
                phone = (s.phone || '').trim();
                const pwd = s.password || 'password123';
                const st = s.status || 'Active';
                msg = `🎓 *DIVINE CLASSES - STUDENT PORTAL ACCESS*\n\n` +
                      `Dear *${s.name}*,\n` +
                      `Here are your official login credentials for the Divine Classes Student Portal:\n\n` +
                      `👤 *Student Name:* ${s.name}\n` +
                      `🆔 *User ID / Roll No:* ${s.roll}\n` +
                      `🔑 *Login Password:* ${pwd}\n` +
                      `⚡ *Access Status:* ${st}\n\n` +
                      `📍 *Institute Campus:*\n235 Paschimpuri Pocket 2, Club Rd New Delhi 110063\n` +
                      `📞 *Helpline:* 9555-6787-53\n\n` +
                      `_Please keep your credentials safe and do not share them._`;
            } else {
                const t = state.teachers.find(x => x.id === id);
                if (!t) return;
                target = t;
                phone = (t.phone || '').trim();
                const pwd = t.password || 'teacher123';
                const st = t.status || 'Active';
                msg = `📚 *DIVINE CLASSES - FACULTY PORTAL ACCESS*\n\n` +
                      `Dear *${t.name}*,\n` +
                      `Here are your official faculty credentials for Divine Classes:\n\n` +
                      `👤 *Faculty Member:* ${t.name}\n` +
                      `📧 *Login Email (User ID):* ${t.email}\n` +
                      `🔑 *Login Password:* ${pwd}\n` +
                      `⚡ *Access Status:* ${st}\n\n` +
                      `📍 *Institute Campus:*\n235 Paschimpuri Pocket 2, Club Rd New Delhi 110063\n` +
                      `📞 *Helpline:* 9555-6787-53\n\n` +
                      `_Please keep your credentials safe._`;
            }

            // Always copy formatted credentials to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(msg).catch(() => {});
            }

            // Clean phone number for WhatsApp wa.me
            let cleanPhone = phone.replace(/[^0-9]/g, '');
            if (cleanPhone.length === 10) {
                cleanPhone = '91' + cleanPhone;
            }

            if (cleanPhone) {
                const waUrl = 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg);
                const win = window.open(waUrl, '_blank');
                if (win) {
                    showToast(`Opening WhatsApp chat with ${target.name} (${phone}) & copied credentials to clipboard!`, 'success');
                } else {
                    showToast(`Credentials copied! Popup blocked; send WhatsApp to ${phone}`, 'info');
                }
            } else {
                showToast(`Credentials copied to clipboard for ${target.name} (No phone number saved)`, 'success');
            }
        }
