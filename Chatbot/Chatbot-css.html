<style>
    #chatbot-launcher {
        position: fixed;
        z-index: 45;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        display: inline-flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        color: #cbd5e1;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(145deg, #8b5cf6 0%, #6339e8 56%, #4f46e5 100%);
        box-shadow: 0 12px 30px rgba(92, 63, 220, .34), inset 0 1px 0 rgba(255,255,255,.28);
        cursor: pointer;
        transition: transform .18s ease, box-shadow .18s ease;
        animation: chatbot-launcher-appear .24s ease-out both;
    }

    #chatbot-launcher[hidden] { display: none; }
    #chatbot-launcher:hover { transform: translateY(-3px) scale(1.035); box-shadow: 0 16px 34px rgba(92, 63, 220, .4), inset 0 1px 0 rgba(255,255,255,.28); }
    #chatbot-launcher:active { transform: scale(.96); }
    #chatbot-launcher:focus-visible { outline: 3px solid #a78bfa; outline-offset: 4px; }

    .chatbot-launcher-icon {
        display: block;
        width: 23px;
        height: 23px;
        filter: drop-shadow(0 1px 1px rgba(49, 35, 122, .16));
    }

    .chatbot-launcher-status {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 10px;
        height: 10px;
        border: 1.5px solid #fff;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 1px 5px rgba(15, 23, 42, .2);
        animation: chatbot-status-blink 1.8s ease-in-out infinite;
    }

    @keyframes chatbot-status-blink {
        0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, .35); }
        50% { opacity: .62; box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
    }

    @keyframes chatbot-launcher-appear {
        from { transform: translateY(10px) scale(.9); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
    }

    #chatbot-overlay {
        position: fixed;
        z-index: 45;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(82px, calc(72px + env(safe-area-inset-bottom)));
        width: min(410px, calc(100vw - 32px));
        height: min(550px, calc(100dvh - 112px - env(safe-area-inset-bottom)));
        min-height: 0;
        overflow: hidden;
        border-radius: 20px;
        filter: drop-shadow(0 18px 48px rgba(37, 24, 82, .24));
        animation: chatbot-launcher-appear .2s ease-out both;
    }

    #chatbot-overlay[hidden] { display: none; }
    #chatbot-overlay-content,
    #chatbot-overlay #chatbot-shell { width: 100%; height: 100%; min-height: 0; }
    #chatbot-overlay #chatbot-shell { border-color: #e7e1fb; border-radius: 20px; box-shadow: 0 2px 9px rgba(39, 30, 75, .08); }
    #chatbot-overlay .chatbot-header {
        min-height: 70px;
        padding: 12px 14px;
        color: #fff;
        border-bottom: 0;
        background: linear-gradient(115deg, #5b3cc4 0%, #7548dc 55%, #8a4dde 100%);
    }
    #chatbot-overlay .chatbot-brand-icon { color: #6844c9; background: #fff; box-shadow: 0 5px 16px rgba(33, 17, 74, .18); }
    #chatbot-overlay .chatbot-title-row h2,
    #chatbot-overlay .chatbot-brand-copy > p { color: #fff; }
    #chatbot-overlay .chatbot-brand-copy > p { opacity: .84; }
    #chatbot-overlay .chatbot-version-badge {
        color: #fff;
        border-color: rgba(255,255,255,.32);
        background: rgba(255,255,255,.16);
    }
    #chatbot-overlay .chatbot-status-dot { background: #86efac; box-shadow: 0 0 0 3px rgba(134,239,172,.2); }
    #chatbot-overlay .chatbot-status-dot-offline { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.2); }
    #chatbot-overlay .chatbot-header-divider { color: rgba(255,255,255,.6); }
    #chatbot-overlay .chatbot-header-actions .chatbot-new-chat {
        min-height: 32px;
        padding: 0 9px;
        color: #fff;
        border-color: rgba(255,255,255,.3);
        background: rgba(255,255,255,.12);
    }
    #chatbot-overlay .chatbot-header-actions .chatbot-new-chat:hover:not(:disabled) { background: rgba(255,255,255,.22); }
    #chatbot-overlay .chatbot-overlay-close { width: 32px; min-width: 32px; padding: 0; justify-content: center; }
    #chatbot-overlay .chatbot-overlay-close span { display: none; }
    #chatbot-overlay .chatbot-suggestions { width: 100%; flex: 0 0 auto; margin: 0; padding: 7px 9px; overflow-x: auto; border-bottom: 1px solid #eceef3; background: #f7f8fb; scrollbar-width: none; }
    #chatbot-overlay .chatbot-suggestions::-webkit-scrollbar { display: none; }
    #chatbot-overlay .chatbot-suggestion-grid { display: flex; width: max-content; min-width: 100%; gap: 6px; }
    #chatbot-overlay .chatbot-suggestion { min-height: 31px; flex: 0 0 auto; gap: 5px; padding: 5px 8px; color: #536074; font-size: 9px !important; border-radius: 999px; }
    #chatbot-overlay .chatbot-suggestion-icon { width: 18px; height: 18px; font-size: 9px; border-radius: 50%; }
    #chatbot-overlay .chatbot-suggestion-arrow { margin-left: 1px; font-size: 8px; }
    #chatbot-overlay .chatbot-conversation { background: #f7f8fc; }
    #chatbot-overlay .chatbot-thread { width: 100%; padding: 14px 12px 18px; }
    #chatbot-overlay .chatbot-message { gap: 8px; margin-bottom: 15px; }
    #chatbot-overlay .chatbot-avatar { width: 25px; height: 25px; margin-top: 18px; border-radius: 50%; }
    #chatbot-overlay .chatbot-message-content { max-width: calc(100% - 34px); }
    #chatbot-overlay .chatbot-message-meta { margin-bottom: 4px; font-size: 9px; }
    #chatbot-overlay .chatbot-bubble { padding: 10px 12px; font-size: 10px; line-height: 1.65; }
    #chatbot-overlay .chatbot-bubble p { margin: 0 0 6px; }
    #chatbot-overlay .chatbot-bubble p:last-of-type { margin-bottom: 5px; }
    #chatbot-overlay .chatbot-bubble ul { margin: 4px 0 0; padding-left: 15px; list-style: disc; }
    #chatbot-overlay .chatbot-bubble li { margin: 2px 0; }
    #chatbot-overlay .chatbot-welcome-hint { color: #69758a; font-size: 9px; }
    #chatbot-overlay .chatbot-composer-wrap { padding: 10px 12px 8px; }
    #chatbot-overlay .chatbot-privacy-note { font-size: 8px; }
    #chatbot-overlay .chatbot-thread { padding: 17px 14px 20px; }
    #chatbot-overlay .chatbot-message { margin-bottom: 15px; }

    #chatbot-overlay .chatbot-key-drawer {
        max-height: 290px;
        flex: 0 0 auto;
        overflow-y: auto;
        padding: 12px 14px;
        color: #384153;
        border-bottom: 1px solid #e8e4f2;
        background: #f8f7fc;
    }
    #chatbot-overlay .chatbot-key-drawer-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    #chatbot-overlay .chatbot-key-drawer-heading strong { display: block; color: #272d3b; font-size: 11px; }
    #chatbot-overlay .chatbot-key-drawer-heading small { display: block; margin-top: 2px; color: #737d90; font-size: 9px; }
    #chatbot-overlay .chatbot-drawer-close { display: inline-flex; width: 25px; height: 25px; align-items: center; justify-content: center; color: #737d90; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
    #chatbot-overlay .chatbot-provider-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; padding: 3px; border-radius: 9px; background: #eceaf2; }
    #chatbot-overlay .chatbot-provider-tabs button { display: flex; min-height: 30px; align-items: center; justify-content: center; gap: 6px; color: #667085; font-size: 10px; font-weight: 700; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
    #chatbot-overlay .chatbot-provider-tabs button.is-active { color: #5145cd; background: #fff; box-shadow: 0 1px 3px rgba(27, 35, 55, .1); }
    #chatbot-overlay .chatbot-key-drawer [data-chatbot-provider-panel][hidden] { display: none; }
    #chatbot-overlay .chatbot-key-drawer label { display: block; margin: 8px 0 4px; color: #4c5568; font-size: 9px; font-weight: 750; }
    #chatbot-overlay .chatbot-key-drawer input,
    #chatbot-overlay .chatbot-key-drawer select { width: 100%; min-height: 32px; padding: 6px 9px; color: #30394c; font-size: 10px; border: 1px solid #dfe2e9; border-radius: 8px; background: #fff; }
    #chatbot-overlay .chatbot-key-drawer input:focus,
    #chatbot-overlay .chatbot-key-drawer select:focus { outline: 2px solid rgba(99, 102, 241, .2); border-color: #aaa5f2; }
    #chatbot-overlay .chatbot-key-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; }
    #chatbot-overlay .chatbot-key-actions a,
    #chatbot-overlay .chatbot-key-actions button { padding: 2px 0; color: #5b52d4; font-size: 9px; font-weight: 650; text-decoration: none; border: 0; background: transparent; cursor: pointer; }
    #chatbot-overlay .chatbot-key-actions button { color: #be4351; }
    #chatbot-overlay .chatbot-drawer-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; padding-top: 9px; border-top: 1px solid #e7e4ed; }
    #chatbot-overlay .chatbot-drawer-footer button { min-height: 29px; padding: 0 9px; color: #596276; font-size: 9px; font-weight: 700; border: 1px solid #e1e3e9; border-radius: 7px; background: #fff; cursor: pointer; }
    #chatbot-overlay .chatbot-drawer-footer button[type="submit"] { color: #fff; border-color: #5148d7; background: #5148d7; }
    #chatbot-overlay .chatbot-drawer-footer button:disabled { opacity: .6; cursor: wait; }

    #chatbot-shell {
        --chatbot-accent: #4f46e5;
        --chatbot-ink: #172033;
        --chatbot-muted: #718096;
        display: flex;
        flex-direction: column;
        width: min(100%, 980px);
        height: min(760px, calc(100dvh - 270px));
        min-height: 460px;
        margin: 0 auto;
        overflow: hidden;
        color: var(--chatbot-ink);
        background: #fff;
        border: 1px solid #e6eaf1;
        border-radius: 24px;
        box-shadow: 0 18px 55px rgba(31, 41, 65, 0.09);
    }

    #chatbot-shell *,
    #chatbot-shell *::before,
    #chatbot-shell *::after {
        box-sizing: border-box;
    }

    #chatbot-shell button,
    #chatbot-shell textarea {
        font: inherit;
    }

    #chatbot-shell button:focus-visible,
    #chatbot-shell textarea:focus-visible {
        outline: 3px solid rgba(99, 102, 241, 0.28);
        outline-offset: 2px;
    }

    .chatbot-header {
        display: flex;
        min-height: 78px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid #edf0f5;
        background: rgba(255, 255, 255, 0.96);
    }

    .chatbot-brand,
    .chatbot-title-row,
    .chatbot-brand-copy > p,
    .chatbot-new-chat,
    .chatbot-suggestion,
    .chatbot-composer-actions,
    .chatbot-privacy-note {
        display: flex;
        align-items: center;
    }

    .chatbot-brand { min-width: 0; gap: 12px; }

    .chatbot-brand-icon,
    .chatbot-avatar,
    .chatbot-welcome-mark,
    .chatbot-suggestion-icon {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
    }

    .chatbot-brand-icon {
        width: 44px;
        height: 44px;
        color: #fff;
        font-size: 17px;
        border-radius: 50%;
        background: linear-gradient(145deg, #6366f1, #4338ca);
        box-shadow: 0 6px 16px rgba(79, 70, 229, 0.24);
    }

    .chatbot-brand-copy { min-width: 0; }
    .chatbot-title-row { flex-wrap: wrap; gap: 8px; }
    .chatbot-title-row h2 { margin: 0; color: #172033; font-size: 14px; font-weight: 750; letter-spacing: -0.02em; }
    .chatbot-version-badge { padding: 3px 6px; color: #5145cd; font-size: 9px; font-weight: 800; letter-spacing: 0.08em; border: 1px solid #e2e0ff; border-radius: 999px; background: #f3f2ff; }
    .chatbot-brand-copy > p { gap: 6px; margin: 4px 0 0; color: #7b8496; font-size: 11px; }
    .chatbot-status-dot { width: 7px; height: 7px; border-radius: 50%; background: #20b981; box-shadow: 0 0 0 3px #e6f8f1; }
    .chatbot-header-divider { color: #c1c7d2; }

    .chatbot-new-chat {
        min-height: 36px;
        gap: 7px;
        padding: 0 12px;
        color: #596276;
        font-size: 11px !important;
        font-weight: 650;
        border: 1px solid #e5e8ef;
        border-radius: 11px;
        background: #fff;
        cursor: pointer;
        transition: border-color .16s ease, color .16s ease, background .16s ease;
    }

    .chatbot-new-chat:hover:not(:disabled) { color: #4338ca; border-color: #c9c7ff; background: #f8f7ff; }
    .chatbot-new-chat:disabled { opacity: .46; cursor: not-allowed; }
    .chatbot-header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; }

    .chatbot-conversation {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        background:
            radial-gradient(ellipse at 50% 0%, rgba(238, 240, 255, .52), transparent 58%),
            #fbfcfe;
        scrollbar-color: #cbd1dc transparent;
        scrollbar-width: thin;
    }

    .chatbot-welcome {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px 24px 30px;
        text-align: center;
    }

    .chatbot-welcome-mark {
        width: 58px;
        height: 58px;
        margin-bottom: 18px;
        color: #5145cd;
        font-size: 21px;
        border: 1px solid #e3e1ff;
        border-radius: 20px;
        background: linear-gradient(145deg, #f8f7ff, #eeedff);
        box-shadow: 0 8px 24px rgba(79, 70, 229, .09);
    }

    .chatbot-eyebrow { margin: 0 0 9px; color: #6157cb; font-size: 9px; font-weight: 800; letter-spacing: .16em; }
    .chatbot-welcome h3 { margin: 0; color: #20283a; font-size: clamp(22px, 3vw, 29px); font-weight: 730; letter-spacing: -.045em; }
    .chatbot-welcome-copy { max-width: 430px; margin: 10px 0 0; color: #7b8496; font-size: 12px; line-height: 1.7; }
    .chatbot-suggestions { width: min(100%, 600px); margin-top: 30px; text-align: left; }
    .chatbot-suggestions-label { margin: 0 0 10px 2px; color: #8b93a3; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
    .chatbot-suggestion-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }

    .chatbot-suggestion {
        min-height: 54px;
        gap: 10px;
        padding: 10px 12px;
        color: #485267;
        font-size: 11px !important;
        font-weight: 600;
        text-align: left;
        border: 1px solid #e8ebf2;
        border-radius: 13px;
        background: rgba(255, 255, 255, .88);
        cursor: pointer;
        transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .chatbot-suggestion:hover { transform: translateY(-1px); border-color: #d3d0ff; box-shadow: 0 5px 16px rgba(48, 54, 91, .06); }
    .chatbot-suggestion-icon { width: 30px; height: 30px; color: #5b52d4; font-size: 12px; border-radius: 10px; background: #f0efff; }
    .chatbot-suggestion-arrow { margin-left: auto; color: #b5bbc7; font-size: 9px; }

    .chatbot-thread { width: min(100%, 760px); margin: 0 auto; padding: 24px 26px 30px; }
    .chatbot-message { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 22px; }
    .chatbot-message-user { justify-content: flex-end; }
    .chatbot-message-content { display: flex; min-width: 0; max-width: min(86%, 600px); flex-direction: column; align-items: flex-start; }
    .chatbot-message-user .chatbot-message-content { align-items: flex-end; }
    .chatbot-avatar { width: 30px; height: 30px; margin-top: 18px; font-size: 11px; border-radius: 11px; }
    .chatbot-avatar-assistant { color: #5145cd; border: 1px solid #e6e4ff; background: #f0efff; }
    .chatbot-avatar-user { color: #586174; border: 1px solid #e5e8ef; background: #fff; }
    .chatbot-message-meta { display: flex; align-items: center; gap: 8px; margin: 0 3px 6px; color: #737d90; font-size: 10px; font-weight: 700; }
    .chatbot-message-meta time,
    .chatbot-message-meta span + span { color: #a1a8b5; font-size: 9px; font-weight: 500; }
    .chatbot-bubble { padding: 12px 15px; font-size: 12px; line-height: 1.75; overflow-wrap: anywhere; }
    .chatbot-bubble-assistant { color: #394357; border: 1px solid #e8ebf1; border-radius: 4px 16px 16px 16px; background: #fff; box-shadow: 0 2px 6px rgba(25, 35, 57, .025); }
    .chatbot-bubble-user { color: #fff; border: 1px solid #5148d7; border-radius: 16px 4px 16px 16px; background: linear-gradient(140deg, #5b52df, #4a43c7); }
    .chatbot-bubble strong { font-weight: 750; }
    .chatbot-inline-code { padding: 2px 5px; color: #5145cd; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; border-radius: 5px; background: #f1f0ff; }
    .chatbot-copy-button { display: inline-flex; align-items: center; gap: 5px; margin: 5px 0 0 3px; padding: 4px 6px; color: #8b93a3; font-size: 10px !important; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
    .chatbot-copy-button:hover { color: #5145cd; background: #f0efff; }

    .chatbot-typing { display: flex; min-width: 62px; align-items: center; gap: 4px; padding: 14px 16px; }
    .chatbot-typing i { width: 6px; height: 6px; border-radius: 50%; background: #9c96e5; animation: chatbot-typing 1s infinite ease-in-out; }
    .chatbot-typing i:nth-child(2) { animation-delay: .14s; }
    .chatbot-typing i:nth-child(3) { animation-delay: .28s; }
    @keyframes chatbot-typing { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

    .chatbot-inline-error { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 12px 40px; padding: 10px 12px; color: #9a4d16; font-size: 11px; line-height: 1.5; border: 1px solid #f6dfbd; border-radius: 10px; background: #fffaf1; }
    .chatbot-error-actions { display: flex; justify-content: flex-end; padding: 0 2px 8px; }
    .chatbot-error-actions button { padding: 5px 8px; color: #6358cd; font-size: 10px !important; font-weight: 650; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
    .chatbot-error-actions button:hover { background: #f0efff; }

    .chatbot-composer-wrap { padding: 12px 20px 11px; border-top: 1px solid #edf0f5; background: #fff; }
    .chatbot-voice-banner { display: flex; align-items: center; gap: 9px; margin: 0 0 9px; padding: 9px 11px; color: #9f1239; font-size: 10px; line-height: 1.4; border: 1px solid #fecdd3; border-radius: 12px; background: #fff1f2; }
    .chatbot-voice-banner[hidden] { display: none; }
    .chatbot-voice-recording-badge { display: inline-flex; width: 25px; height: 25px; flex: 0 0 auto; align-items: center; justify-content: center; color: #fff; font-size: 10px; border-radius: 50%; background: #e11d48; box-shadow: 0 0 0 4px #fecdd3; animation: chatbot-recording-pulse 1.2s ease-in-out infinite; }
    .chatbot-voice-wave { display: inline-flex; height: 15px; align-items: center; gap: 2px; margin-left: auto; }
    .chatbot-voice-wave i { width: 3px; height: 5px; border-radius: 3px; background: #e11d48; animation: chatbot-voice-wave .7s ease-in-out infinite alternate; }
    .chatbot-voice-wave i:nth-child(2) { animation-delay: .18s; }
    .chatbot-voice-wave i:nth-child(3) { animation-delay: .36s; }
    @keyframes chatbot-recording-pulse { 50% { box-shadow: 0 0 0 7px rgba(225, 29, 72, .12); } }
    @keyframes chatbot-voice-wave { to { height: 14px; } }
    .chatbot-voice-enrollment-card { margin: 8px 14px; padding: 12px; color: #334155; font-size: 10px; border: 1px solid #c7d2fe; border-radius: 14px; background: #f5f3ff; }
    .chatbot-voice-enrollment-heading { display: flex; align-items: center; gap: 7px; color: #5145cd; font-size: 11px; }
    .chatbot-voice-enrollment-card dl { display: grid; gap: 5px; margin: 9px 0; }
    .chatbot-voice-enrollment-card dl > div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #e6e3f5; }
    .chatbot-voice-enrollment-card dt { color: #64748b; }
    .chatbot-voice-enrollment-card dd { max-width: 65%; margin: 0; color: #1e293b; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
    .chatbot-voice-enrollment-note { margin: 8px 0; color: #64748b; font-size: 9px; line-height: 1.5; }
    .chatbot-voice-enrollment-card > button { display: inline-flex; min-height: 33px; align-items: center; justify-content: center; gap: 6px; padding: 0 11px; color: #fff; font-size: 10px !important; font-weight: 700; border: 0; border-radius: 9px; background: #4f46e5; cursor: pointer; }
    .chatbot-voice-enrollment-card > button:hover { background: #4338ca; }
    .chatbot-voice-enrollment-card > .chatbot-voice-enrollment-dismiss { margin-left: 5px; color: #64748b; border: 1px solid #dbe1ec; background: transparent; }
    .chatbot-voice-enrollment-card > .chatbot-voice-enrollment-dismiss:hover { color: #334155; background: #e9e7f6; }
    .chatbot-composer { display: flex; min-height: 56px; align-items: flex-end; gap: 10px; padding: 9px 10px 8px 15px; border: 1px solid #e1e5ed; border-radius: 16px; background: #fff; box-shadow: 0 3px 12px rgba(24, 35, 59, .035); transition: border-color .16s ease, box-shadow .16s ease; }
    .chatbot-composer:focus-within { border-color: #aaa5f2; box-shadow: 0 0 0 3px rgba(99, 102, 241, .09); }
    .chatbot-composer textarea { flex: 1; min-width: 0; max-height: 144px; resize: none; padding: 7px 0 5px; color: #30394c; font-size: 12px !important; line-height: 1.55; border: 0; outline: 0; background: transparent; }
    .chatbot-composer textarea::placeholder { color: #a0a7b5; }
