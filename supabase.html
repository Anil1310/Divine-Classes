    /********************************************************************
     * SUPABASE BACKEND CLIENT (developer opt-in)
     * Reads project URL + anon key from Settings (state.settings).
     * Enabled only when "Supabase Database" is ON in Settings.
     * Keeps the web app and Supabase tables synchronized when enabled.
     ********************************************************************/
    function getSupabaseApiUrl() {
        return (state.settings && state.settings.supabaseUrl) || '';
    }
    function getSupabaseAnonKey() {
        return (state.settings && state.settings.supabaseKey) || '';
    }
    function createSupabaseSafeSnapshot(source) {
        const snapshot = JSON.parse(JSON.stringify(source || {}));
        if (snapshot.settings) {
            delete snapshot.settings.adminPassword;
            delete snapshot.settings.leadDevPassword;
            delete snapshot.settings.devPassword;
            delete snapshot.settings.admin_password;
            delete snapshot.settings.LEAD_DEV_PASSWORD;
            delete snapshot.settings['Master Admin Password'];
            delete snapshot.settings['Admin Password'];
            delete snapshot.settings['Lead Developer Password'];
            delete snapshot.settings['Lead Dev Password'];
        }
        return snapshot;
    }
    async function supabaseFetch(path, options) {
        const base = getSupabaseApiUrl();
        const key = getSupabaseAnonKey();
        if (!base) throw new Error('Supabase Project URL not set in Settings.');
        if (!key) throw new Error('Supabase Anon Key not set in Settings.');
        if (!state.settings || state.settings.supabaseEnabled !== true) {
            throw new Error('Supabase Database is disabled in Settings.');
        }
        const normalizedBase = base.replace(/\/+$/, '');
        const apiBase = /\/rest\/v1$/i.test(normalizedBase)
            ? normalizedBase
            : normalizedBase + '/rest/v1';
        const url = apiBase + '/' + path.replace(/^\/+/, '');
        const headers = {
            apikey: key,
            Authorization: 'Bearer ' + key,
            'Content-Type': 'application/json',
            ...(options && options.headers ? options.headers : {})
        };
        return fetch(url, { ...options, headers });
    }

    let supabaseSyncTimer = null;

    function supabaseStableFingerprint(value) {
        const text = JSON.stringify(value == null ? null : value);
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return text.length + ':' + (hash >>> 0).toString(16);
    }

    function getSupabaseSyncSnapshot() {
        try { return JSON.parse(localStorage.getItem(getSupabaseSyncSnapshotKey()) || '{}'); }
        catch (e) { return {}; }
    }

    function getSupabaseSyncSnapshotKey() {
        return 'DIVINE_SUPABASE_SYNC_SNAPSHOT_' + supabaseStableFingerprint(getSupabaseApiUrl());
    }

    function rememberSupabaseSyncSnapshot(data) {
        const source = data || state;
        const snapshot = {};
        ['batches', 'students', 'teachers', 'materials', 'offlineTests', 'gallery', 'externalLinks', 'feedbacks'].forEach(function (key) {
            snapshot[key] = {};
            (source[key] || []).forEach(function (record) {
                if (record && (record.id != null || record.roll != null)) {
                    const idKey = String(record.id || record.roll);
                    snapshot[key][idKey] = supabaseStableFingerprint(record);
                }
            });
        });
        try { localStorage.setItem(getSupabaseSyncSnapshotKey(), JSON.stringify(snapshot)); }
        catch (e) { }
    }

    function getChangedSupabaseRecords(stateKey, records, previousSnapshot) {
        const previousRecords = (previousSnapshot && previousSnapshot[stateKey]) || {};
        return (records || []).filter(function (record) {
            if (!record || (record.id == null && record.roll == null)) return false;
            const id = String(record.id || record.roll);
            return previousRecords[id] !== supabaseStableFingerprint(record);
        });
    }

    async function deleteSupabaseRows(tableName, altTable, idColumns, ids) {
        if (!ids.length) return;
        const filter = ids.map(function (id) {
            return encodeURIComponent(String(id));
        }).join(',');
        const failures = [];
        let deleted = false;
        const tables = [tableName, altTable].filter(Boolean);
        for (const name of tables) {
            for (const column of idColumns) {
                try {
                    const response = await supabaseFetch(name + '?' + column + '=in.(' + filter + ')', {
                        method: 'DELETE',
                        headers: { Prefer: 'return=minimal' }
                    });
                    if (response.ok) {
                        deleted = true;
                    } else {
                        failures.push(name + '.' + column + ': HTTP ' + response.status + ' ' + await response.text().catch(function () { return ''; }));
                    }
                } catch (error) {
                    failures.push(name + '.' + column + ': ' + ((error && error.message) || error));
                }
            }
        }
        if (!deleted) {
            throw new Error('Could not delete removed rows from Supabase: ' + failures.join('; '));
        }
    }

    async function deleteRowsRemovedInApp(data, previousSnapshot) {
        const source = data || state;
        const previous = previousSnapshot || getSupabaseSyncSnapshot();
        const tables = {
            batches: { stateKey: 'batches', aliases: ['batches', 'batches_roster'], columns: ['id', 'batch_id'] },
            students: { stateKey: 'students', aliases: ['students', 'students_master'], columns: ['id', 'roll_no', 'roll'] },
            teachers: { stateKey: 'teachers', aliases: ['teachers', 'teachers_roster'], columns: ['id', 'teacher_id'] },
            materials: { stateKey: 'materials', aliases: ['materials', 'materials_repository'], columns: ['id', 'material_id'] },
            offlineTests: { stateKey: 'offlineTests', aliases: ['offline_tests', 'offline_test_marks'], columns: ['id', 'test_id'] },
            gallery: { stateKey: 'gallery', aliases: ['gallery', 'gallery_banners'], columns: ['id', 'banner_id'] },
            externalLinks: { stateKey: 'externalLinks', aliases: ['external_links', 'external_links_hub'], columns: ['id', 'link_id'] },
            feedbacks: { stateKey: 'feedbacks', aliases: ['feedbacks', 'feedback_responses'], columns: ['id', 'row_id'] }
        };
        for (const tableName of Object.keys(tables)) {
            const config = tables[tableName];
            const oldRows = previous[config.stateKey] || {};
            const currentIds = {};
            (source[config.stateKey] || []).forEach(function (record) {
                if (record && (record.id != null || record.roll != null)) {
                    currentIds[String(record.id || record.roll)] = true;
                }
            });
            const removedIds = Object.keys(oldRows).filter(function (id) {
                return !currentIds[id];
            });
            if (removedIds.length) {
                await deleteSupabaseRows(config.aliases[0], config.aliases[1], config.columns, removedIds);
            }
        }
    }

    // DB metadata columns to strip from every row

    /**
     * Transform a raw Supabase row (snake_case) into the app's camelCase format.
     */
    function supabaseRowToAppFormat(row, tableConfig) {
        if (!row || typeof row !== 'object') return row;
        const out = {};
        const colMap = tableConfig.columns || {};

        for (const rawKey of Object.keys(row)) {
            const targetKey = colMap[rawKey] || rawKey;

            out[targetKey] = row[rawKey];
        }

        // Normalization guarantees so frontend never displays "undefined"

            out.id = out.id || row.batch_id || row.id || '';

            out.teacherId = out.teacherId || row.teacher_id || row.teacherId || null;
            out.teacherEmail = out.teacherEmail || row.teacher_email || row.teacherEmail || null;
            if (!out.teacherId) {

                    out.teacherEmail = out.teacherEmail || 'arvind.verma@divineclasses.in';

            if (!Array.isArray(out.studentIds)) out.studentIds = [];
        }
        if (tableConfig.stateKey === 'students') {
            out.id = out.id || row.roll_no || row.id || row.roll || '';
            out.roll = out.roll || row.roll_no || row.roll || out.id;
            out.name = out.name || row.student_name || row.name || 'Student';
            out.password = out.password || row.login_password || row.password || 'password123';
            out.status = out.status || row.access_status || row.status || 'Active';
            out.phone = out.phone || row.contact_phone || row.phone || '';

            out.paidFee = Number(out.paidFee !== undefined ? out.paidFee : (row.paid_fee_inr !== undefined ? row.paid_fee_inr : (row.paid_fee || 0)));
            out.monthlyFee = Number(out.monthlyFee !== undefined ? out.monthlyFee : (row.monthly_fee_inr !== undefined ? row.monthly_fee_inr : (row.monthly_fee || 0)));
            out.dueDate = out.dueDate || row.fee_due_date || row.due_date || 'Fully Paid';
            out.lastReminder = out.lastReminder || row.last_reminder_sent || row.last_reminder || '-';
            out.admissionDate = out.admissionDate || row.admission_date || '';
            out.batchId = out.batchId || (['DC-101','DC-102','DC-103','DC-104','DC-105'].includes(out.roll) ? 'b1' : (['DC-106','DC-107','DC-108'].includes(out.roll) ? 'b2' : 'b3'));
        }
        if (tableConfig.stateKey === 'teachers') {
            out.id = out.id || row.teacher_id || row.id || '';
            out.name = out.name || row.teacher_name || row.name || 'Teacher';
            out.email = out.email || row.login_email || row.email || '';
            out.password = out.password || row.login_password || row.password || 'teacher123';
            out.status = out.status || row.access_status || row.status || 'Active';
            out.phone = out.phone || row.contact_phone || row.phone || '';
            out.subject = out.subject || row.primary_subject || row.subject || 'Faculty Mentor';
            out.qualification = out.qualification || row.academic_qualifications || row.qualification || 'M.Sc., B.Ed.';
            out.experience = out.experience || row.teaching_experience || row.experience || '5+ Years';
            out.specialization = out.specialization || row.specialization_focus || row.specialization || 'IIT-JEE / NEET Specialist';
            out.bio = out.bio || row.faculty_biography || row.bio || 'Dedicated faculty mentor at Divine Classes.';
            out.photo = out.photo || row.profile_photo || row.photo || '';
            out.avatarColor = out.avatarColor || row.avatar_color || row.avatarColor || 'from-indigo-600 to-blue-600';
            out.initials = out.initials || (out.name ? out.name.split(' ').map(function(n) { return n[0]; }).join('').slice(0, 2).toUpperCase() : 'FC');
        }
        if (tableConfig.stateKey === 'offlineTests') {
            out.id = out.id || row.test_id || row.id || '';
            out.title = out.title || row.test_title || row.name || row.title || 'Offline Test';
            out.batchId = out.batchId || row.batch_id || row.batchId || 'b1';
            out.date = out.date || row.test_date || row.date || '';
            out.subject = out.subject || row.subject || 'Physics';
            out.maxMarks = Number(out.maxMarks !== undefined ? out.maxMarks : (row.max_marks || 100));
            out.marks = (out.marks && typeof out.marks === 'object') ? out.marks : (row.marks || {});
        }
        if (tableConfig.stateKey === 'feedbacks') {
            out.id = out.id || row.id || ('f' + Math.random().toString(36).substr(2, 6));
            out.authorName = out.authorName || row.name || row.author_name || row.student_name || 'Parent / Student';
            out.comment = out.comment || row.message || row.comment || row.feedback_comment || '';
            out.rating = Number(out.rating !== undefined ? out.rating : (row.rating || 5));
            out.batchName = out.batchName || row.batch || row.batch_name || 'JEE Advanced Target 2027';
            out.date = out.date || row.created_at || row.date || '13 Oct 2026';
            out.role = out.role || row.role || ((out.authorName && /parent/i.test(out.authorName)) ? 'Parent' : 'Student');
            out.category = out.category || row.category || row.topic || 'Teaching Quality';
        }

        return out;
    }

    /**
     * Persist pending edits directly to Supabase
     */
    let supabaseSyncInFlight = null;
    let supabaseSyncQueued = false;

    async function performSupabaseSync() {
        if (!state.settings || state.settings.supabaseEnabled !== true) return { synced: false };
        const previousSyncSnapshot = getSupabaseSyncSnapshot();

        // An older open tab must not reinsert demo rows after they were wiped.
        const snapshotResponse = await supabaseFetch('db_json?snapshot_key=eq.main&select=payload');
        if (!snapshotResponse.ok) {
            throw new Error('Could not verify the Supabase demo-data state before syncing.');
        }
        const snapshotRows = await snapshotResponse.json();
        const savedSettings = snapshotRows[0] && snapshotRows[0].payload && snapshotRows[0].payload.settings;
        if (savedSettings && (savedSettings.studentSeedDataDisabled === true || savedSettings.studentSeedDataDisabled === 'true')) {
            if (!state.settings) state.settings = {};
            state.settings.studentSeedDataDisabled = true;
            const studentClearTime = Date.parse(savedSettings.studentTableClearedAt || '');
            if (savedSettings.studentTableClearedAt) state.settings.studentTableClearedAt = savedSettings.studentTableClearedAt;
            const removedStudentIds = {};
            state.students = (state.students || []).filter(function (student) {
                if (!student) return false;
                const createdAt = Date.parse(student.createdAt || '');
                if (!isDummySeedRecord(student) && (!savedSettings.studentTableClearedAt || (!isNaN(createdAt) && createdAt >= studentClearTime))) return true;
                [student.id, student.roll].forEach(function (id) {
                    if (id) removedStudentIds[String(id)] = true;
                });
                return false;
            });
            (state.batches || []).forEach(function (batch) {
                if (Array.isArray(batch.studentIds)) {
                    batch.studentIds = batch.studentIds.filter(function (id) { return !removedStudentIds[String(id)]; });
                }
            });
            (state.offlineTests || []).forEach(function (test) {
                if (!test || !test.marks || typeof test.marks !== 'object') return;
                Object.keys(removedStudentIds).forEach(function (id) { delete test.marks[id]; });
            });
        }
        if (savedSettings && (savedSettings.dummyDataWiped === true || savedSettings.dummyDataWiped === 'true')) {
            if (!state.settings) state.settings = {};
            state.settings.dummyDataWiped = true;
            state.settings.showDummyData = false;

            const dummyStudentIds = {};
            const dummyMaterialIds = {};
            ['students', 'materials'].forEach(function (table) {
                state[table] = (state[table] || []).filter(function (record) {
                    if (!record || !isDummySeedRecord(record)) return true;
                    if (table === 'students') dummyStudentIds[String(record.id)] = true;
                    if (table === 'materials') dummyMaterialIds[String(record.id)] = true;
                    return false;
                });
            });
            ['batches', 'offlineTests', 'teachers', 'gallery', 'feedbacks'].forEach(function (table) {
                state[table] = (state[table] || []).filter(function (record) {
                    return !isDummySeedRecord(record);
                });
            });
            (state.batches || []).forEach(function (batch) {
                if (Array.isArray(batch.studentIds)) {
                    batch.studentIds = batch.studentIds.filter(function (id) { return !dummyStudentIds[String(id)]; });
                }
            });
            (state.offlineTests || []).forEach(function (test) {
                if (!test.marks || typeof test.marks !== 'object') return;
                Object.keys(dummyStudentIds).forEach(function (id) { delete test.marks[id]; });
            });
            state.notifications = (state.notifications || []).filter(function (notification) {
                if (!notification) return false;
                const notificationId = String(notification.id || '');
                return !isDummySeedRecord(notification) &&
                    !dummyStudentIds[String(notification.targetStudentId || notification.studentId || '')] &&
                    !dummyMaterialIds[String(notification.materialId || '')] &&
                    !Object.keys(dummyStudentIds).some(function (id) {
                        return notificationId.indexOf('notif_fee_' + id + '_') === 0 ||
                            notificationId.indexOf('monthly_fee_' + id + '_') === 0;
                    }) &&
                    !Object.keys(dummyMaterialIds).some(function (id) {
                        return notificationId.indexOf('notif_mat_' + id) === 0;
                    });
            });
            if (typeof saveStateLocally === 'function') saveStateLocally();
        }

        const syncData = createSupabaseSafeSnapshot(state);
        await deleteRowsRemovedInApp(syncData, previousSyncSnapshot);

        // Start the full snapshot write before table upserts so independent
        // requests complete concurrently instead of adding their latencies.
        const snapshotWrite = (async function () {
            const response = await supabaseFetch('db_json?snapshot_key=eq.main', {
                method: 'PATCH',
                headers: { Prefer: 'return=minimal' },
                body: JSON.stringify({
                    payload: syncData,
                    updated_at: new Date().toISOString()
                })
            });
            if (!response.ok) {
                throw new Error('db_json update failed (HTTP ' + response.status + '): ' +
                    await response.text().catch(function () { return ''; }));
            }
        })();

        // 2. Also sync batches and students to their dedicated tables
        const changedBatches = getChangedSupabaseRecords('batches', syncData.batches, previousSyncSnapshot);
        const changedStudents = getChangedSupabaseRecords('students', syncData.students, previousSyncSnapshot);
        const changedTeachers = getChangedSupabaseRecords('teachers', syncData.teachers, previousSyncSnapshot);
        const changedMaterials = getChangedSupabaseRecords('materials', syncData.materials, previousSyncSnapshot);
        const changedTests = getChangedSupabaseRecords('offlineTests', syncData.offlineTests, previousSyncSnapshot);
        const changedGallery = getChangedSupabaseRecords('gallery', syncData.gallery, previousSyncSnapshot);
        const changedLinks = getChangedSupabaseRecords('externalLinks', syncData.externalLinks, previousSyncSnapshot);
        const changedFeedbacks = getChangedSupabaseRecords('feedbacks', syncData.feedbacks, previousSyncSnapshot);

        const batchesPayload = changedBatches.map(function (b) {
            return {
                batch_id: b.id,
                batch_name: b.name,
                subjects: b.subject,
                schedule: b.schedule,
                classroom_hall: b.room,
                lead_faculty: b.teacher,
                student_count: (b.studentIds || []).length
            };
        });
        const studentsPayload = changedStudents.map(function (s) {
            return {
                roll_no: s.roll || s.id,
                student_name: s.name,
                login_password: s.password || 'password123',
                access_status: s.status || 'Active',
                parent_name: s.parentName || '',
                contact_phone: s.phone || '',
                total_fee_inr: Number(s.totalFee || 0),
                paid_fee_inr: Number(s.paidFee || 0),
                pending_dues_inr: Number((s.totalFee || 0) - (s.paidFee || 0)),
                fee_due_date: s.dueDate || 'Fully Paid',
                last_reminder_sent: s.lastReminder || '-',
                admission_date: s.admissionDate || '',
                monthly_fee_inr: Number(s.monthlyFee || 0)
            };
        });

        await Promise.all([snapshotWrite].concat(coreWrites, tableWrites));
        rememberSupabaseSyncSnapshot(syncData);
        return { synced: true, studentTable: studentTable || (syncData.students && syncData.students.length ? 'students' : '') };

    function syncPendingDataToSupabase() {
        if (supabaseSyncInFlight) {
            supabaseSyncQueued = true;
            return supabaseSyncInFlight;
        }
        supabaseSyncInFlight = (async function () {
            let result;
            do {
                supabaseSyncQueued = false;
                result = await performSupabaseSync();
            } while (supabaseSyncQueued);
            return result;
        })();
        const currentSync = supabaseSyncInFlight;
        return currentSync.finally(function () {
            if (supabaseSyncInFlight === currentSync) supabaseSyncInFlight = null;
        });
    }

    function autoSyncToSupabase() {
        if (!state.settings || state.settings.supabaseEnabled !== true || !state.settings.supabaseUrl || !state.settings.supabaseKey) return;
        if (supabaseSyncTimer) clearTimeout(supabaseSyncTimer);
        supabaseSyncTimer = setTimeout(function () {
            syncPendingDataToSupabase().then(function (result) {
                if (result && result.synced) updateSyncBadge('✓ Cloud Synced', 'success');
            }).catch(function (error) {
                console.warn('[Supabase] Sync notice:', error);
            });
        }, 300);
    }


    /********************************************************************
     * SUPABASE DATA LOADING - Load all tables from Supabase into state
     * Used when Supabase Database is enabled as primary data source.
     ********************************************************************/
    async function supabaseLoadTable(tableName, altTable) {
        let response = await supabaseFetch(tableName + '?select=*');
        if (!response.ok && altTable) {
            response = await supabaseFetch(altTable + '?select=*');
        }
        if (!response.ok) {
            const details = await response.text().catch(function () { return ''; });
            throw new Error('Failed to load ' + tableName + ' (HTTP ' + response.status + ')' + (details ? ': ' + details : ''));
        }
        return await response.json();
    }

    async function loadDataFromSupabase() {
        if (!state.settings || state.settings.supabaseEnabled !== true) return;
        const startingLocalRevision = typeof localDataRevision === 'number' ? localDataRevision : null;

        const loadedData = {};
        const loadErrors = [];
        const emptyTables = [];
        await Promise.all(Object.keys(SUPABASE_TABLE_MAP).map(async function (tableName) {
            const config = SUPABASE_TABLE_MAP[tableName];
            try {
                const rawData = await supabaseLoadTable(tableName, config.altTable);
                if (Array.isArray(rawData)) {
                    loadedData[config.stateKey] = rawData.map(function (row) {
                        return supabaseRowToAppFormat(row, config);
                    });
                    if (rawData.length === 0) emptyTables.push(tableName);
                }
            } catch (e) {
                loadErrors.push(tableName + ': ' + ((e && e.message) || e));
                console.warn('Could not load ' + tableName + ' from Supabase (skipping):', e);
            }
        }));

        // Handle settings (support both settings_config and settings key-value tables)
        try {
            let settingsData = null;
            try {
                settingsData = await supabaseLoadTable('settings_config');
            } catch (eConfig) {
                try { settingsData = await supabaseLoadTable('settings'); } catch (eSet) { }
            }
            if (Array.isArray(settingsData)) {
                const settingsKeyMap = {
                    'Institute Name': 'instituteName',
                    'Tagline': 'tagline',
                    'Helpline Phone': 'phone',
                    'Display Contact': 'contactDisplay',
                    'Official Email': 'email',
                    'Address': 'address',
                    'YouTube Channel': 'youtubeUrl',
                    'Admin Name': 'adminName',
                    'Admin Email ID': 'adminEmail',
                    'Lead Dev Email': 'leadDevEmail',
                    'Lead Developer Email': 'leadDevEmail',
                    'LEAD_DEV_EMAIL': 'leadDevEmail',
                    'UPI Payment ID': 'upiId',
                    'Facebook Page': 'facebookUrl',
                    'Instagram Profile': 'instagramUrl',
                    'Show Requirement Labels': 'showRequirementLabels',
                    'Admin Feedback Delete': 'allowAdminFeedbackDelete',
                    'Study Link Delete': 'allowAdminLinkDelete',
                    'Show Dummy / Demo Data': 'showDummyData',
                    'Dummy Data Wiped': 'dummyDataWiped',
                    'Student Seed Data Disabled': 'studentSeedDataDisabled',
                    'Student Table Cleared At': 'studentTableClearedAt',
                    'institute_name': 'instituteName',
                    'contact_display': 'contactDisplay',
                    'show_requirement_labels': 'showRequirementLabels',
                    'allow_admin_feedback_delete': 'allowAdminFeedbackDelete',
                    'allow_admin_link_delete': 'allowAdminLinkDelete',
                    'show_dummy_data': 'showDummyData',
                    'student_seed_data_disabled': 'studentSeedDataDisabled',
                    'student_table_cleared_at': 'studentTableClearedAt',
                    'supabase_enabled': 'supabaseEnabled',
                    'supabase_url': 'supabaseUrl',
                    'supabase_key': 'supabaseKey',
                    'sheets_mirror_enabled': 'sheetsMirrorEnabled',
                    'drive_folder_url': 'driveFolderUrl',
                    'admin_name': 'adminName',
                    'admin_email': 'adminEmail',
                    'facebook_url': 'facebookUrl',
                    'instagram_url': 'instagramUrl',
                    'youtube_url': 'youtubeUrl'
                };
                const settingsObj = {};
                settingsData.forEach(function(s) {
                    if (s && s.setting_parameter) {
                        if (/^(master admin password|admin password|admin login password|admin_password|lead developer password|lead dev password|lead_dev_password)$/i.test(s.setting_parameter)) return;
                        const k = settingsKeyMap[s.setting_parameter] || s.setting_parameter;
                        settingsObj[k] = s.configured_value;
                    } else if (s && s.key) {
                        const mappedKey = settingsKeyMap[s.key] || s.key;
                        settingsObj[mappedKey] = s.value;
                    }
                });
                const boolKeys = ['showRequirementLabels', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'dummyDataWiped', 'studentSeedDataDisabled'];
                boolKeys.forEach(function(bk) {
                    if (settingsObj[bk] !== undefined) {
                        const str = String(settingsObj[bk]).trim().toLowerCase();
                        settingsObj[bk] = !(str === 'off' || str === 'false' || str === '0' || str === 'no');
                    }
                });
                loadedData.settings = Object.assign({}, state.settings, settingsObj);
            }
        } catch (e) {
            console.warn('Failed to load settings from Supabase:', e);
        }

        if (Array.isArray(loadedData.students)) {
            let snapshotStudents = [];
            try {
                const snapshotRows = await supabaseLoadTable('db_json');
                const snapshotRow = Array.isArray(snapshotRows) && snapshotRows.find(function (row) {
                    return row && row.snapshot_key === 'main';
                });
                const snapshot = snapshotRow && snapshotRow.payload;
                if (snapshot && Array.isArray(snapshot.students)) snapshotStudents = snapshot.students;
            } catch (snapshotError) {
                console.warn('Could not load student creation timestamps from the Supabase snapshot:', snapshotError);
            }

            const knownStudents = (state.students || []).concat(snapshotStudents);
            loadedData.students.forEach(function (student) {
                if (!student || student.createdAt) return;
                const known = knownStudents.find(function (record) {
                    if (!record) return false;
                    return (student.id && (record.id === student.id || record.roll === student.id)) ||
                        (student.roll && (record.id === student.roll || record.roll === student.roll));
                });
                if (known && known.createdAt) student.createdAt = known.createdAt;
            });
        }

        if (startingLocalRevision !== null && startingLocalRevision !== localDataRevision) {
            return { emptyTables: emptyTables, loadErrors: loadErrors, skipped: true };
        }

        Object.keys(loadedData).forEach(function (key) {
            if (loadedData[key] && (Array.isArray(loadedData[key]) || typeof loadedData[key] === 'object')) {
                state[key] = loadedData[key];
            }
        });
        if (typeof applyClientDummyDataLocks === 'function') applyClientDummyDataLocks();
        if (state.settings && state.settings.studentSeedDataDisabled && state.settings.studentTableClearedAt) {
            const clearedAt = Date.parse(state.settings.studentTableClearedAt);
            const removedStudentIds = {};
            state.students = (state.students || []).filter(function (student) {
                if (!student) return false;
                const createdAt = Date.parse(student.createdAt || '');
                if (!isDummySeedRecord(student) && !isNaN(createdAt) && createdAt >= clearedAt) return true;
                [student.id, student.roll].forEach(function (id) {
                    if (id) removedStudentIds[String(id)] = true;
                });
                return false;
            });
            (state.batches || []).forEach(function (batch) {
                if (Array.isArray(batch.studentIds)) {
                    batch.studentIds = batch.studentIds.filter(function (id) { return !removedStudentIds[String(id)]; });
                }
            });
            (state.offlineTests || []).forEach(function (test) {
                if (!test || !test.marks || typeof test.marks !== 'object') return;
                Object.keys(removedStudentIds).forEach(function (id) { delete test.marks[id]; });
            });
        }
        rememberSupabaseSyncSnapshot();
        return { emptyTables: emptyTables, loadErrors: loadErrors };
    }

    async function supabaseClearDummyData(removedIds) {
        if (!state.settings || !state.settings.supabaseUrl || !state.settings.supabaseKey) return { success: false, reason: 'Supabase not configured' };
        const dummyTableIds = {
            batches: ['b1','b2','b3','b4','b5','b6','b7','b8','b9','b10'],
            students: [
                's1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11',

            offline_tests: ['t1','t2','t3','t4','t5','t6','t7','t8','t9','t10','t1793673241001','t1793673262116'],
            teachers: ['tr1','tr2','tr3','tr4','tr5','tr6','tr7','tr8','tr9','tr10'],
            gallery: ['g1','g2','g3','g4','g5','g6','g7','g8','g9','g10'],
            feedbacks: ['f1','f2','f3','f4','f5','f6','f7','f8','f9','f10']
        };
        const tableAliases = {
            batches: ['batches', 'batches_roster'],
            students: ['students', 'students_master'],
            materials: ['materials', 'materials_repository'],
            offline_tests: ['offline_tests', 'offline_test_marks'],
            teachers: ['teachers', 'teachers_roster'],
            gallery: ['gallery', 'gallery_banners'],
            feedbacks: ['feedbacks', 'feedback_responses']
        };
        const idColumns = {
            batches: ['id', 'batch_id'],
            students: ['id', 'roll_no'],
            materials: ['id', 'material_id'],
            offline_tests: ['id', 'test_id'],
            teachers: ['id', 'teacher_id'],
            gallery: ['id', 'banner_id'],
            feedbacks: ['id', 'row_id']
        };
        const failures = [];
        // CRITICAL: external_links and settings_config are NEVER deleted!
        for (const [tbl, ids] of Object.entries(dummyTableIds)) {
            const allIds = ids.concat((removedIds && removedIds[tbl]) || []);
            const uniqueIds = allIds.filter((id, index) => id && allIds.indexOf(id) === index);
            if (!uniqueIds.length) continue;
            let tableAvailable = false;
            const tableFailures = [];
            for (const tableName of tableAliases[tbl] || [tbl]) {
                for (const column of idColumns[tbl] || ['id']) {
                    const filter = uniqueIds.map(id => encodeURIComponent(String(id))).join(',');
                    const response = await supabaseFetch(`${tableName}?${column}=in.(${filter})`, {
                        method: 'DELETE',
                        headers: { 'Prefer': 'return=minimal' }
                    });
                    if (response.ok) tableAvailable = true;
                    else tableFailures.push(`${tableName}.${column}: ${response.status} ${await response.text()}`);
                }
            }
            if (!tableAvailable) {
                failures.push(`${tbl}: ${tableFailures.join('; ')}`);
            }
        }
        const notificationIds = (removedIds && removedIds.notifications) || [];
        if (notificationIds.length) {
            const filter = notificationIds.map(id => encodeURIComponent(String(id))).join(',');
            const notificationResponse = await supabaseFetch(`notifications?id=in.(${filter})`, {
                method: 'DELETE',
                headers: { 'Prefer': 'return=minimal' }
            });
            if (!notificationResponse.ok) {
                failures.push(`notifications: ${notificationResponse.status} ${await notificationResponse.text()}`);
            }
        }
        for (const setting of [
            { parameter: 'Show Dummy / Demo Data', value: 'Off' },
            { parameter: 'Dummy Data Wiped', value: 'Yes' },
            { parameter: 'Student Seed Data Disabled', value: 'Yes' }
        ]) {
            const response = await supabaseFetch(`settings_config?setting_parameter=eq.${encodeURIComponent(setting.parameter)}`, {
                method: 'PATCH',
                headers: { 'Prefer': 'return=minimal' },
                body: JSON.stringify({ configured_value: setting.value })
            });
            if (!response.ok) failures.push(`settings_config (${setting.parameter}): ${response.status} ${await response.text()}`);
        }
        const snapshotResponse = await supabaseFetch('db_json?snapshot_key=eq.main', {
            method: 'PATCH',
            headers: { 'Prefer': 'return=minimal' },
            body: JSON.stringify({ payload: createSupabaseSafeSnapshot(state), updated_at: new Date().toISOString() })
        });
        if (!snapshotResponse.ok) failures.push(`db_json snapshot: ${snapshotResponse.status} ${await snapshotResponse.text()}`);
        if (failures.length) throw new Error(`Supabase dummy-data cleanup failed: ${failures.join('; ')}`);
        return { success: true };
    }

            { setting_parameter: 'Show Dummy / Demo Data', configured_value: (s.showDummyData === false || s.showDummyData === 'Off' || s.showDummyData === 'off' || s.showDummyData === 'false' || s.dummyDataWiped === true || s.dummyDataWiped === 'true') ? 'Off' : 'On', description: 'Seed demo students/batches/tests visibility' },
            { setting_parameter: 'Dummy Data Wiped', configured_value: (s.dummyDataWiped === true || s.dummyDataWiped === 'true') ? 'Yes' : 'No', description: 'Permanent clearance status before client handover' },
            { setting_parameter: 'Student Seed Data Disabled', configured_value: (s.studentSeedDataDisabled === true || s.studentSeedDataDisabled === 'true') ? 'Yes' : 'No', description: 'Do not restore demo student rows after the student table is cleared' },
            { setting_parameter: 'Student Table Cleared At', configured_value: s.studentTableClearedAt || '', description: 'Reject stale student rows from before the developer clear action' },
            { setting_parameter: 'Supabase Enabled', configured_value: (s.supabaseEnabled === false || s.supabaseEnabled === 'Off' || s.supabaseEnabled === 'off' || s.supabaseEnabled === 'false') ? 'Off' : 'On', description: 'Supabase primary database toggle' },
            { setting_parameter: 'Supabase URL', configured_value: s.supabaseUrl || 'https://srjqsofkjizwskqnzyfn.supabase.co', description: 'Supabase Project REST URL' },
            { setting_parameter: 'Supabase Key', configured_value: s.supabaseKey || 'sb_publishable_vxonFVKPpyJjY5O-Y9mS6g_bhSYCcsS', description: 'Supabase API Key' },
            { setting_parameter: 'Last Auto-Sync Timestamp', configured_value: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }), description: 'Time of last auto-sync from Web App' }
        ];

        try {
            await fetch(`${base}/settings_config?on_conflict=setting_parameter`, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(configUpdates)
            });
            const duplicateRowsResponse = await fetch(
                `${base}/settings_config?setting_parameter=${encodeURIComponent('in.(Master Admin Password,Admin Password,Admin Login Password,admin_password,Lead Developer Password,Lead Dev Password,LEAD_DEV_PASSWORD)')}`,
                { method: 'DELETE', headers: headers }
            );
            if (!duplicateRowsResponse.ok) {
                throw new Error(`Duplicate developer setting cleanup failed (${duplicateRowsResponse.status}).`);
            }
        } catch (e) {
            console.warn('[Supabase] settings_config upsert notice:', e);
        }

        // Also update db_json snapshot
        try {
            await fetch(`${base}/db_json?snapshot_key=eq.main`, {
                method: 'PATCH',
                headers: {
                    apikey: key,
                    Authorization: 'Bearer ' + key,
                    'Content-Type': 'application/json',
                    Prefer: 'return=minimal'
                },
                body: JSON.stringify({ payload: createSupabaseSafeSnapshot(state), updated_at: new Date().toISOString() })
            });
        } catch (e) {}
    }

    let supabaseSettingsPollTimer = null;
    let supabaseRefreshInProgress = false;
    let supabaseRealtimeClient = null;
    let supabaseRealtimeChannel = null;
    let supabaseRealtimeConfig = '';
    let supabaseRealtimeRefreshTimer = null;
    let supabaseRenderTimer = null;
    let supabaseRealtimeActive = false;

    function renderSupabaseCloudUpdate() {
        clearTimeout(supabaseRenderTimer);
        supabaseRenderTimer = setTimeout(function () {
            if (typeof saveStateLocally === 'function') saveStateLocally(true, true);
            if (typeof savePersistentSettingsToLocal === 'function') savePersistentSettingsToLocal();
            if (typeof updateRoleUI === 'function') updateRoleUI();
            if (typeof renderSidebar === 'function') renderSidebar();
            if (typeof renderMainContentPreservingScroll === 'function') {
                renderMainContentPreservingScroll();
            } else if (typeof renderMainContent === 'function') {
                renderMainContent();
            }
            if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
            if (typeof checkNewNotificationSound === 'function') checkNewNotificationSound();
            updateSyncBadge('✓ Cloud Synced', 'success');
        }, 100);
    }

    function applySupabaseSnapshot(snapshot) {
        if (!snapshot || typeof snapshot !== 'object') return false;
        const keys = Object.keys(SUPABASE_TABLE_MAP).map(function (tableName) {
            return SUPABASE_TABLE_MAP[tableName].stateKey;
        }).concat(['settings']);
        const before = {};
        keys.forEach(function (key) { before[key] = state[key]; });
        const beforeFingerprint = supabaseStableFingerprint(before);

        keys.forEach(function (key) {
            if (key === 'settings') {
                if (snapshot.settings && typeof snapshot.settings === 'object') {
                    state.settings = Object.assign({}, state.settings, snapshot.settings, {
                        supabaseEnabled: true,
                        supabaseUrl: getSupabaseApiUrl(),
                        supabaseKey: getSupabaseAnonKey()
                    });
                }
            } else if (Array.isArray(snapshot[key])) {
                state[key] = snapshot[key];
            }
        });
        if (typeof applyClientDummyDataLocks === 'function') applyClientDummyDataLocks();

        const after = {};
        keys.forEach(function (key) { after[key] = state[key]; });
        if (beforeFingerprint === supabaseStableFingerprint(after)) return false;
        renderSupabaseCloudUpdate();
        return true;
    }

    function getRealtimeRecordIdentity(record, stateKey) {
        if (!record) return '';
        if (stateKey === 'students') return String(record.id || record.roll || '');
        return String(record.id || record.roll || '');
    }

    function applySupabaseTableChange(tableName, change) {
        if (!state.settings || state.settings.supabaseEnabled !== true || !change) return;
        if (tableName === 'db_json') {
            const snapshot = change.new && change.new.payload;
            if (snapshot) applySupabaseSnapshot(snapshot);
            return;
        }
        if (tableName === 'settings_config' || tableName === 'settings') {
            clearTimeout(supabaseRealtimeRefreshTimer);
            supabaseRealtimeRefreshTimer = setTimeout(pollSupabaseSettings, 150);
            return;
        }

        const config = SUPABASE_TABLE_MAP[tableName];
        if (!config) return;
        const deleted = change.eventType === 'DELETE';
        const rawRecord = deleted ? change.old : change.new;
        if (!rawRecord || typeof rawRecord !== 'object') return;
        const record = supabaseRowToAppFormat(rawRecord, config);
        const identity = getRealtimeRecordIdentity(record, config.stateKey);
        if (!identity) return;

        const collection = Array.isArray(state[config.stateKey]) ? state[config.stateKey].slice() : [];
        const index = collection.findIndex(function (item) {
            return getRealtimeRecordIdentity(item, config.stateKey) === identity ||
                (record.roll && item && String(item.roll || '') === String(record.roll));
        });
        if (deleted) {
            if (index < 0) return;
            collection.splice(index, 1);
        } else if (index >= 0) {
            collection[index] = Object.assign({}, collection[index], record);
        } else {
            collection.unshift(record);
        }
        state[config.stateKey] = collection;
        if (typeof applyClientDummyDataLocks === 'function') applyClientDummyDataLocks();
        renderSupabaseCloudUpdate();
    }

    async function pollSupabaseSettings() {
        if (!state.settings || state.settings.supabaseEnabled !== true) return;
        try {
            const rawData = await supabaseLoadTable('settings_config');
            if (!Array.isArray(rawData) || rawData.length === 0) return;
            const settingsKeyMap = {
                'Institute Name': 'instituteName',
                'Tagline': 'tagline',
                'Helpline Phone': 'phone',
                'Display Contact': 'contactDisplay',
                'Official Email': 'email',
                'Address': 'address',
                'YouTube Channel': 'youtubeUrl',
                'Admin Name': 'adminName',
                'Admin Email ID': 'adminEmail',
                'Lead Dev Email': 'leadDevEmail',
                'Lead Developer Email': 'leadDevEmail',
                'LEAD_DEV_EMAIL': 'leadDevEmail',
                'UPI Payment ID': 'upiId',
                'Facebook Page': 'facebookUrl',
                'Instagram Profile': 'instagramUrl',
                'Show Requirement Labels': 'showRequirementLabels',
                'Admin Feedback Delete': 'allowAdminFeedbackDelete',
                'Study Link Delete': 'allowAdminLinkDelete',
                'Show Dummy / Demo Data': 'showDummyData',
                'Dummy Data Wiped': 'dummyDataWiped',
                'Student Seed Data Disabled': 'studentSeedDataDisabled',
                'Student Table Cleared At': 'studentTableClearedAt'
            };
            const boolKeys = ['showRequirementLabels', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'dummyDataWiped', 'studentSeedDataDisabled'];
            let changed = false;
            rawData.forEach(function(item) {
                if (!item || !item.setting_parameter) return;
                if (/^(master admin password|admin password|admin login password|admin_password|lead developer password|lead dev password|lead_dev_password)$/i.test(item.setting_parameter)) return;
                const k = settingsKeyMap[item.setting_parameter];
                if (!k) return;
                let val = item.configured_value;
                if (boolKeys.indexOf(k) !== -1) {
                    const str = String(val).trim().toLowerCase();
                    val = !(str === 'off' || str === 'false' || str === '0' || str === 'no');
                }
                if (state.settings[k] !== val) {
                    state.settings[k] = val;
                    changed = true;
                }
            });
            if (changed) {
                console.log('[Supabase] Live settings updated from cloud (multi-device sync)');
                saveStateLocally(true, true);
                if (typeof savePersistentSettingsToLocal === 'function') {
                    savePersistentSettingsToLocal();
                }
                if (typeof updateRoleUI === 'function') updateRoleUI();
                if (typeof renderSidebar === 'function') renderSidebar();
                if (typeof renderMainContentPreservingScroll === 'function') {
                    renderMainContentPreservingScroll();
                } else if (typeof renderMainContent === 'function') {
                    renderMainContent();
                }
            }
        } catch (e) {
            console.warn('[Supabase] Live settings refresh failed:', e);
        }
    }

    async function refreshSupabaseDataFromCloud() {
        if (!state.settings || state.settings.supabaseEnabled !== true || document.hidden || supabaseRefreshInProgress) return;
        supabaseRefreshInProgress = true;
        try {
            const keys = Object.keys(SUPABASE_TABLE_MAP).map(function (tableName) {
                return SUPABASE_TABLE_MAP[tableName].stateKey;
            }).concat(['settings']);
            const before = {};
            keys.forEach(function (key) { before[key] = state[key]; });
            const beforeFingerprint = supabaseStableFingerprint(before);
            if (supabaseRealtimeActive) {
                const response = await supabaseFetch('db_json?select=payload&snapshot_key=eq.main');
                if (response.ok) {
                    const rows = await response.json();
                    if (Array.isArray(rows) && rows[0] && rows[0].payload) {
                        applySupabaseSnapshot(rows[0].payload);
                        return;
                    }
                }
            }

            const result = await loadDataFromSupabase();
            if (result && result.skipped) return;
            const after = {};
            keys.forEach(function (key) { after[key] = state[key]; });
            if (beforeFingerprint === supabaseStableFingerprint(after)) return;

            if (typeof saveStateLocally === 'function') saveStateLocally(true, true);
            if (typeof savePersistentSettingsToLocal === 'function') savePersistentSettingsToLocal();
            if (typeof updateRoleUI === 'function') updateRoleUI();
            if (typeof renderSidebar === 'function') renderSidebar();
            if (typeof renderMainContentPreservingScroll === 'function') {
                renderMainContentPreservingScroll();
            } else if (typeof renderMainContent === 'function') {
                renderMainContent();
            }
            if (typeof updateNotificationBadge === 'function') updateNotificationBadge();
            updateSyncBadge('✓ Cloud Synced', 'success');
        } catch (e) {
            console.warn('[Supabase] Live data refresh failed:', e);
            updateSyncBadge('Cloud refresh failed', 'error');
        } finally {
            supabaseRefreshInProgress = false;
        }
    }

    function startSupabaseLiveSync() {
        if (!state.settings || state.settings.supabaseEnabled !== true ||
            !state.settings.supabaseUrl || !state.settings.supabaseKey) return;

        const configKey = getSupabaseApiUrl() + '|' + getSupabaseAnonKey();
        if (supabaseRealtimeConfig !== configKey) {
            if (supabaseRealtimeChannel && supabaseRealtimeClient) {
                supabaseRealtimeClient.removeChannel(supabaseRealtimeChannel);
            }
            supabaseRealtimeChannel = null;
            supabaseRealtimeClient = null;
            supabaseRealtimeConfig = configKey;
            supabaseRealtimeActive = false;
        }

        if (!supabaseRealtimeChannel && window.supabase && window.supabase.createClient) {
            const projectUrl = getSupabaseApiUrl().replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/, '');
            supabaseRealtimeClient = window.supabase.createClient(projectUrl, getSupabaseAnonKey());
            let channel = supabaseRealtimeClient.channel('app-data-live-sync');
            Object.keys(SUPABASE_TABLE_MAP).forEach(function (tableName) {
                channel = channel.on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: tableName
                }, function (change) {
                    applySupabaseTableChange(tableName, change);
                });
            });
            const snapshotChange = {
                event: '*',
                schema: 'public',
                table: 'db_json',
                filter: 'snapshot_key=eq.main'
            };
            const settingsChange = {
                event: '*',
                schema: 'public',
                table: 'settings_config'
            };
            [snapshotChange, settingsChange].forEach(function (binding) {
                channel = channel.on('postgres_changes', binding, function (change) {
                    applySupabaseTableChange(binding.table, change);
                });
            });
            supabaseRealtimeChannel = channel.subscribe(function (status) {
                supabaseRealtimeActive = status === 'SUBSCRIBED';
                if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
                    console.warn('[Supabase] Realtime unavailable; using periodic refresh fallback:', status);
                }
            });
        } else if (!window.supabase || !window.supabase.createClient) {
            console.warn('[Supabase] Realtime client library is unavailable; using periodic refresh fallback.');
        }

        if (!supabaseSettingsPollTimer) {
            supabaseSettingsPollTimer = setInterval(refreshSupabaseDataFromCloud, 60000 + Math.floor(Math.random() * 15000));
        }
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) refreshSupabaseDataFromCloud();
        });
        window.addEventListener('focus', function() {
            refreshSupabaseDataFromCloud();
        });
    }
</script>
