    /**
     * Monthly Fee & Reminder calculation rule:
     * User Rule: If a student took admission on the 10th of October,
     * their next fee reminder is on the 11th of November (1 month + 1 day).
     * Subsequent monthly cycles advance by 1 month each.
     */
    function calculateNextFeeReminder(admissionDateStr, monthsCount) {
        if (!admissionDateStr) return '';
        if (monthsCount === undefined || monthsCount === null) monthsCount = 1;
        const parts = String(admissionDateStr).split('-');
        if (parts.length !== 3) return admissionDateStr;
        let year = parseInt(parts[0], 10);
        let month = parseInt(parts[1], 10); // 1-12
        let day = parseInt(parts[2], 10);

        let targetMonth = month + monthsCount;
        let targetYear = year + Math.floor((targetMonth - 1) / 12);
        targetMonth = ((targetMonth - 1) % 12) + 1;

        let targetDay = day + 1;
        const daysInMonth = new Date(targetYear, targetMonth, 0).getDate();
        if (targetDay > daysInMonth) {
            targetDay = daysInMonth;
        }

        const yStr = String(targetYear);
        const mStr = String(targetMonth).padStart(2, '0');
        const dStr = String(targetDay).padStart(2, '0');
        return `${yStr}-${mStr}-${dStr}`;
    }

    function formatFeeDateDisplay(dateStr) {
        if (!dateStr || dateStr === 'Paid' || dateStr === 'Fully Paid') return dateStr || '-';
        const parts = String(dateStr).split('-');
        if (parts.length !== 3) return dateStr;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const d = parseInt(parts[2], 10);
        const m = parseInt(parts[1], 10) - 1;
        const y = parts[0];
        return `${d} ${months[m] || ''} ${y}`;
    }

    function updateNewStudentReminderPreview(admissionDateVal) {
        const previewEl = document.getElementById('new-stu-reminder-preview');
        if (!previewEl) return;
        const nextDate = calculateNextFeeReminder(admissionDateVal, 1);
        previewEl.textContent = formatFeeDateDisplay(nextDate);
    }

        if (dueEl) {

        }
    }

    function isDummyForSheetEnabled(settings, sheetKey) {
        if (!settings) return true;
        if (settings.showDummyData === false) return false;
        if (settings.dummyDataConfig && typeof settings.dummyDataConfig === 'object') {
            if (settings.dummyDataConfig[sheetKey] === false) return false;
        }
        return true;
    }

    function stripDummyData(appData, targetTable) {
        if (!appData) return appData;
        var clone = JSON.parse(JSON.stringify(appData));
        var dummyStudentIds = {};
        (clone.students || []).forEach(function (s) {
            if (s && isDummyRecord(s)) dummyStudentIds[s.id] = true;
        });

        var tablesToStrip = targetTable ? [targetTable] : ['students', 'batches', 'materials', 'offlineTests', 'teachers', 'gallery', 'feedbacks'];
        tablesToStrip.forEach(function (tbl) {
            if (!isDummyForSheetEnabled(clone.settings, tbl) || targetTable) {
                clone[tbl] = (clone[tbl] || []).filter(function (r) { return !isDummyRecord(r); });
            }
        });

        if (!isDummyForSheetEnabled(clone.settings, 'students') || targetTable === 'students') {
            (clone.batches || []).forEach(function (b) {
                if (Array.isArray(b.studentIds)) {
                    b.studentIds = b.studentIds.filter(function (id) { return !dummyStudentIds[id]; });
                }
            });
            (clone.offlineTests || []).forEach(function (t) {
                if (t && t.marks && typeof t.marks === 'object') {
                    Object.keys(dummyStudentIds).forEach(function (sid) { delete t.marks[sid]; });
                }
            });
        }
        return clone;
    }

        if (state.currentRole !== 'developer') {

            return;
        }
        if (!state.settings) state.settings = {};
        if (!state.settings.dummyDataConfig || typeof state.settings.dummyDataConfig !== 'object') {
            state.settings.dummyDataConfig = {
                students: true, teachers: true, batches: true,
                offlineTests: true, materials: true, gallery: true, feedbacks: true
            };
        }
        const currentStatus = state.settings.dummyDataConfig[sheetKey] !== false;
        const willEnable = (enable !== undefined) ? !!enable : !currentStatus;
        state.settings.dummyDataConfig[sheetKey] = willEnable;

        const anyOn = Object.keys(state.settings.dummyDataConfig).some(function (k) {
            return state.settings.dummyDataConfig[k] === true;
        });
        state.settings.showDummyData = anyOn;

        const seed = getDummySeedData();
        if (willEnable) {
            if (!Array.isArray(state[sheetKey])) state[sheetKey] = [];
            const have = {};
            state[sheetKey].forEach(function (r) { if (r && r.id) have[r.id] = true; });
            (seed[sheetKey] || []).forEach(function (r) {
                if (r && r.id && !have[r.id]) state[sheetKey].push(r);
            });
            showToast('Demo data for ' + sheetKey + ' CREATED & synced to Databases!', 'success');
        } else {
            state[sheetKey] = (state[sheetKey] || []).filter(function (r) { return !isDummyRecord(r); });
            if (sheetKey === 'students') {
                const dummyStudentIds = {};
                (seed.students || []).forEach(function (s) { dummyStudentIds[s.id] = true; });
                (state.batches || []).forEach(function (b) {
                    if (Array.isArray(b.studentIds)) {
                        b.studentIds = b.studentIds.filter(function (id) { return !dummyStudentIds[id]; });
                    }
                });
                (state.offlineTests || []).forEach(function (t) {
                    if (t && t.marks && typeof t.marks === 'object') {
                        Object.keys(dummyStudentIds).forEach(function (sid) { delete t.marks[sid]; });
                    }

    function isPlaceholderDriveUrl(url) {
        if (!url) return true;
        const s = String(url).trim().toLowerCase();
        if (s === 'https://drive.google.com/' || s === 'https://drive.google.com' || s === 'http://drive.google.com/') return true;
        if (s.startsWith('https://drive.google.com') && !s.includes('/file/d/') && !s.includes('id=') && !s.includes('/folders/')) return true;
        return false;
    }

    function base64ToBlob(base64OrDataUrl, contentType) {
        contentType = contentType || 'application/pdf';
        let b64 = base64OrDataUrl;
        if (base64OrDataUrl.indexOf(';base64,') !== -1) {
            const parts = base64OrDataUrl.split(';base64,');
            contentType = parts[0].replace('data:', '') || contentType;
            b64 = parts[1];
        }
        const binary = atob(b64);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new Blob([bytes], { type: contentType });
    }

            if (token) {
                const sessionData = JSON.stringify({
                    token: token,
                    expiresAt: expiresAt
                });
                if (rememberMe) {
                    localStorage.setItem('Divine_Classes_AUTH_SESSION', sessionData);
                    sessionStorage.removeItem('Divine_Classes_AUTH_SESSION');
                } else {
                    sessionStorage.setItem('Divine_Classes_AUTH_SESSION', sessionData);
                    localStorage.removeItem('Divine_Classes_AUTH_SESSION');
                }
            }
            localStorage.removeItem('Divine_Classes_SAVED_CREDS');
        } catch (e) {
            console.warn('Could not save auth session', e);
        }
    }

    function loadAuthSession() {
        try {
            const storageKeys = [
                [sessionStorage, 'Divine_Classes_AUTH_SESSION'],
                [localStorage, 'Divine_Classes_AUTH_SESSION']
            ];
            for (const [storage, key] of storageKeys) {
                const saved = storage.getItem(key);
                if (!saved) continue;
                try {
                    const session = JSON.parse(saved);
                    if (session && session.token && session.expiresAt && Date.now() < session.expiresAt) {
                        return session.token;
                    }
                } catch (e) {
                    console.warn('Could not parse saved auth session', e);
                }
                storage.removeItem(key);
            }
            return '';
        } catch (e) {
            console.warn('Could not load auth session', e);
            return '';
        }
    }

    function formatPhotoUrl(url, fallbackSeed, role) {
        if (url && typeof url === 'string') {
            const trimmed = url.trim();
            if (trimmed) {
                if (trimmed.startsWith('data:') || trimmed.startsWith('blob:')) return trimmed;

                let fileId = '';
                let m = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (m) fileId = m[1];
                if (!fileId) {
                    m = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                    if (m) fileId = m[1];
                }
                if (!fileId) {
                    m = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (m) fileId = m[1];
                }
                if (fileId) {
                    return `https://lh3.googleusercontent.com/d/${fileId}`;
                }
                return trimmed;
            }
        }
        return getRandomAvatarUrl(fallbackSeed, role);
    }

    function getInlineAvatarSvg(name, role) {
        const cleanName = (name || 'User').toString().trim();
        const initials = cleanName.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'U';
        const bgColors = [
            ['#4f46e5', '#7c3aed'],
            ['#0284c7', '#2563eb'],
            ['#059669', '#10b981'],
            ['#d97706', '#f59e0b'],
            ['#e11d48', '#f43f5e'],
            ['#7c2d12', '#ea580c'],
            ['#0891b2', '#06b6d4'],
            ['#6366f1', '#4f46e5']
        ];
        let hash = 0;
        for (let i = 0; i < cleanName.length; i++) hash = (hash << 5) - hash + cleanName.charCodeAt(i);
        const pair = bgColors[Math.abs(hash) % bgColors.length];
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><defs><linearGradient id="g_${Math.abs(hash)}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${pair[0]}" /><stop offset="100%" stop-color="${pair[1]}" /></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#g_${Math.abs(hash)})" /><text x="50" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${initials}</text></svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function mergeRemoteData(remoteData) {
        if (!remoteData || !remoteData.students) return;
        const notifMap = new Map();
        (state.notifications || []).forEach(function (n) { if (n && n.id) notifMap.set(n.id, n); });
        if (remoteData.notifications && Array.isArray(remoteData.notifications)) {
            remoteData.notifications.forEach(function (n) {
                if (n && n.id) {
                    const local = notifMap.get(n.id);
                    notifMap.set(n.id, local ? Object.assign({}, n, local) : n);
                }
            });
        }

        // Intelligently union remote students with any non-dummy local students
        // so real students enrolled on this device are NEVER wiped out by a remote fetch!
        const remoteStudents = Array.isArray(remoteData.students) ? remoteData.students : [];
        const remoteRollSet = new Set(remoteStudents.map(function (s) {
            return String((s && s.roll) || (s && s.id) || '').trim().toUpperCase();
        }));
        const localUnsyncedStudents = (state.students || []).filter(function (s) {
            if (!s || isDummyRecord(s)) return false;
            const r = String(s.roll || '').trim().toUpperCase();
            const id = String(s.id || '').trim().toUpperCase();
            return (!r || !remoteRollSet.has(r)) && (!id || !remoteRollSet.has(id));
        });
        const combinedStudents = remoteStudents.concat(localUnsyncedStudents);

        // Intelligently union faculty / teachers
        const remoteTeachers = Array.isArray(remoteData.teachers) ? remoteData.teachers : [];
        const remoteTeacherSet = new Set(remoteTeachers.map(function (t) {
            return String((t && t.id) || (t && t.name) || '').trim().toUpperCase();
        }));
        const localUnsyncedTeachers = (state.teachers || []).filter(function (t) {
            if (!t || isDummyRecord(t)) return false;
            const tid = String(t.id || '').trim().toUpperCase();
            const tname = String(t.name || '').trim().toUpperCase();
            return (!tid || !remoteTeacherSet.has(tid)) && (!tname || !remoteTeacherSet.has(tname));
        });
        const combinedTeachers = remoteTeachers.concat(localUnsyncedTeachers);

        // Intelligently union batches so student IDs in batches are preserved
        let mergedBatches = remoteData.batches;
        if (Array.isArray(state.batches) && Array.isArray(remoteData.batches)) {
            mergedBatches = remoteData.batches.map(function (rb) {
                const localB = state.batches.find(function (b) { return b.id === rb.id; });
                if (!localB || !Array.isArray(localB.studentIds)) return rb;
                const idSet = new Set(rb.studentIds || []);
                localB.studentIds.forEach(function (id) { idSet.add(id); });
                const updatedB = Object.assign({}, rb);
                updatedB.studentIds = Array.from(idSet);
                return updatedB;
            });
        }

        state = Object.assign(state, remoteData);
        state.students = combinedStudents;
        state.teachers = combinedTeachers;
        if (mergedBatches) state.batches = mergedBatches;

        // USER RULE: If developer disabled demo data, never allow remote dummy records to enter state
        if (state.settings && (state.settings.showDummyData === false || state.settings.demoDataPermanentlyDisabled === true)) {
            state.settings.showDummyData = false;
            state.settings.demoDataPermanentlyDisabled = true;
            ['students', 'batches', 'materials', 'offlineTests', 'teachers', 'gallery', 'feedbacks'].forEach(function (tbl) {
                state[tbl] = (state[tbl] || []).filter(function (r) { return !isDummyRecord(r); });
            });
        }
        if (state.batches && state.batches.length > 0 && state.students && Array.isArray(state.students)) {
            const defaultBatch = state.batches[0];
            if (!defaultBatch.studentIds) defaultBatch.studentIds = [];
            const otherBatches = state.batches.slice(1);
            state.students.forEach(function (s) {
                if (s && s.status !== 'Inactive') {
                    const inOther = otherBatches.some(function (ob) { return isStudentInBatch(ob, s); });
                    if (!inOther && !isStudentInBatch(defaultBatch, s)) {
                        defaultBatch.studentIds.push(s.id);
                        defaultBatch.studentIds.push(s.roll);
                    }
                }
            });
        }
        if (state.students && Array.isArray(state.students)) {
            state.students.forEach(function (s) {
                if (!s.admissionDate) s.admissionDate = '2026-10-10';
                if (!s.monthlyFee) {
                    if (s.totalFee && s.totalFee > 10000) {
                        s.monthlyFee = Math.round(s.totalFee / 12);
                    } else {
                        s.monthlyFee = Number(s.totalFee) || 2500;
                    }
                }
                s.totalFee = s.monthlyFee;
                if (!s.dueDate || s.dueDate === 'Paid' || s.dueDate === 'Fully Paid') {
                    // keep
                } else if (!/^\d{4}-\d{2}-\d{2}$/.test(s.dueDate)) {
                    s.dueDate = calculateNextFeeReminder(s.admissionDate, 1);
                }
            });
        }
        state.notifications = Array.from(notifMap.values()).filter(function (n) {
            return n && typeof n.id === 'string' && (n.id.startsWith('notif_fee_') || n.id.startsWith('notif_mat_'));
        });
        saveStateLocally(true); // pass skipSync to avoid loop
        updateRoleUI();
        renderSidebar();
        updateNotificationBadge();
        updateSocialLinksUI();
        renderMainContent();
    }

    }

    function loadPortalData(token) {
        function applyData(remoteData) {
            if (!remoteData || !Array.isArray(remoteData.students)) {
                handleLoadError(new Error('The server returned an invalid portal response.'));
                return;
            }
            const session = remoteData.portalSession;
            if (session && token) {
                state.authToken = token;
                state.isAuthenticated = true;
                state.currentRole = session.role;
                state.isDeveloper = session.role === 'developer';
                state.currentUser = {
                    role: session.role,
                    id: session.userId,
                    name: session.name,
                    identifier: session.identifier
                };
                state.activeStudentId = session.role === 'student' ? session.userId : '';
                state.activeTeacherId = session.role === 'teacher' ? session.userId : '';
                lastPortalDataRefreshAt = Date.now();
                updateRoleUI();
                renderSidebar();
            } else {
                clearPortalState();
                if (token) {
                    localStorage.removeItem('Divine_Classes_AUTH_SESSION');
                    sessionStorage.removeItem('Divine_Classes_AUTH_SESSION');
                }
            }
            mergeRemoteData(remoteData);
        }

        function handleLoadError(err) {
            console.error('Could not load secure portal data:', err);
            clearPortalState();
            updateRoleUI();
            renderSidebar();
            renderMainContent();
            showToast('Could not securely load portal data. Please refresh and try again.', 'error');
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(applyData)
                .withFailureHandler(handleLoadError)
                .apiGetInitialData(token || '');
            return;
        }

        const url = GAS_WEBAPP_URL + '?action=getData&token=' + encodeURIComponent(token || '');
        fetch(url)
            .then(function (response) {
                if (!response.ok) throw new Error('Portal data request failed');
                return response.json();
            })
            .then(applyData)
            .catch(handleLoadError);
    }

        } catch (e) { }
        if (token && typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.apiLogoutPortalSession(token);
        } else if (token) {
            fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'logout', token: token })
            }).catch(function (err) { console.warn('Could not end server session:', err); });
        }
        renderAuthHeader();
        updateRoleUI();
        renderSidebar();
        renderMainContent();
        loadPortalData('');
        showToast('You have been logged out successfully.', 'info');
    }

    function toggleLoginPasswordVisibility(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const isVisible = el.type === 'password';
        el.type = isVisible ? 'text' : 'password';
        const button = document.getElementById(id + '-toggle');
        if (button) {
            button.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
            button.setAttribute('aria-pressed', String(isVisible));
            const icon = button.querySelector('i');
            if (icon) icon.className = `fa-solid ${isVisible ? 'fa-eye-slash' : 'fa-eye'} text-xs`;
        }
    }

        state.currentRole = newRole;

        // Requirements 2 & 11: Fees & Access Control = Admin/Developer only; Institute Settings = Developer only
        let onRestricted = false;
        if ((state.activeTab === 'fees' || state.activeTab === 'access') && newRole !== 'admin' && newRole !== 'developer') {
            onRestricted = true;
        }
        if (state.activeTab === 'settings' && newRole !== 'developer') {
            onRestricted = true;
        }
        if (onRestricted) {
            state.activeTab = 'dashboard';
            showToast('This section is restricted for the current role. Redirected to Dashboard.', 'warning');

        if (newRole === 'student') {
            const cur = getCurrentStudent();
            if (cur && cur.status === 'Blocked') {
                showAccessBlockedModal('student', cur.name, cur.roll);
            }
        }

        updateRoleUI();
        renderSidebar();
        renderMainContent();
    }

            showToast('Access denied: you cannot switch to another student profile.', 'error');
            return;
        }
        state.activeStudentId = studentId;
        const s = state.students.find(st => st.id === studentId);
        if (s && s.status === 'Blocked') {
            showAccessBlockedModal('student', s.name, s.roll);
        } else if (s) {
            showToast(`Now viewing portal as ${s.name} (${s.roll})`, 'info');
        }
        updateRoleUI();
        renderMainContent();

    function navigateTo(tabId) {
        if (tabId === 'fees' && state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Access Denied! Student fees are visible ONLY to Admin.', 'error');
            return;
        }
        if (tabId === 'access' && state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Access Denied! Access Control is restricted to Admin.', 'error');
            return;
        }
        if (tabId === 'settings' && state.currentRole !== 'developer') {
            showToast('Access Denied! Institute Settings are visible ONLY to the Developer role.', 'error');
            return;
        }
        state.activeTab = tabId;
        renderSidebar();
        renderMainContent();

        const sb = document.getElementById('sidebar');
        if (sb && !sb.classList.contains('-translate-x-full')) {
            toggleMobileSidebar();

    /********************************************************************
     * MAIN CONTENT ROUTER
     ********************************************************************/
    function renderMainContent() {
        const container = document.getElementById('main-content');
        const titleEl = document.getElementById('page-title');
        const subtitleEl = document.getElementById('page-subtitle');
        if (!container) return;

        if (!state.isAuthenticated) {

            container.innerHTML = renderLoginScreenView();
            return;
        }

        const titles = {
            dashboard: ['Institute Overview Dashboard', 'Divine Classes • Real-time stats, batches, results, and quick actions'],
            batches: ['Batch Creation & Student Roster', 'Requirement #1: Create batches and add or remove students seamlessly'],
            fees: ['Student Fees & Reminder Center', 'Requirement #2 & #5: Strictly Admin-only fee tracking & instant WhatsApp/SMS reminders'],
            materials: ['Batch Assignments, DPPs & Test Papers', 'Requirement #3: Upload and download PDF assignments, worksheets, and papers'],
            marks: ['Offline Class Test Marks Tracker', 'Requirement #4: Track and update student marks scored in offline tests & report cards'],
            teachers: ['Expert Faculty Profiles', 'Requirement #6: View teacher qualifications, subjects, and doubt-clearing timings'],
            gallery: ['Result Banners & Coaching Gallery', 'Requirement #8: Previous result banners and classroom achievements'],
            links: ['External Study Material Hub', 'Requirement #9: Curated study material links from trusted educational websites'],
            feedback: ['Parent & Student Feedback Portal', 'Requirement #10: Submit and review feedback from parents and students'],
            access: ['Access Control & Password Settings', 'Requirement #11: Manage student/faculty passwords and authorize app access synced with Database'],
            settings: ['Institute Settings Console', 'Developer Only: Full institute configuration, passwords, contact details, social links & Cloud Database access']
        };

        const [rawTitle, rawSubtitle] = titles[state.activeTab] || titles.dashboard;
        let title = rawTitle;
        let subtitle = rawSubtitle;
        // Client demo mode: strip "Requirement #N:" tags from page headers when OFF
        if (!isRequirementLabelsEnabled()) {
            subtitle = subtitle.replace(/^Requirement\s*[^:]*:\s*/i, '');
        }
        if (titleEl) titleEl.textContent = title;
        if (subtitleEl) subtitleEl.textContent = subtitle;

        function renderAccessDeniedView(sectionName, allowedRoles) {
            return `
                <div class="fade-in max-w-xl mx-auto my-10 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 text-center shadow-lg">
                    <div class="w-16 h-16 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 mx-auto flex items-center justify-center text-2xl mb-4 border border-amber-200 dark:border-amber-800">

                    <div class="mt-6 flex flex-wrap items-center justify-center gap-3">

                            <i class="fa-solid fa-house"></i> Return to Overview Dashboard
                        </button>
                    </div>

        switch (state.activeTab) {
            case 'dashboard':
                container.innerHTML = renderDashboardView();
                break;

                container.innerHTML = renderBatchesView();
                break;

                break;
            case 'access':
                container.innerHTML = (state.currentRole === 'admin' || state.currentRole === 'developer')
                    ? renderAccessView()
                    : renderAccessDeniedView('Access Control & User Permissions', 'Admin or Developer');
                break;
            case 'settings':
                container.innerHTML = (state.currentRole === 'developer')
                    ? renderSettingsView()
                    : renderAccessDeniedView('Institute Settings Console', 'Developer');
                break;
            case 'materials':
                container.innerHTML = renderMaterialsView();
                break;
            case 'marks':
                container.innerHTML = renderMarksView();
                break;
            case 'teachers':
                container.innerHTML = renderTeachersView();
                break;
            case 'gallery':
                container.innerHTML = renderGalleryView();
                break;
            case 'links':
                container.innerHTML = renderLinksView();
                break;
            case 'feedback':
                container.innerHTML = renderFeedbackView();
                break;
            default:
                container.innerHTML = renderDashboardView();
                break;
        }
    }

    /********************************************************************
     * VIEW: OVERVIEW DASHBOARD
     ********************************************************************/
    function renderDashboardView() {
        const activeStudents = state.students.filter(s => s.status !== 'Inactive');
        const totalStudents = activeStudents.length;
        const totalBatches = state.batches.length;

    /********************************************************************
     * REQUIREMENT 1: BATCH CREATION, ADD & REMOVE STUDENTS
     ********************************************************************/
    function isStudentInBatch(batch, stu) {
        if (!batch || !stu) return false;
        const ids = batch.studentIds || [];
        const sId = String(stu.id || '').trim().toLowerCase();
        const sRoll = String(stu.roll || '').trim().toLowerCase();
        const sNum = String(stu.roll || '').replace(/\D/g, '');
        return ids.some(function (id) {
            const clean = String(id || '').trim().toLowerCase();
            if (clean === sId || clean === sRoll) return true;
            if (sNum && clean.replace(/\D/g, '') === sNum) return true;
            return false;
        });
    }

    function getCurrentStudent() {
        if (state.currentRole !== 'student') return null;
        const studentId = state.currentUser && state.currentUser.role === 'student'
            ? state.currentUser.id
            : state.activeStudentId;
        if (!studentId) return null;
        return (state.students || []).find(function (student) {
            return student && student.id === studentId && student.status !== 'Inactive' && student.status !== 'Blocked';
        }) || null;
    }

    function canViewStudentProfile(studentId) {
        if (!state.isAuthenticated || !studentId) return false;
        if (state.currentRole === 'admin' || state.currentRole === 'developer') return true;
        const currentStudent = getCurrentStudent();
        return state.currentRole === 'student' && currentStudent && currentStudent.id === studentId;
    }

    function getBatchStudents(batch) {
        if (state.currentRole === 'student') {
            const currentStudent = getCurrentStudent();
            if (!currentStudent) return [];
            if (!batch || isStudentInBatch(batch, currentStudent)) return [currentStudent];
            return [];
        }
        if (!batch) return (state.students || []).filter(function (s) { return s && s.status !== 'Inactive'; });
        let list = (state.students || []).filter(function (s) { return s && s.status !== 'Inactive' && isStudentInBatch(batch, s); });
        // If this is the primary batch (state.batches[0]), also include any active student not in any other batch
        // so no student from Google Sheets or enrollment is ever hidden!
        if (state.batches && state.batches.length > 0 && batch.id === state.batches[0].id) {
            const otherBatches = state.batches.slice(1);
            (state.students || []).forEach(function (s) {
                if (s && s.status !== 'Inactive') {
                    const inOther = otherBatches.some(function (ob) { return isStudentInBatch(ob, s); });
                    if (!inOther && !list.some(function (item) { return item.roll === s.roll || item.id === s.id; })) {
                        list.push(s);
                    }
                }
            });
        }
        return list;
    }

    function handleAddExistingStudent(e, batchId) {
        e.preventDefault();
        const stuId = document.getElementById('existing-student-id').value;
        const batch = state.batches.find(b => b.id === batchId);
        const stu = (state.students || []).find(s => s && (s.id === stuId || s.roll === stuId));
        if (batch && stu) {
            if (!batch.studentIds) batch.studentIds = [];
            if (!batch.studentIds.includes(stu.id)) batch.studentIds.push(stu.id);
            if (!batch.studentIds.includes(stu.roll)) batch.studentIds.push(stu.roll);
            saveStateLocally();
        }
        closeModal();
        renderMainContent();
        showToast(`${stu ? stu.name : 'Student'} added to ${batch ? batch.name : 'Batch'}`, 'success');
    }

            function handleAddNewStudentToBatch(e, batchId) {
        e.preventDefault();
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const name = (document.getElementById('new-stu-name').value || '').trim();
        const parentName = (document.getElementById('new-stu-parent').value || '').trim();
        const phone = (document.getElementById('new-stu-phone').value || '').trim();
        const admissionDate = document.getElementById('new-stu-admdate').value || new Date().toISOString().split('T')[0];
        const monthlyFee = parseInt(document.getElementById('new-stu-monthlyfee').value, 10) || 2500;
        const initialPaid = monthlyFee; // Admitted with first month deposit
        const nextDueDate = calculateNextFeeReminder(admissionDate, 1);

        if (!name) {
            showToast('Please enter student name', 'error');
            return;
        }

        const batch = (state.batches || []).find(b => b.id === batchId) || (state.batches && state.batches[0]);

        // If this student is already in THIS batch, inform user and close
        const alreadyInThisBatch = batch && (batch.studentIds || []).some(id => {
            const s = (state.students || []).find(st => st && (st.id === id || st.roll === id));
            return s && s.name && s.name.trim().toLowerCase() === name.toLowerCase();
        });
        if (alreadyInThisBatch) {
            showToast(`Student "${name}" is already enrolled in ${batch.name}!`, 'info');
            closeModal();
            return;
        }

        // If student with same name exists in institute directory but not in this batch, link them!
        const existingInDir = (state.students || []).find(s => s && s.name && s.name.trim().toLowerCase() === name.toLowerCase());
        if (existingInDir) {
            if (batch) {
                if (!batch.studentIds) batch.studentIds = [];
                if (!batch.studentIds.includes(existingInDir.id)) batch.studentIds.push(existingInDir.id);
                if (!batch.studentIds.includes(existingInDir.roll)) batch.studentIds.push(existingInDir.roll);
            }
            saveStateLocally();
            closeModal();
            renderMainContent();
            showToast(`✓ Student ${name} (${existingInDir.roll}) enrolled in ${batch ? batch.name : 'Batch'}!`, 'success');
            return;
        }

        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Enrolling...';
        }

        // Find true maximum numeric roll number across all students to prevent roll collisions
        let maxRollNum = 100;
        (state.students || []).forEach(s => {
            const m = String((s && s.roll) || '').match(/\d+/);
            if (m) {
                const num = parseInt(m[0], 10);
                if (num > maxRollNum) maxRollNum = num;
            }
        });
        const nextRoll = 'DC-' + (maxRollNum + 1);
        const stuId = 'stu_' + (maxRollNum + 1);

        const newStu = {
            id: stuId,
            roll: nextRoll,
            name: name,
            parentName: parentName,
            phone: phone,
            admissionDate: admissionDate,
            monthlyFee: monthlyFee,
            totalFee: monthlyFee,
            paidFee: initialPaid,
            dueDate: nextDueDate,
            lastReminder: 'Never',
            photo: window.newStudentPhotoData || '',
            photoUrl: window.newStudentPhotoData || '',
            password: 'password123',
            status: 'Active'
        };
        window.newStudentPhotoData = '';

        state.students.push(newStu);
        if (batch) {
            if (!batch.studentIds) batch.studentIds = [];
            if (!batch.studentIds.includes(newStu.id)) batch.studentIds.push(newStu.id);
            if (!batch.studentIds.includes(newStu.roll)) batch.studentIds.push(newStu.roll);
        }

        saveStateLocally(true);
        closeModal();
        renderMainContent();
        showToast(`✓ New student ${name} (${newStu.roll}) registered & added to ${batch ? batch.name : 'Batch'}!`, 'success');

        function onAppendSuccess(res) {
            window.isEnrollingStudent = false;
            if (res && res.success) {
                if (res.student) {
                    const idx = state.students.findIndex(s => (s && s.roll === res.student.roll) || (s && s.id === newStu.id) || (s && s.roll === newStu.roll));
                    if (idx !== -1) {
                        state.students[idx] = Object.assign({}, state.students[idx], res.student);
                    } else {
                        state.students.push(res.student);
                    }
                }
                if (res.batches && Array.isArray(res.batches) && res.batches.length > 0) {
                    res.batches.forEach(rb => {
                        const localB = state.batches.find(b => b.id === rb.id);
                        if (localB && Array.isArray(rb.studentIds)) {
                            rb.studentIds.forEach(id => {
                                if (!localB.studentIds.includes(id)) localB.studentIds.push(id);
                            });
                        }
                    });
                }
                saveStateLocally(true);
                renderMainContent();
                showToast(`✓ ${name} (${(res.student && res.student.roll) || newStu.roll}) synced to Database!`, 'success');
                updateSyncBadge('✓ Database Synced', 'success');
            }
        }

        function onAppendError(err) {
            window.isEnrollingStudent = false;
            console.warn('Database append notice:', err);
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(onAppendSuccess)
                .withFailureHandler(onAppendError)
                .apiAppendStudent(newStu, batchId);
        } else {
            fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'appendStudent', studentData: newStu, batchId: batchId })
            })
                .then(function (res) { return res.json(); })
                .then(onAppendSuccess)
                .catch(onAppendError);
        }
    }

    function confirmRemoveStudent(studentId, batchId) {

        const stu = state.students.find(s => s && (s.id === studentId || s.roll === studentId));
        if (!stu) return;
        const batch = batchId ? state.batches.find(b => b.id === batchId) : null;

        const modalHtml = `

    function executeRemoveStudent(studentId) {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Only Admin can remove students.', 'error');
            return;
        }
        const stu = state.students.find(s => s.id === studentId);
        if (!stu) return;
        stu.status = 'Inactive';

        // Remove from all batch enrollment lists
        (state.batches || []).forEach(b => {
            b.studentIds = (b.studentIds || []).filter(id => id !== studentId);
        });

        // If activeStudentId was this student, fall back to an active student
        if (state.activeStudentId === studentId) {
            const fallback = state.students.find(s => s.status !== 'Inactive');
            if (fallback) state.activeStudentId = fallback.id;
        }

        saveStateLocally();
        closeModal();
        renderMainContent();
        updateRoleUI();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function () {
                    showToast(`Student ${stu.name} (${stu.roll}) marked Inactive in Database!`, 'warning');
                })
                .apiUpdateStudentProfile(studentId, { status: 'Inactive', batchId: '' }, state.authToken);
        } else {
            showToast(`Student ${stu.name} (${stu.roll}) marked Inactive and removed from app!`, 'warning');
        }
    }

    function executeRemoveFromBatch(batchId, studentId) {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Only Admin can remove students from batches.', 'error');
            return;
        }
        const batch = state.batches.find(b => b.id === batchId);
        const stu = state.students.find(s => s && (s.id === studentId || s.roll === studentId));
        if (batch) {
            const sid = stu ? stu.id : studentId;
            const sroll = stu ? stu.roll : null;
            batch.studentIds = (batch.studentIds || []).filter(id => id !== sid && id !== sroll && id !== studentId);
        }
        saveStateLocally();
        closeModal();
        renderMainContent();
        showToast(`Removed ${stu ? stu.name : 'Student'} from ${batch ? batch.name : 'Batch'}`, 'info');
    }

    function processImageUpload(file, maxWidth = 260, maxHeight = 260, quality = 0.82) {
        return new Promise((resolve, reject) => {
            if (!file) return reject('No file selected');
            if (!file.type || !file.type.startsWith('image/')) return reject('Please select a valid image file');
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let w = img.width;
                    let h = img.height;
                    if (w > h) {
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                    } else {
                        if (h > maxHeight) {
                            w = Math.round((w * maxHeight) / h);
                            h = maxHeight;
                        }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    resolve(dataUrl);
                };
                img.onerror = () => reject('Could not decode image');
                img.src = e.target.result;
            };
            reader.onerror = () => reject('Could not read image file');
            reader.readAsDataURL(file);
        });
    }

    async function handleStudentPhotoUploadDirect(event, studentId) {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Access denied: only administrators can update student photos.', 'error');
            return;
        }
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        event.target.value = '';
        const stu = state.students.find(s => s.id === studentId);
        if (!stu) return;

        try {
            showToast(`Uploading photo for ${stu.name}...`, 'info');
            const photoDataUrl = await processImageUpload(file);
            await saveStudentPhotoToProfile(studentId, photoDataUrl);
        } catch (err) {
            console.error('Student photo upload error:', err);
            showToast('Failed to upload photo: ' + (err.message || err), 'error');
        }
    }

    function updateStudentPhotoOnServer(studentId, photoDataUrl) {
        return new Promise(function (resolve, reject) {
            const onResult = function (result) {
                if (!result || typeof result !== 'object') {
                    reject(new Error('The server returned an invalid photo upload response.'));
                    return;
                }
                resolve(result);
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(onResult)
                    .withFailureHandler(function (err) {
                        reject(new Error(err && err.message ? err.message : 'Google Drive photo upload failed.'));
                    })
                    .apiUpdateStudentPhoto(studentId, photoDataUrl, state.authToken);
                return;
            }
            fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'updateStudentPhoto',
                    studentId: studentId,
                    photoDataUrl: photoDataUrl,
                    token: state.authToken
                })
            })
                .then(function (response) {
                    if (!response.ok) throw new Error('Photo upload request failed.');
                    return response.json();
                })
                .then(onResult)
                .catch(reject);
        });
    }

    async function saveStudentPhotoToProfile(studentId, photoDataUrl) {
        const stu = state.students.find(function (student) { return student.id === studentId; });
        if (!stu) throw new Error('Student not found.');
        const result = await updateStudentPhotoOnServer(studentId, photoDataUrl);
        if (result.photoUrl && (result.success || result.profileSaved)) {
            stu.photo = result.photoUrl;
            stu.photoUrl = result.photoUrl;
            saveStateLocally(true);
            renderMainContent();
            updateRoleUI();
            closeModal();
            openStudentIdCard(studentId);
        }
        if (!result.success) {
            throw new Error(result.message || 'The photo could not be saved to Google Drive and the student sheet.');
        }
        showToast(`Photo for ${stu.name} uploaded to Drive and saved in the student profile and Google Sheet.`, 'success');
    }

    let activeStudentCameraStream = null;
    let activeCameraStudentId = '';

    function stopStudentPhotoCamera() {
        if (activeStudentCameraStream) {
            activeStudentCameraStream.getTracks().forEach(function (track) { track.stop(); });
            activeStudentCameraStream = null;
        }
        activeCameraStudentId = '';
    }

    async function openStudentPhotoCamera(studentId) {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Access denied: only administrators can use the live camera.', 'error');
            return;
        }
        const stu = state.students.find(function (student) { return student.id === studentId; });
        if (!stu) {
            showToast('Student not found.', 'error');
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast('Live camera is unavailable in this browser. Use Upload Photo instead.', 'error');
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: 'user' }
            });
            activeStudentCameraStream = stream;
            activeCameraStudentId = studentId;
            openModal(`
                <div class="space-y-4">
                    <div class="text-center">
                        <h3 class="text-base font-bold text-slate-900">Capture ${escapeHtml(stu.name)}'s Photo</h3>
                        <p class="mt-1 text-xs text-slate-500">Center the student's face, then tap Capture Photo.</p>
                    </div>
                    <video id="student-photo-camera-preview" autoplay playsinline class="w-full max-h-[60vh] rounded-2xl bg-slate-950 object-contain"></video>
                    <div class="flex gap-3">
                        <button type="button" onclick="cancelStudentPhotoCamera()" class="flex-1 rounded-xl bg-slate-100 px-4 py-2.5 text-xs font-semibold text-slate-700">Cancel</button>
                        <button type="button" onclick="captureStudentPhoto()" class="flex-1 rounded-xl bg-indigo-600 px-4 py-2.5 text-xs font-bold text-white"><i class="fa-solid fa-camera mr-1"></i> Capture Photo</button>
                    </div>
                </div>
            `);
            const preview = document.getElementById('student-photo-camera-preview');
            if (!preview) throw new Error('Camera preview could not be opened.');
            preview.srcObject = stream;
            await preview.play();
        } catch (err) {
            const cameraDialogWasOpened = !!activeStudentCameraStream;
            stopStudentPhotoCamera();
            if (cameraDialogWasOpened) {
                closeModal();
                openStudentIdCard(studentId);
            }
            console.error('Could not start student camera:', err);
            const message = err && err.name === 'NotAllowedError'
                ? 'Camera permission was denied. Allow camera access in browser settings and try again.'
                : 'Could not start the camera: ' + (err.message || err);
            showToast(message, 'error');
        }
    }

    function cancelStudentPhotoCamera() {
        const studentId = activeCameraStudentId;
        stopStudentPhotoCamera();
        closeModal();
        if (studentId) openStudentIdCard(studentId);
    }

    async function captureStudentPhoto() {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            stopStudentPhotoCamera();
            closeModal();
            showToast('Access denied: only administrators can capture student photos.', 'error');
            return;
        }
        const studentId = activeCameraStudentId;
        const preview = document.getElementById('student-photo-camera-preview');
        if (!studentId || !preview || !preview.videoWidth || !preview.videoHeight) {
            showToast('Camera is not ready yet. Please wait a moment and try again.', 'error');
            return;
        }
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 260 / Math.max(preview.videoWidth, preview.videoHeight));
        canvas.width = Math.max(1, Math.round(preview.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(preview.videoHeight * scale));
        const context = canvas.getContext('2d');
        if (!context) {
            showToast('Could not capture the camera image.', 'error');
            return;
        }
        context.drawImage(preview, 0, 0, canvas.width, canvas.height);
        const photoDataUrl = canvas.toDataURL('image/jpeg', 0.82);
        stopStudentPhotoCamera();
        closeModal();
        try {
            const stu = state.students.find(function (student) { return student.id === studentId; });
            showToast(`Uploading photo for ${stu ? stu.name : 'student'}...`, 'info');
            await saveStudentPhotoToProfile(studentId, photoDataUrl);
        } catch (err) {
            console.error('Student camera capture upload error:', err);
            openStudentIdCard(studentId);
            showToast('Photo was captured but could not be saved: ' + (err.message || err), 'error');
        }
    }

    function handleSaveEditStudent(e, studentId) {
        e.preventDefault();
        const stu = state.students.find(s => s.id === studentId);
        if (!stu) return;

        const name = document.getElementById('edit-stu-name').value.trim();
        const roll = document.getElementById('edit-stu-roll').value.trim();
        const phone = document.getElementById('edit-stu-phone').value.trim();
        const parentName = document.getElementById('edit-stu-parent').value.trim();
        const batchId = document.getElementById('edit-stu-batch').value;
        const status = document.getElementById('edit-stu-status').value;
        const admissionDate = document.getElementById('edit-stu-admdate').value.trim() || '2026-10-10';
        const monthlyFee = parseInt(document.getElementById('edit-stu-monthlyfee').value, 10) || 0;
        const paidFee = parseInt(document.getElementById('edit-stu-paidfee').value, 10) || 0;
        const dueDate = document.getElementById('edit-stu-duedate').value.trim();
        const password = document.getElementById('edit-stu-pwd').value.trim();
        const photoVal = document.getElementById('edit-stu-photo-val');
        const photo = photoVal ? photoVal.value : (stu.photo || '');
        const previousPhoto = stu.photo || stu.photoUrl || '';

        stu.name = name;
        stu.roll = roll;
        stu.phone = phone;
        stu.parentName = parentName;
        stu.status = status;
        stu.admissionDate = admissionDate;
        stu.monthlyFee = monthlyFee;
        stu.totalFee = monthlyFee;
        stu.paidFee = paidFee;
        stu.dueDate = dueDate || stu.dueDate;
        stu.password = password || 'password123';
        stu.photo = photo;

        // Batch assignment
        (state.batches || []).forEach(b => {
            b.studentIds = (b.studentIds || []).filter(id => id !== studentId);
            if (b.id === batchId && status !== 'Inactive') {
                b.studentIds.push(studentId);
            }
        });

        saveStateLocally(true);
        closeModal();
        renderMainContent();
        updateRoleUI();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function (result) {
                    if (!result || !result.success) {
                        stu.photo = previousPhoto;
                        stu.photoUrl = previousPhoto;
                        saveStateLocally(true);
                        renderMainContent();
                        showToast((result && result.message) || 'Student changes could not be saved.', 'error');
                        return;
                    }
                    if (result.photoUrl !== undefined) {
                        stu.photo = result.photoUrl;
                        stu.photoUrl = result.photoUrl;
                    }
                    saveStateLocally(true);
                    renderMainContent();
                    showToast(`Student ${name} (${roll}) updated in Database!`, 'success');
                })
                .withFailureHandler(function (err) {
                    stu.photo = previousPhoto;
                    stu.photoUrl = previousPhoto;
                    saveStateLocally(true);
                    renderMainContent();
                    console.error('Student profile save failed:', err);
                    showToast('Student changes could not be saved: ' + (err && err.message ? err.message : err), 'error');
                })
                .apiUpdateStudentProfile(studentId, {
                    name, roll, phone, parentName, batchId, status, admissionDate, monthlyFee, totalFee: monthlyFee, paidFee, dueDate, password, photo
                }, state.authToken);
        } else {
            showToast(`Student ${name} updated successfully!`, 'success');
        }
    }

    function renderFeesView() {
        const activeStudents = (state.students || []).filter(s => s.status !== 'Inactive');
        activeStudents.forEach(s => {
            if (!s.monthlyFee || s.monthlyFee > 10000) {
                if (s.totalFee && s.totalFee > 10000) {
                    s.monthlyFee = Math.round(s.totalFee / 12);
                } else {
                    s.monthlyFee = Number(s.totalFee) || 2500;
                }
            }
            s.totalFee = s.monthlyFee;
            if (s.paidFee > s.monthlyFee) {
                s.paidFee = s.monthlyFee;
            }
            if (!s.dueDate || s.dueDate === 'Paid' || s.dueDate === 'Fully Paid') {
                // keep
            } else if (!/^\d{4}-\d{2}-\d{2}$/.test(s.dueDate)) {
                s.dueDate = calculateNextFeeReminder(s.admissionDate, 1);
            }
        });
        const totalExpected = activeStudents.reduce((sum, s) => sum + (s.monthlyFee || s.totalFee), 0);
        const totalCollected = activeStudents.reduce((sum, s) => sum + s.paidFee, 0);
        const totalPending = activeStudents.reduce((sum, s) => sum + Math.max(0, (s.monthlyFee || s.totalFee) - s.paidFee), 0);
        const pendingCount = activeStudents.filter(s => s.paidFee < (s.monthlyFee || s.totalFee)).length;
        const collectionRate = totalExpected > 0 ? Math.round((totalCollected / (totalCollected + totalPending)) * 100) : 0;

    function addFeeReminderNotification(studentId, channel = 'App Notification') {
        const stu = state.students.find(s => s.id === studentId);
        if (!stu) return;
        const monthly = stu.monthlyFee || stu.totalFee || 2500;
        const balance = Math.max(0, monthly - stu.paidFee);
        if (balance <= 0) return;

        if (!state.notifications) state.notifications = [];

        // Remove any older unread fee reminder for this specific student to avoid duplicates
        state.notifications = state.notifications.filter(n => !(n.targetStudentId === stu.id && n.actionTab === 'fees' && !n.read));

        const newNotif = {
            id: 'notif_fee_' + stu.id + '_' + Date.now(),
            title: `Monthly Fee Reminder: ₹${balance.toLocaleString('en-IN')}`,
            message: `Dear ${stu.name} (${stu.roll}), your monthly tuition fee due is ₹${balance.toLocaleString('en-IN')} (Next Reminder Due Date: ${formatFeeDateDisplay(stu.dueDate)}). Sent via ${channel}. Please deposit via UPI: ${state.settings.upiId || 'divineclasses@upi'}.`,
            time: 'Just now',
            timestamp: Date.now(),
            read: false,
            adminSeen: false,
            type: 'warning',
            icon: 'fa-bell',
            iconColor: 'text-amber-500',
            bgColor: 'bg-amber-100 dark:bg-amber-950/40',
            actionTab: 'fees',
            targetStudentId: stu.id,
            targetRoll: stu.roll,
            targetRole: 'student',
            studentName: stu.name,
            feeBalance: balance
        };

        state.notifications.unshift(newNotif);
        saveStateLocally();
        updateNotificationBadge();
    }

    function sendWhatsAppFeeReminder(studentId) {
        const stu = state.students.find(s => s.id === studentId);
        if (!stu) return;
        const balance = stu.totalFee - stu.paidFee;
        stu.lastReminder = 'Just now (WhatsApp)';
        addFeeReminderNotification(studentId, 'WhatsApp & Notification');
        saveStateLocally();
        renderMainContent();

        // Construct sanitized phone number
        const cleanPhone = (stu.phone || '').replace(/[^0-9]/g, '');
        const phoneParam = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;

        const monthly = stu.monthlyFee || stu.totalFee || 2500;
        const text = encodeURIComponent(
            `Dear ${stu.parentName},\nGreetings from *Divine Classes*.\nThis is a gentle reminder regarding ${stu.name}'s (Roll: ${stu.roll}) monthly tuition fee of *₹${monthly.toLocaleString('en-IN')}*.\nAdmission Date: ${formatFeeDateDisplay(stu.admissionDate || '2026-10-10')}\nNext Fee Due Date / Reminder: ${formatFeeDateDisplay(stu.dueDate)}\nPending Amount: *₹${balance.toLocaleString('en-IN')}*\nKindly deposit the monthly fee via UPI (${state.settings.upiId || 'divineclasses@upi'}) at your earliest convenience to ensure uninterrupted class materials & test series.\nThank you,\nAdministration, Divine Classes`
        );

        const waUrl = `https://wa.me/${phoneParam}?text=${text}`;
        window.open(waUrl, '_blank');
        showToast(`WhatsApp reminder opened & added to Bell Icon for ${stu.parentName}!`, 'success');
    }

        saveStateLocally();
        renderMainContent();
        showToast(`Fee Reminder dispatched & added to Bell Icon for ${stu.name} (Roll: ${stu.roll})!`, 'success');
    }

    function sendBulkFeeReminders() {
        const pending = (state.students || []).filter(s => s.status !== 'Inactive' && s.paidFee < s.totalFee);
        if (pending.length === 0) {
            showToast('All students have paid their fees in full!', 'info');
            return;
        }
        pending.forEach(s => {
            s.lastReminder = 'Just now (Bulk)';
            addFeeReminderNotification(s.id, 'Bulk Notification & SMS');
        });
        saveStateLocally();
        renderMainContent();
        showToast(`Bulk Fee Reminders dispatched & added to Bell Icon for ${pending.length} students!`, 'success');
    }

    function handleRecordPayment(e, studentId) {
        e.preventDefault();
        const stu = state.students.find(s => s.id === studentId);
        const amount = parseInt(document.getElementById('pay-amount').value, 10) || 0;
        const mode = document.getElementById('pay-mode').value;
        const ref = document.getElementById('pay-ref').value.trim() || 'N/A';

        stu.paidFee += amount;
        const monthly = stu.monthlyFee || stu.totalFee || 2500;
        const monthsPaid = Math.max(1, Math.floor(stu.paidFee / monthly));
        stu.dueDate = calculateNextFeeReminder(stu.admissionDate || '2026-10-10', monthsPaid);

        saveStateLocally();
        closeModal();
        renderMainContent();
        showToast(`₹${amount.toLocaleString('en-IN')} fee deposit recorded for ${stu.name}! Next reminder: ${formatFeeDateDisplay(stu.dueDate)}`, 'success');
        printFeeReceipt(stu.id, amount, mode, ref);
    }

    function sendReceiptOnWhatsApp(studentId, receiptNo, totalFee, paidFee, dateStr) {
        const stu = state.students.find(s => s.id === studentId);
        if (!stu) return;
        const cleanPhone = (stu.phone || '').replace(/[^0-9]/g, '');
        const phoneWithCode = cleanPhone.length === 10 ? ('91' + cleanPhone) : cleanPhone;
        const monthly = Number(stu.monthlyFee || stu.totalFee || totalFee || 2500);
        const paid = Number(paidFee) || stu.paidFee || 0;
        const balance = Math.max(0, monthly - paid);
        const balanceText = balance <= 0 ? '₹0 (Current Month Paid ✅)' : `₹${balance.toLocaleString('en-IN')}`;

        const msg = [
            `🧾 *OFFICIAL MONTHLY TUITION FEE RECEIPT*`,
            `*Divine Classes* — Paschimpuri, New Delhi`,
            `────────────────────────────`,
            `*Receipt No:* ${receiptNo}`,
            `*Date:* ${dateStr}`,
            ``,
            `*Student Name:* ${stu.name} (${stu.roll})`,
            `*Admission Date:* ${formatFeeDateDisplay(stu.admissionDate || '2026-10-10')}`,
            `*Parent Name:* ${stu.parentName}`,
            `*Contact Phone:* ${stu.phone}`,
            ``,
            `*Monthly Tuition Fee:* ₹${monthly.toLocaleString('en-IN')}`,
            `*Total Deposited till Date:* ₹${paid.toLocaleString('en-IN')}`,
            `*Next Fee Reminder / Due Date:* ${formatFeeDateDisplay(stu.dueDate)}`,
            `*Balance Due:* ${balanceText}`,
            `*Payment Mode:* UPI / Cash (Verified)`,
            `*Verification:* Digitally Signed by Admin (${state.settings.adminName || 'Er. Rajesh Chahar'}) ✅`,
            `────────────────────────────`,
            `_Official computer generated receipt with digital admin verification._`,
            `_Helpline: ${state.settings.helplinePhone || '+91 95556 78753'}_`
        ].join('\n');

        stu.lastReminder = 'Receipt sent on WhatsApp (' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ')';
        saveStateLocally();

        const waUrl = `https://wa.me/${phoneWithCode}?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');
        showToast(`Official Fee Receipt dispatched to ${stu.name}'s WhatsApp (+${phoneWithCode})!`, 'success');
    }

    function exportFeesToCSV() {
        const headers = ['Roll No', 'Student Name', 'Admission Date', 'Parent Name', 'Contact Phone', 'Monthly Fee (INR)', 'Paid Fee (INR)', 'Pending Dues (INR)', 'Fee Payment Status', 'Next Fee Due Date', 'Last Reminder Sent'];
        const activeStudents = (state.students || []).filter(s => s.status !== 'Inactive');
        const rows = activeStudents.map(s => {
            const monthly = s.monthlyFee || s.totalFee || 2500;
            const paid = s.paidFee || 0;
            const balance = Math.max(0, monthly - paid);
            return [
                s.roll,
                `"${s.name}"`,
                `"${s.admissionDate || '2026-10-10'}"`,
                `"${s.parentName || 'Parent'}"`,
                `"${s.phone || ''}"`,
                monthly,
                paid,
                balance,
                `"${balance <= 0 ? 'Current Month Paid' : 'Payment Due'}"`,
                `"${balance <= 0 ? '-' : (s.dueDate || '')}"`,
                `"${s.lastReminder || 'Never'}"`
            ];
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `Divine_Classes_Fee_Report_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Fee Ledger exported to CSV successfully!', 'success');
    }

    function exportStudentIdCard(studentId, format) {
        if (!canViewStudentProfile(studentId)) {
            showToast('Access denied: you can only view your own student ID card.', 'error');
            return;
        }
        const cardEl = document.getElementById('student-id-card-render');
        if (!cardEl) {
            showToast('ID Card element not found!', 'error');
            return;
        }
        const stu = state.students.find(s => s.id === studentId);
        if (!stu || cardEl.dataset.studentId !== studentId) {
            showToast('The requested ID card is not currently open.', 'error');
            return;
        }
        if (format !== 'jpeg' && format !== 'pdf') {
            showToast('Unsupported ID card format.', 'error');
            return;
        }

        const isMobile = (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) ||
            /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const previewWindow = isMobile ? window.open('', '_blank') : null;
        if (previewWindow) {
            previewWindow.document.write('<!doctype html><title>Preparing ID card...</title><p style="font:16px sans-serif;padding:24px">Preparing your ID card preview...</p>');
            previewWindow.document.close();
        }
        showToast(`Preparing ID card ${format === 'pdf' ? 'PDF' : 'JPG'}...`, 'info');

        function encodeAscii(text) {
            const bytes = new Uint8Array(text.length);
            for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
            return bytes;
        }

        function joinBytes(chunks) {
            const length = chunks.reduce(function (total, chunk) { return total + chunk.length; }, 0);
            const result = new Uint8Array(length);
            let offset = 0;
            chunks.forEach(function (chunk) {
                result.set(chunk, offset);
                offset += chunk.length;
            });
            return result;
        }

        function makePdf(jpegBytes, imageWidth, imageHeight) {
            const pageWidth = 243;
            const pageHeight = Math.round(pageWidth * imageHeight / imageWidth * 100) / 100;
            const content = `q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Im0 Do\nQ`;
            const objects = [
                encodeAscii('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n'),
                encodeAscii('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n'),
                encodeAscii(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`),
                joinBytes([
                    encodeAscii(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imageWidth} /Height ${imageHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`),
                    jpegBytes,
                    encodeAscii('\nendstream\nendobj\n')
                ]),
                encodeAscii(`5 0 obj\n<< /Length ${encodeAscii(content).length} >>\nstream\n${content}\nendstream\nendobj\n`)
            ];
            const chunks = [encodeAscii('%PDF-1.4\n')];
            const offsets = [0];
            let fileLength = chunks[0].length;
            objects.forEach(function (objectBytes) {
                offsets.push(fileLength);
                chunks.push(objectBytes);
                fileLength += objectBytes.length;
            });
            const xrefOffset = fileLength;
            let xref = `xref\n0 ${offsets.length}\n0000000000 65535 f \n`;
            for (let i = 1; i < offsets.length; i++) {
                xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
            }
            xref += `trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
            chunks.push(encodeAscii(xref));
            return new Blob([joinBytes(chunks)], { type: 'application/pdf' });
        }

        function saveAndOpenFile(canvas) {
            const jpegUrl = canvas.toDataURL('image/jpeg', 0.95);
            const base64 = jpegUrl.slice(jpegUrl.indexOf(',') + 1);
            const binary = atob(base64);
            const jpegBytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) jpegBytes[i] = binary.charCodeAt(i);
            const fileBlob = format === 'pdf'
                ? makePdf(jpegBytes, canvas.width, canvas.height)
                : new Blob([jpegBytes], { type: 'image/jpeg' });
            const extension = format === 'pdf' ? 'pdf' : 'jpg';
            const fileName = 'Divine_Classes_ID_Card_' + (stu.roll || stu.id) + '.' + extension;
            const fileUrl = URL.createObjectURL(fileBlob);

            if (previewWindow && !previewWindow.closed) {
                previewWindow.location.replace(fileUrl);
            }
            const link = document.createElement('a');
            link.href = fileUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            if (isMobile && !previewWindow) {
                showToast('File downloaded. Allow pop-ups to open the mobile preview automatically.', 'info');
            }
            window.setTimeout(function () { URL.revokeObjectURL(fileUrl); }, 120000);
            showToast(`ID card ${extension.toUpperCase()} downloaded${isMobile ? ' and opened for preview' : ''}.`, 'success');
        }

        function doDownload() {
            html2canvas(cardEl, {
                scale: 3,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff'
            }).then(function (canvas) {
                saveAndOpenFile(canvas);
            }).catch(err => {
                console.error('ID card export error:', err);
                if (previewWindow && !previewWindow.closed) previewWindow.close();
                showToast('Could not export ID card: ' + err, 'error');
            });
        }

        if (typeof html2canvas === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = doDownload;
            script.onerror = function () {
                if (previewWindow && !previewWindow.closed) previewWindow.close();
                showToast('Could not load the ID card exporter. Please check your connection and try again.', 'error');
            };
            document.head.appendChild(script);
        } else {
            doDownload();
        }
    }

    function getMaterialFileMeta(mat) {
        const name = String(mat.fileName || '').toLowerCase();
        let ext = String(mat.fileType || '').toLowerCase();
        if (!ext && name.includes('.')) ext = name.split('.').pop();
        if (!ext) {
            const t = String(mat.title || '').toLowerCase();
            if (/\.pdf|\bpdf\b/.test(t)) ext = 'pdf';
            else if (/\.docx?|\bdocx?\b/.test(t)) ext = 'docx';
            else if (/\.xlsx?|excel|\bxls\b/.test(t)) ext = 'xlsx';
            else if (/\.pptx?|\bpptx?\b/.test(t)) ext = 'pptx';
        }
        if (ext === 'pdf') return { ext: 'PDF', icon: 'fa-file-pdf', color: 'text-red-600', kind: 'pdf' };
        if (ext === 'doc' || ext === 'docx') return { ext: 'Word', icon: 'fa-file-word', color: 'text-blue-600', kind: 'office' };
        if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return { ext: 'Excel', icon: 'fa-file-excel', color: 'text-emerald-600', kind: 'office' };
        if (ext === 'ppt' || ext === 'pptx') return { ext: 'PPT', icon: 'fa-file-powerpoint', color: 'text-orange-600', kind: 'office' };
        return { ext: 'File', icon: 'fa-file-lines', color: 'text-slate-500', kind: 'other' };
    }

    function downloadMaterial(matId) {
        const mat = state.materials.find(m => m.id === matId);
        if (!mat) return;
        const fileId = mat.driveFileId || '';
        const mobileUrl = fileId ? 'https://drive.usercontent.google.com/download?id=' + fileId + '&export=download&confirm=t' : '';
        let url = mat.downloadUrl || mobileUrl || mat.driveUrl || '';
        if (!url || isPlaceholderDriveUrl(url)) {
            url = ensureMaterialDownloadUrl(mat);
        }
        if (!url) {
            showToast('Unable to prepare download file. Please try again.', 'error');
            return;
        }

        mat.downloads = (mat.downloads || 0) + 1;
        saveStateLocally();

        const fm = getMaterialFileMeta(mat);
        let filename = mat.fileName || ((mat.title || 'Divine_Classes_Assignment').replace(/[^a-zA-Z0-9_-]/g, '_') + '.' + (fm.kind === 'pdf' ? 'pdf' : (mat.fileType || 'pdf')));
        if (!filename.includes('.')) filename += '.pdf';

        let downloadHref = url;
        let isBlob = false;
        let blobObj = null;
        if (url.startsWith('data:')) {
            blobObj = base64ToBlob(url, 'application/pdf');
            downloadHref = URL.createObjectURL(blobObj);
            isBlob = true;
        }

        // Universal reliable downloader
        const link = document.createElement('a');
        link.href = downloadHref;
        link.download = filename;
        if (!isBlob && !url.startsWith('blob:')) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
        }
        document.body.appendChild(link);
        link.click();
        setTimeout(function () {
            if (document.body.contains(link)) document.body.removeChild(link);
        }, 300);

        // Auto-open on mobile phones so students view the document right away
        setTimeout(function () {
            try {
                if (mat.previewUrl) {
                    window.open(mat.previewUrl, '_blank');
                } else if (isBlob) {
                    window.open(downloadHref, '_blank');
                } else if (url.includes('drive.google.com')) {
                    const fid = mat.driveFileId || (url.match(/id=([a-zA-Z0-9_-]+)/) || [])[1];
                    const openTarget = fid ? ('https://drive.google.com/file/d/' + fid + '/view?usp=sharing') : url;
                    window.open(openTarget, '_blank');
                } else {
                    window.open(downloadHref, '_blank');
                }
            } catch (openErr) {
                console.warn('Mobile auto-open popup notice', openErr);
            }
        }, 200);

        renderMainContent();
        if (fm.kind === 'pdf') {
            showToast(`✓ Downloading PDF "${mat.title}" (${filename}) — opening on your mobile device.`, 'success');
        } else if (fm.kind === 'office') {
            showToast(`✓ ${fm.ext} file "${mat.title}" is downloading — check your Downloads folder.`, 'success');
        } else {
            showToast(`✓ Downloading "${mat.title}" (${mat.fileSize || 'PDF'}) — opening on your mobile device.`, 'success');
        }
    }

    function deleteMaterial(matId) {
        if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
            showToast('Only Admin can delete assignments. Teachers can upload & edit, but deletion is admin-only.', 'error');
            return;
        }
        const mat = state.materials.find(m => m.id === matId);
        if (!mat) return;
        const hasLink = !!(mat.downloadUrl || mat.driveUrl || mat.driveFileId);
        showConfirmDialog({
            title: 'Delete "' + mat.title + '"?',
            message: hasLink
                ? 'This will remove the material from the portal, delete its Google Drive file, and remove the row from the Database. Students will no longer be able to download it.'
                : '⚠ This is an old record with NO Drive link — the file was never actually uploaded.\n\nDelete it, then re-upload the file so students get a working download.',
            confirmText: 'Yes, Delete',
            cancelText: 'Keep It',
            danger: true
        }).then(function (confirmed) {
            if (!confirmed) return;

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res && res.success) {
                            state.materials = state.materials.filter(m => m.id !== matId);
                            saveStateLocally();
                            renderMainContent();
                            showToast('"' + mat.title + '" deleted (removed from Cloud Storage & Database).', 'success');
                        } else {
                            showToast('Delete failed: ' + ((res && res.error) || 'unknown error'), 'error');
                        }
                    })
                    .withFailureHandler(function (err) {
                        showToast('Delete failed: ' + (err && err.message ? err.message : String(err)), 'error');
                    })
                    .apiDeleteMaterial(matId);
            } else {
                state.materials = state.materials.filter(m => m.id !== matId);
                saveStateLocally();
                renderMainContent();
            }
        });
    }
