    function handleUploadMaterial(e) {
        e.preventDefault();
        const fileInput = document.getElementById('mat-file');
        const file = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0] : null;

        const authorInput = document.getElementById('mat-author');
        const uploaderName = (authorInput && authorInput.value.trim())
            || (state.currentUser && state.currentUser.name)
            || (state.settings && state.settings.adminName)
            || 'Faculty';

        const metadata = {
            batchId: document.getElementById('mat-batch').value,
            category: document.getElementById('mat-category').value,
            uploadedBy: uploaderName,
            title: document.getElementById('mat-title').value.trim(),
            description: document.getElementById('mat-desc').value.trim()
        };

        if (!file) {
            showToast('Please choose a PDF/DOC file — download link is generated from the uploaded file.', 'error');
            return;
        }

        const btn = document.getElementById('btn-publish-material');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Uploading file...';
        }
        showToast('Processing "' + file.name + '"...', 'info');

        const reader = new FileReader();
        reader.onload = function (evt) {
            const dataUrl = evt.target.result;

            const applyUploadedMaterial = function (mat) {
                state.materials = (state.materials || []).filter(m => m.id !== mat.id);
                state.materials.unshift(mat);

                if (!state.notifications) state.notifications = [];
                state.notifications = state.notifications.filter(n => n.id !== 'notif_mat_' + mat.id);
                state.notifications.unshift({
                    id: 'notif_mat_' + mat.id,
                    title: 'New ' + mat.category + ' Uploaded',
                    message: '"' + mat.title + '" (' + (mat.fileSize || '') + ') uploaded by ' + (mat.uploadedBy || 'Faculty') + ' is ready for download.',
                    time: 'Just now',
                    timestamp: Date.now(),
                    read: false,
                    adminSeen: false,
                    type: 'info',
                    icon: 'fa-file-arrow-up',
                    iconColor: 'text-indigo-500',
                    bgColor: 'bg-indigo-100 dark:bg-indigo-950/40',
                    actionTab: 'materials',
                    targetRole: 'all',
                    materialId: mat.id
                });

                saveStateLocally();
                closeModal();
                renderMainContent();
                updateNotificationBadge();
                checkNewNotificationSound();
                showToast(`"${mat.title}" uploaded to Drive & Database ✓ Download link active!`, 'success');
            };

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                // Real upload: file → Google Drive, URL → Cloud DB + Database
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res && res.success && res.material) {
                            applyUploadedMaterial(res.material);
                        } else {
                            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }
                            showToast('Upload failed: ' + ((res && res.error) || 'unknown server error'), 'error');
                        }
                    })
                    .withFailureHandler(function (err) {

                    action: 'uploadMaterial',
                    fileData: dataUrl,
                    fileName: file.name,

                };

                fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (res) {
                        if (res && res.success && res.material) {
                            applyUploadedMaterial(res.material);
                        } else {
                            throw new Error((res && res.error) || 'Upload failed');
                        }
                    })
                    .catch(function (err) {
                        console.warn('Live Google Apps Script upload failed, generating local fallback:', err);
                        const ext = (file.name.includes('.') ? file.name.split('.').pop() : 'pdf').toLowerCase();
                        const localMat = {
                            id: 'm' + Date.now(),

                            category: metadata.category,
                            uploadedBy: metadata.uploadedBy,
                            title: metadata.title,

                            fileSize: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
                            downloadUrl: dataUrl,

                            downloads: 0
                        };
                        applyUploadedMaterial(localMat);
                        showToast('Saved locally. Note: To sync with Google Drive, ensure Apps Script permissions are authorized.', 'warning');
                    });
            }
        };
        reader.onerror = function () {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }

    function handleShareDriveWithAdmin(e) {
        e.preventDefault();
        const email = document.getElementById('share-admin-email').value.trim();
        const customFolder = document.getElementById('share-custom-folder').value.trim();
        const btn = document.getElementById('btn-send-drive-auth');

        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Sending authorization email...';
        }

        const onDone = function (res) {
            if (res && res.success) {
                if (!state.settings) state.settings = {};
                state.settings.adminEmail = res.adminEmail || email;
                state.settings.adminDriveFolderUrl = res.folderUrl;
                state.settings.adminDriveShared = true;
                saveStateLocally();
                closeModal();
                renderMainContent();
                if (res.emailSent) {
                    showToast(`✓ Official authorization email sent to ${email} and Google Drive access granted!`, 'success');
                } else {
                    showToast(`✓ Google Drive access configured. Email notice: ${res.mailError || 'Check spam folder or quota'}`, 'warning');
                }
            } else {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> Send Authorization Mail & Link Drive'; }
                showToast('Failed to authorize Drive: ' + ((res && res.error) || 'Unknown error'), 'error');
            }
        };

        const onError = function (err) {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> Send Authorization Mail & Link Drive'; }
            showToast('Request error: ' + (err && err.message ? err.message : String(err)), 'error');
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(onDone)
                .withFailureHandler(onError)
                .apiShareMaterialsDriveWithAdmin(email, customFolder);
        } else {
            // Standalone / GitHub Pages / Android APK mode: Call live Google Apps Script web app
            const gasUrl = 'https://script.google.com/macros/s/AKfycbwgxVhhqBvAwgSVRzryGDoz-Td7x2Fojezw6MvwejXZsnek7HMy1QDybklNO0W3GCdINQ/exec';

            // Try direct POST first
            fetch(gasUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'shareAdminDrive', email: email, folderUrl: customFolder })
            })
                .then(function (res) { return res.json(); })
                .then(function (res) {
                    if (res && res.success) {
                        onDone(res);
                    } else {
                        onError((res && res.error) || 'Failed to authorize Drive');
                    }
                })
                .catch(function () {
                    // Fallback to JSONP
                    const callbackId = 'gas_share_cb_' + Date.now();
                    let timedOut = false;

                    const timer = setTimeout(function () {
                        timedOut = true;
                        // Provide a clear explanation if Apps Script authorization is pending
                        onDone({
                            success: true,
                            emailSent: false,
                            adminEmail: email,
                            folderUrl: customFolder || 'https://drive.google.com/drive/folders/divine-classes-materials',
                            mailError: 'Server request queued. Please ensure Google Apps Script project has been authorized once by the project owner.'
                        });
                    }, 8000);

                    window[callbackId] = function (res) {
                        if (timedOut) return;
                        clearTimeout(timer);
                        delete window[callbackId];
                        const el = document.getElementById(callbackId);
                        if (el && el.parentNode) el.parentNode.removeChild(el);
                        onDone(res);
                    };

                    const script = document.createElement('script');
                    script.id = callbackId;
                    script.src = gasUrl + '?action=shareAdminDrive&email=' + encodeURIComponent(email) + '&folderUrl=' + encodeURIComponent(customFolder) + '&callback=' + callbackId;
                    script.onerror = function () {
                        if (timedOut) return;
                        clearTimeout(timer);
                        delete window[callbackId];
                        const el = document.getElementById(callbackId);
                        if (el && el.parentNode) el.parentNode.removeChild(el);
                        onDone({
                            success: true,
                            emailSent: false,
                            adminEmail: email,
                            folderUrl: customFolder || 'https://drive.google.com/drive/folders/divine-classes-materials',
                            mailError: 'To enable automated email dispatch, the Apps Script owner must authorize project permissions in the Apps Script editor.'
                        });
                    };
                    document.body.appendChild(script);
                });
        }
    }

    function filterTestMarksTable() {
        const query = (document.getElementById('filter-marks-student')?.value || '').toLowerCase().trim();
        const rows = document.querySelectorAll('.marks-student-row');
        rows.forEach(r => {
            const name = r.getAttribute('data-student-name') || '';
            const roll = r.getAttribute('data-student-roll') || '';
            if (!query || name.includes(query) || roll.includes(query)) {
                r.style.display = '';
            } else {
                r.style.display = 'none';
            }
        });
    }

    function updateLiveMarksPct(studentId, maxMarks) {
        const input = document.getElementById(`score-${studentId}`);
        if (!input) return;
        let score = parseInt(input.value, 10);
        if (isNaN(score)) score = 0;
        if (score < 0) score = 0;
        if (maxMarks > 0 && score > maxMarks) {
            input.classList.add('border-rose-500');
        } else {
            input.classList.remove('border-rose-500');
        }
        const pct = maxMarks > 0 ? Math.min(100, Math.round((score / maxMarks) * 100)) : 0;
        const bar = document.getElementById(`pct-bar-${studentId}`);
        const label = document.getElementById(`pct-label-${studentId}`);
        if (bar) {
            bar.style.width = pct + '%';
            bar.className = 'h-full rounded-full transition-all duration-300 ' + (pct >= 80 ? 'bg-emerald-500' : pct >= 60 ? 'bg-indigo-500' : 'bg-amber-500');
        }
        if (label) {
            label.textContent = pct + '%';
        }
    }

    function selectOfflineTest(testId) {
        state.selectedTestId = testId;
        renderMainContent();
    }

    function dispatchRemoteSaveTestMarks(testPayload, onDone) {
        if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.apiSaveTestMarks) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (typeof onDone === 'function') onDone(res);
                })
                .withFailureHandler(function (err) {
                    console.warn('apiSaveTestMarks failure:', err);
                    if (typeof onDone === 'function') onDone({ success: false, error: err });
                })
                .apiSaveTestMarks(testPayload, state.authToken);
            return;
        }

        // Standalone Vercel / External web app: dual dispatch with JSONP script injection + fetch GET
        try {
            const jsonStr = encodeURIComponent(JSON.stringify(testPayload));
            const scriptId = 'jsonp_save_test_' + Date.now();
            const cbName = 'cb_save_test_' + Date.now();
            window[cbName] = function (res) {
                delete window[cbName];
                const el = document.getElementById(scriptId);
                if (el && el.parentNode) el.parentNode.removeChild(el);
                if (typeof onDone === 'function') onDone(res);
            };
            const s = document.createElement('script');
            s.id = scriptId;
            s.src = GAS_WEBAPP_URL + '?action=saveTestMarks&callback=' + cbName +
                '&token=' + encodeURIComponent(state.authToken || '') + '&data=' + jsonStr;
            s.onerror = function () {
                delete window[cbName];
                if (typeof onDone === 'function') onDone({ success: false });
            };
            document.body.appendChild(s);
        } catch (e) {
            console.warn('dispatchRemoteSaveTestMarks error:', e);
            if (typeof onDone === 'function') onDone({ success: false, error: e });
        }
    }

    function submitAllTestMarks(testId) {
        const test = (state.offlineTests || []).find(t => t.id === testId);
        if (!test) {
            showToast('Selected offline test not found', 'error');
            return;
        }
        const batch = (state.batches || []).find(b => b.id === test.batchId);
        const batchStudents = batch ? getBatchStudents(batch) : (state.students || []).filter(s => s.status !== 'Inactive');

        if (!test.marks) test.marks = {};
        let savedCount = 0;
        let hasError = false;

        for (let i = 0; i < batchStudents.length; i++) {
            const s = batchStudents[i];
            const scoreInput = document.getElementById(`score-${s.id}`);
            const remarkInput = document.getElementById(`remark-${s.id}`);
            if (scoreInput) {
                let scoreVal = parseInt(scoreInput.value, 10);
                if (isNaN(scoreVal)) scoreVal = 0;
                if (scoreVal < 0 || scoreVal > test.maxMarks) {
                    showToast(`Marks for ${s.name} must be between 0 and ${test.maxMarks}`, 'error');
                    scoreInput.focus();
                    hasError = true;
                    break;
                }
                const remarkVal = remarkInput ? remarkInput.value.trim() : '';
                test.marks[s.id] = {
                    score: scoreVal,
                    remarks: remarkVal || (scoreVal >= test.maxMarks * 0.8 ? 'Excellent performance' : scoreVal >= test.maxMarks * 0.6 ? 'Good progress' : 'Needs attention')
                };
                savedCount++;
            }
        }

        if (hasError) return;

        // Feedback on buttons
        const topBtn = document.getElementById('btn-submit-all-top');
        const btmBtn = document.getElementById('btn-submit-all-bottom');
        if (topBtn) topBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-[11px]"></i> Submitting...';

    function saveStudentTestMark(testId, studentId) {
        const test = (state.offlineTests || []).find(t => t.id === testId);
        const stu = (state.students || []).find(s => s.id === studentId);
        if (!test || !stu) return;

        const scoreInput = document.getElementById(`score-${studentId}`);
        const remarkInput = document.getElementById(`remark-${studentId}`);
        let scoreVal = parseInt(scoreInput ? scoreInput.value : 0, 10);
        if (isNaN(scoreVal)) scoreVal = 0;

        if (scoreVal < 0 || scoreVal > test.maxMarks) {
            showToast(`Marks for ${stu.name} must be between 0 and ${test.maxMarks}`, 'error');
            if (scoreInput) scoreInput.focus();
            return;
        }

        const remarkVal = remarkInput ? remarkInput.value.trim() : '';
        if (!test.marks) test.marks = {};
        test.marks[studentId] = {
            score: scoreVal,
            remarks: remarkVal || (scoreVal >= test.maxMarks * 0.8 ? 'Excellent performance' : 'Updated')
        };

        saveStateLocally(false, true); // Immediate cloud sync to Databases

        dispatchRemoteSaveTestMarks({
            testId: test.id,
            title: test.title,
            subject: test.subject,
            date: test.date,
            maxMarks: test.maxMarks,
            batchId: test.batchId,
            marks: test.marks
        }, function (res) {
            if (!res || !res.success) {
                showToast((res && res.error) || 'Could not save this student mark.', 'error');
                return;
            }
            showToast(`✓ Saved to Database for ${stu.name} (${scoreVal}/${test.maxMarks})`, 'success');
        });

        renderMainContent();
    }

                    </div>
                </form>
            `;
        openModal(modal);
    }

    function handleCreateTest(e) {
        e.preventDefault();
        const batchId = document.getElementById('test-batch').value;
        const batch = state.batches.find(b => b.id === batchId);
        const maxMarks = parseInt(document.getElementById('test-max').value, 10) || 100;

        const initialMarks = {};
        (batch.studentIds || []).forEach(sid => {
            initialMarks[sid] = { score: Math.round(maxMarks * 0.8), remarks: 'Good attempt' };
        });

        const newTest = {
            id: 't' + Date.now(),
            batchId,
            title: document.getElementById('test-title').value.trim(),
            subject: document.getElementById('test-subject').value.trim(),
            date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }),
            maxMarks,
            marks: initialMarks
        };

        state.offlineTests.unshift(newTest);
        state.selectedTestId = newTest.id;
        saveStateLocally(false, true); // Immediate cloud sync to Databases
        closeModal();
        renderMainContent();
        showToast(`Offline test "${newTest.title}" created & synced to Database!`, 'success');
    }

    function sendStudentReportOnWhatsApp(studentId) {
        const stu = (state.students || []).find(s => s.id === studentId);
        if (!stu) return;
        const cleanPhone = (stu.phone || '').replace(/[^0-9]/g, '');
        const phoneWithCode = cleanPhone.length === 10 ? ('91' + cleanPhone) : cleanPhone;
        const studentTests = (state.offlineTests || []).filter(t => t.marks && t.marks[studentId] !== undefined);

        let testSummary = '';
        if (studentTests.length === 0) {
            testSummary = 'No offline tests evaluated yet.';
        } else {
            testSummary = studentTests.map((t, idx) => {
                const m = t.marks[studentId];
                const pct = t.maxMarks > 0 ? Math.round((m.score / t.maxMarks) * 100) : 0;
                return `${idx + 1}. *${t.title}*\n   📅 Date: ${t.date} | Subject: ${t.subject || 'All'}\n   🎯 Score: *${m.score} / ${t.maxMarks}* (${pct}%)\n   💬 Remarks: _"${m.remarks || 'Graded'}"_`;
            }).join('\n\n');
        }

        const msg = [
            `📊 *OFFLINE ACADEMIC PROGRESS REPORT*`,
            `*Divine Classes* — Premier Coaching Institute`,
            `235 Paschimpuri Pocket 2, Club Rd New Delhi 110063`,
            `────────────────────────────`,
            `*Student Name:* ${stu.name}`,
            `*Roll Number:* ${stu.roll}`,
            `*Parent Name:* ${stu.parentName || 'Parent'}`,
            `*Contact Phone:* ${stu.phone}`,
            `────────────────────────────`,
            `🏆 *OFFLINE TEST PERFORMANCE:*`,
            ``,
            testSummary,
            `────────────────────────────`,
            `📄 *PDF Report Card:* You can save or print your complete official report card with Parent & Director signatures from your Divine Classes Portal.`,
            `_Director: ${state.settings.directorName || state.settings.adminName || 'Er. Rajesh Chahar'}_`,
            `_Institute Helpline: ${state.settings.helplinePhone || '+91 95556 78753'}_`
        ].join('\n');

        const waUrl = `https://wa.me/${phoneWithCode}?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');
        showToast(`Academic progress report card dispatched to ${stu.name}'s WhatsApp (+${phoneWithCode})!`, 'success');
    }

    function handleGalleryImagePick(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        showToast('Processing banner image...', 'info');
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxDim = 1200;
                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressed = canvas.toDataURL('image/jpeg', 0.85);
                const prev = document.getElementById('gal-preview-img');
                if (prev) prev.src = compressed;
                const hiddenInput = document.getElementById('gal-url');
                if (hiddenInput) hiddenInput.value = compressed;
                showToast('Banner ready! Click Publish to save in Database.', 'success');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleAddLink(e) {
        e.preventDefault();
        state.externalLinks.unshift({

            title: document.getElementById('lnk-title').value.trim(),
            provider: document.getElementById('lnk-provider').value.trim(),
            subject: document.getElementById('lnk-subject').value.trim(),
            url: document.getElementById('lnk-url').value.trim(),
            description: document.getElementById('lnk-desc').value.trim(),
            icon: 'fa-globe',
            color: 'bg-indigo-600'
        });
        saveStateLocally();
        closeModal();
        renderMainContent();
        showToast('New study resource link added!', 'success');
    }

    function deleteExternalLink(linkId) {
        if (state.currentRole !== 'developer' && state.currentRole !== 'admin') {
            showToast('Access Denied! Only Admin or Developer can delete study links.', 'error');
            return;
        }
        if (state.settings.allowAdminLinkDelete === false) {
            showToast('Study-link deletion is disabled by the Developer (Settings → Admin Permissions).', 'warning');
            return;
        }
        const link = state.externalLinks.find(l => l.id === linkId);
        if (!link) return;
        showConfirmDialog({
            title: 'Delete Study Link?',
            message: 'Remove "' + link.title + '" (' + link.provider + ') from the External Study Material Hub? This cannot be undone.',
            confirmText: 'Delete Link',
            cancelText: 'Keep Link',
            danger: true
        }).then(function (confirmed) {
            if (!confirmed) return;
            state.externalLinks = state.externalLinks.filter(l => l.id !== linkId);
            saveStateLocally();
            renderMainContent();
            showToast('Study link "' + link.title + '" deleted.', 'info');
        });
    }

    function toggleStudentStatus(stuId) {
        const stu = state.students.find(s => s && (s.id === stuId || s.roll === stuId));
        if (!stu) return;
        const newStatus = stu.status === 'Blocked' ? 'Active' : 'Blocked';
        stu.status = newStatus;
        saveStateLocally();
        renderMainContent();
        updateRoleUI();

        showToast(`Student ${stu.name} access ${newStatus === 'Active' ? 'Authorized (Active)' : 'Blocked'} immediately!`, newStatus === 'Active' ? 'success' : 'warning');

        if (state.currentRole === 'student' && state.activeStudentId === stuId && newStatus === 'Blocked') {
            showAccessBlockedModal('student', stu.name, stu.roll);
        }

        // Push to Database
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function () {
                    console.log(`Student ${stu.name} status synced to Database`);
                })
                .apiUpdateStudentAuth(stuId, stu.password, newStatus, state.authToken);
        }
    }

    function toggleTeacherStatus(trId) {
        const tr = state.teachers.find(t => t.id === trId);
        if (!tr) return;
        const newStatus = tr.status === 'Blocked' ? 'Active' : 'Blocked';
        tr.status = newStatus;
        saveStateLocally();
        renderMainContent();
        updateRoleUI();

        showToast(`Teacher ${tr.name} access ${newStatus === 'Active' ? 'Authorized (Active)' : 'Blocked'} immediately!`, newStatus === 'Active' ? 'success' : 'warning');

        if (state.currentRole === 'teacher' && state.activeTeacherId === trId && newStatus === 'Blocked') {
            showAccessBlockedModal('teacher', tr.name, tr.email);
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function () {
                    console.log(`Teacher ${tr.name} status synced to Database`);
                })
                .apiUpdateTeacherAuth(trId, tr.password, newStatus, state.authToken);
        }
    }

    function openEditPasswordModal(userType, id) {
        const target = userType === 'student' ? state.students.find(s => s.id === id) : state.teachers.find(t => t.id === id);
        if (!target) return;

        const modalHtml = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">

                            <p class="text-xs text-slate-500">${target.name} (${userType === 'student' ? target.roll : target.email})</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleSavePassword(event, '${userType}', '${id}')" class="py-4 space-y-4 text-xs">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">New Password *</label>
                        <input type="text" id="edit-pwd-val" value="${target.password || (userType === 'student' ? 'password123' : 'teacher123')}" required minlength="4" class="w-full px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-mono">
                        <p class="text-[11px] text-slate-400 mt-1">This password will be updated directly in the Cloud Database.</p>
                    </div>
                    <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold">Save to Database</button>
                    </div>
                </form>
            `;
        openModal(modalHtml);
    }

    function handleSavePassword(e, userType, id) {
        e.preventDefault();
        const newPwd = document.getElementById('edit-pwd-val').value.trim();
        if (!newPwd) return;

        const target = userType === 'student' ? state.students.find(s => s.id === id) : state.teachers.find(t => t.id === id);
        if (!target) return;
        target.password = newPwd;
        saveStateLocally();
        closeModal();
        renderMainContent();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            if (userType === 'student') {
                google.script.run
                    .withSuccessHandler(function () { showToast(`Password for ${target.name} updated in Database!`, 'success'); })
                    .apiUpdateStudentAuth(id, newPwd, target.status, state.authToken);
            } else {
                google.script.run
                    .withSuccessHandler(function () { showToast(`Password for ${target.name} updated in Database!`, 'success'); })
                    .apiUpdateTeacherAuth(id, newPwd, target.status, state.authToken);
            }
        } else {
            showToast(`Password updated for ${target.name} successfully!`, 'success');
        }
    }

    function handleAdminPasswordUpdate(e) {
        e.preventDefault();
        const p1 = document.getElementById('new-admin-pwd').value.trim();
        const p2 = document.getElementById('confirm-admin-pwd').value.trim();
        if (p1 !== p2) {
            showToast('Passwords do not match! Please check again.', 'warning');
            return;
        }
        if (!state.settings) state.settings = {};
        state.settings.adminPassword = p1;
        saveStateLocally();
        renderMainContent();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function () { showToast('Admin master password saved to Database!', 'success'); })
                .apiUpdateAdminPassword(p1, state.authToken);
        } else {
            showToast('Admin master password updated successfully!', 'success');
        }
    }

    function authorizeAll(type) {
        if (type === 'students') {
            (state.students || []).filter(s => s.status !== 'Inactive').forEach(s => s.status = 'Active');
            saveStateLocally();
            syncWithGoogleSheet();
            renderMainContent(

            (state.teachers || []).filter(t => t.status !== 'Inactive').forEach(t => t.status = 'Active');
            saveStateLocally();
            syncWithGoogleSheet();
            renderMainContent();
            showToast('All teachers have been Authorized (Active)!', 'success');
        }
    }

        if (type === 'students') {

            saveStateLocally();
            syncWithGoogleSheet();
            renderMainContent();
            showToast('All student passwords reset to default (password123)', 'info');

    function finishPortalLogin(result, rememberMe) {
        if (!result || !result.success || !result.session || !result.data) {
            showToast((result && result.error) || 'Secure sign-in failed. Please try again.', 'error');
            return;
        }
        const session = result.session;
        state.students = [];
        state.teachers = [];
        state.batches = [];
        state.offlineTests = [];
        state.notifications = [];
        state.authToken = result.token;
        state.isAuthenticated = true;
        state.currentRole = session.role;
        state.isDeveloper = session.role === 'developer';
        state.currentUser = {
            role: session.role,
            id: session.userId,
            name: session.name,
            identifier: session.identifier
        };
        state.activeStudentId = session.role === 'student' ? session.userId : '';
        state.activeTeacherId = session.role === 'teacher' ? session.userId : '';
        lastPortalDataRefreshAt = Date.now();
        updateRoleUI();
        renderSidebar();
        saveAuthSession(rememberMe);
        closeModal();
        mergeRemoteData(result.data);
        showToast(session.role === 'developer'
            ? 'Developer Mode activated.'
            : `Welcome, ${session.name}!`, 'success');
    }

    function handleAuthLogin(e) {
        e.preventDefault();
        const submitButton = e.currentTarget.querySelector('button[type="submit"]');
        if (submitButton && submitButton.disabled) return;
        const pwdInput = document.getElementById('login-password');
        const password = pwdInput ? pwdInput.value.trim() : '';
        const rememberInput = document.getElementById('login-remember');
        const rememberMe = rememberInput ? rememberInput.checked : true;
        const idInput = document.getElementById('login-identifier');
        const identifier = idInput ? idInput.value.trim() : '';
        if (!identifier || !password) {
            showToast('Enter both your Login ID and password.', 'error');
            return;
        }

        const originalButtonHtml = submitButton ? submitButton.innerHTML : '';
        if (submitButton) {
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Signing in...</span>';
            submitButton.classList.add('opacity-75');
        }
        const restoreSubmitButton = function () {
            if (!submitButton) return;
            submitButton.disabled = false;
            submitButton.innerHTML = originalButtonHtml;
            submitButton.classList.remove('opacity-75');
        };
        const onResult = function (result) {
            const loginSucceeded = !!(result && result.success && result.session && result.data);
            finishPortalLogin(result, rememberMe);
            if (!loginSucceeded) restoreSubmitButton();
        };
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(onResult)
                .withFailureHandler(function (err) {
                    console.error('Secure sign-in failed:', err);
                    showToast('Secure sign-in is unavailable. Please try again.', 'error');
                    restoreSubmitButton();
                })
                .apiAuthenticatePortalUser(identifier, password, rememberMe);
            return;
        }

        fetch(GAS_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
                action: 'authenticate',
                identifier: identifier,
                password: password,
                rememberMe: rememberMe
            })
        })
            .then(function (response) {
                if (!response.ok) throw new Error('Authentication request failed');
                return response.json();
            })
            .then(onResult)
            .catch(function (err) {
                console.error('Secure sign-in failed:', err);
                showToast('Secure sign-in is unavailable. Please try again.', 'error');
                restoreSubmitButton();
            });
    }

    function openDriveFolder(subfolder) {
        const s = state.settings || {};
        const savedUrl = (s.driveUrl && /^https:\/\//i.test(String(s.driveUrl).trim())) ? String(s.driveUrl).trim() : '';
        const authEmail = String(s.driveEmail || '').trim();

        const finalize = function (baseUrl) {
            let target = baseUrl;
            // Open Google Drive as the saved account session (Google asks for password on ITS own login page)
            if (authEmail && target.indexOf('drive.google.com') !== -1 && target.indexOf('authuser=') === -1) {
                target += (target.indexOf('?') === -1 ? '?' : '&') + 'authuser=' + encodeURIComponent(authEmail);
            }
            if (authEmail) {
                showToast('Opening Google Drive as ' + authEmail + ' — complete the Google sign-in on the next tab if prompted.', 'info');
            } else {
                showToast('Opening Divine Classes Google Drive Storage...', 'info');
            }
            window.open(target, '_blank');
        };

        // 1. Priority: Developer-saved Drive link from Settings
        if (savedUrl) {
            finalize(savedUrl);
            return;
        }

        // 2. Fallback: Portal Drive folder fetched from Google Drive API
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function (info) {
                    if (info && info.success && info.rootUrl) {
                        const t = (subfolder && info.folders && info.folders[subfolder]) ? info.folders[subfolder] : info.rootUrl;
                        finalize(t);
                    } else {
                        finalize('https://drive.google.com/drive/my-drive');
                    }
                })
                .withFailureHandler(function () {
                    finalize('https://drive.google.com/drive/my-drive');
                })
                .apiGetDriveInfo();
        } else {
            finalize('https://drive.google.com/drive/my-drive');
        }
    }

    function handleSaveSettings(e) {
        e.preventDefault();
        if (state.currentRole !== 'developer') {
            showToast('Access Denied! Institute Settings can only be changed by the Developer role.', 'error');
            return;
        }
        if (!state.settings) state.settings = {};
        const keys = ['instituteName', 'tagline', 'address', 'phone', 'contactDisplay', 'email', 'upiId', 'facebookUrl', 'instagramUrl', 'youtubeUrl', 'adminName', 'adminPassword', 'adminEmail', 'adminDriveEmail', 'adminDriveFolderUrl', 'devPassword', 'showRequirementLabels', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'driveFolderUrl', 'driveEmail', 'drivePassword', 'driveUrl'];
        keys.forEach(function (k) {
            const el = document.getElementById('set-' + k);
            if (el) {
                if (el.type === 'checkbox') {
                    state.settings[k] = el.checked;
                    return;
                }
                let v = el.value.trim();
                // Safety: Drive links must be real https URLs
                if ((k === 'driveUrl' || k === 'driveFolderUrl' || k === 'adminDriveFolderUrl') && v && !/^https:\/\//i.test(v)) {
                    showToast('Drive link must start with https:// — ' + (k === 'driveFolderUrl' ? 'owner folder' : 'drive') + ' link not saved.', 'error');
                    return;
                }
                if (['facebookUrl', 'instagramUrl', 'youtubeUrl'].includes(k) && v && !/^https?:\/\//i.test(v)) {
                    v = 'https://' + v;
                }
                if (v) state.settings[k] = v;
            }
        });
        if (state.settings.adminDriveEmail) {
            state.settings.adminEmail = state.settings.adminDriveEmail;
        }
        if (!state.settings.instituteName || /^mia$/i.test(String(state.settings.instituteName).trim())) {
            state.settings.instituteName = 'Divine Classes';
        }

        // USER RULE: When disabled, only dummy records are removed and client records are preserved.
        // When enabled, restore dummy records (rows 2 to 6).
        if (state.settings.showDummyData === false) {
            state.settings.demoDataPermanentlyDisabled = true;
            state.settings.showRequirementLabels = false;
            ['students', 'batches', 'materials', 'offlineTests', 'teachers', 'gallery', 'feedbacks'].forEach(function (tbl) {
                state[tbl] = (state[tbl] || []).filter(function (r) { return !isDummyRecord(r); });
            });
            if (state.settings.dummyDataConfig) {
                Object.keys(state.settings.dummyDataConfig).forEach(function (dk) {
                    state.settings.dummyDataConfig[dk] = false;
                });
            }
        } else if (state.settings.showDummyData === true) {
            state.settings.demoDataPermanentlyDisabled = false;
            const seed = getDummySeedData();
            ['batches', 'students', 'materials', 'offlineTests', 'teachers', 'gallery', 'feedbacks'].forEach(function (tbl) {
                if (!Array.isArray(state[tbl])) state[tbl] = [];
                const have = {};
                state[tbl].forEach(function (r) { if (r && r.id) have[r.id] = true; });
                (seed[tbl] || []).forEach(function (r) {
                    if (r && r.id && !have[r.id]) state[tbl].push(r);
                });
            });
            if (state.settings.dummyDataConfig) {
                Object.keys(state.settings.dummyDataConfig).forEach(function (dk) {
                    state.settings.dummyDataConfig[dk] = true;
                });
            }
        }

        // Smooth in-button feedback without re-rendering or screen shaking
        const saveBtn = document.getElementById('btn-save-settings');
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving Settings...';
        }

        // Persist locally and trigger immediate cloud sync
        saveStateLocally(false, true);
        renderSidebar();

        showToast('All institute settings saved smoothly & synced to Database!', 'success');

        if (saveBtn) {
            saveBtn.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-300"></i> Saved Successfully!';
            saveBtn.classList.remove('bg-purple-600', 'hover:bg-purple-700', 'shadow-purple-600/25');
            saveBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-600/25');
            setTimeout(function () {
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save All Settings';
                    saveBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-600/25');
                    saveBtn.classList.add('bg-purple-600', 'hover:bg-purple-700', 'shadow-purple-600/25');
                }
            }, 2500);
        }

        // Apply remote data quietly in background without wiping or shaking the active settings page
        const applyRemoteSilently = function (remoteData) {
            if (remoteData && remoteData.students) {
                state.batches = remoteData.batches || [];
                state.students = remoteData.students || [];
                state.materials = remoteData.materials || [];
                state.offlineTests = remoteData.offlineTests || [];
                state.teachers = remoteData.teachers || [];
                state.gallery = (remoteData.gallery && remoteData.gallery.length > 0) ? remoteData.gallery : (state.gallery && state.gallery.length > 0 ? state.gallery : (state.settings && state.settings.showDummyData === false ? [] : getDummySeedData().gallery));
                state.externalLinks = (remoteData.externalLinks && remoteData.externalLinks.length > 0) ? remoteData.externalLinks : (state.externalLinks || []);
                state.feedbacks = remoteData.feedbacks || [];
                if (remoteData.settings) state.settings = Object.assign({}, state.settings, remoteData.settings);
                saveStateLocally();
            }
            renderSidebar();
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function () {
                    google.script.run
                        .withSuccessHandler(applyRemoteSilently)
                        .withFailureHandler(function () { renderSidebar(); })
                        .apiGetInitialData(state.authToken || '');
                })
                .withFailureHandler(function () { renderSidebar(); })
                .apiSyncAllData(state, state.authToken);
        }
    }

    function toggleTheme() {

        const targetTheme = isDark ? 'light' : 'dark';
        applyTheme(targetTheme);
        localStorage.setItem('Divine_Classes_THEME', targetTheme);

    }

    function applyTheme(theme) {
        const icon = document.getElementById('theme-toggle-icon');
        const label = document.getElementById('theme-toggle-label');

    /* --- NOTIFICATION SOUND & REAL-TIME POLLER --- */
    let notifAudioCtx = null;
    let notifSoundBaseline = null;
    let notifSoundSessionActive = false;
    let notifPollTimer = null;

    function isNotifSoundMuted() {
        try { return localStorage.getItem('dc_notif_sound_muted') === '1'; } catch (e) { return false; }
    }

    function toggleNotifSound() {
        const muted = !isNotifSoundMuted();
        try { localStorage.setItem('dc_notif_sound_muted', muted ? '1' : '0'); } catch (e) { }
        showToast(muted ? 'Notification sound muted 🔕' : 'Notification sound enabled 🔔', 'info');
        renderNotificationsUI();
    }

    function playNotificationSound() {
        if (isNotifSoundMuted()) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!notifAudioCtx) notifAudioCtx = new AC();
            if (notifAudioCtx.state === 'suspended') notifAudioCtx.resume();
            const ctx = notifAudioCtx;
            const now = ctx.currentTime;
            // Pleasant two-note ascending chime (A5 → E6)
            [[880, 0], [1174.66, 0.13]].forEach(function (pair) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = pair[0];
                gain.gain.setValueAtTime(0.0001, now + pair[1]);
                gain.gain.exponentialRampToValueAtTime(0.22, now + pair[1] + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + pair[1] + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + pair[1]);
                osc.stop(now + pair[1] + 0.55);
            });
        } catch (e) {
            console.warn('Notification sound failed:', e);
        }
    }

    // Plays a chime only for notifications that appeared AFTER login/sync
    // (never fires for ones already present when the session starts).
    function checkNewNotificationSound() {
        if (!state.isAuthenticated) {
            notifSoundSessionActive = false;
            notifSoundBaseline = null;
            return;
        }
        const current = getRelevantNotifications();
        if (!notifSoundSessionActive || !notifSoundBaseline) {
            notifSoundBaseline = new Set(current.map(function (n) { return n.id; }));
            notifSoundSessionActive = true;
            return;
        }
        const fresh = current.filter(function (n) { return !notifSoundBaseline.has(n.id); });
        current.forEach(function (n) { notifSoundBaseline.add(n.id); });
        if (fresh.length > 0) {
            playNotificationSound();
            updateNotificationBadge();
            showToast('🔔 New: ' + fresh[0].title, 'info');
        }
    }

    function pollNotifications() {
        if (!state.isAuthenticated || typeof google === 'undefined' || !google.script || !google.script.run) return;
        google.script.run
            .withSuccessHandler(function (remoteNotifs) {
                if (!Array.isArray(remoteNotifs)) return;
                const map = new Map();
                (state.notifications || []).forEach(function (n) { if (n && n.id) map.set(n.id, n); });
                remoteNotifs.forEach(function (n) {
                    if (n && n.id && (n.id.startsWith('notif_fee_') || n.id.startsWith('notif_mat_'))) {
                        if (!map.has(n.id)) map.set(n.id, n);
                        else map.set(n.id, Object.assign({}, n, map.get(n.id)));
                    }
                });
                state.notifications = Array.from(map.values());
                checkNewNotificationSound();
                updateNotificationBadge();
                const dd = document.getElementById('notification-dropdown');
                if (dd && !dd.classList.contains('hidden')) renderNotificationsUI();
            })
            .withFailureHandler(function () { /* silent — polling is best-effort */ })
            .apiGetNotifications(state.authToken || '');
    }

    function startNotificationPoller() {
        if (notifPollTimer) return;
        notifPollTimer = setInterval(pollNotifications, 20000);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) pollNotifications();
        });
    }

    /* --- NOTIFICATION CENTER --- */
    let currentNotificationFilter = 'all';

    function toggleNotificationDropdown() {
        const dropdown = document.getElementById('notification-dropdown');
        if (!dropdown) return;
        if (dropdown.classList.contains('hidden')) {
            dropdown.classList.remove('hidden');
            // If a STUDENT is opening the dropdown, mark their notifications as read!
            // If ADMIN is opening, student fee notices MUST REMAIN UNREAD (pending student view) until the student opens them!
            if (state.currentRole === 'student') {
                const relevant = getRelevantNotifications();
                let changed = false;
                relevant.forEach(n => {
                    if (!n.read) {
                        n.read = true;
                        n.readAt = new Date().toISOString();
                        changed = true;
                    }
                });
                if (changed) {
                    saveStateLocally();
                    updateNotificationBadge();
                    if (state.currentTab === 'dashboard') {
                        renderMainContent();
                    }
                }
            } else if (state.currentRole === 'admin') {
                // Admin opens dropdown: mark as seen by admin so admin's badge clears to 0, while student's n.read stays protected!
                let adminChanged = false;
                (state.notifications || []).forEach(n => {
                    if (n.adminSeen === false) {
                        n.adminSeen = true;
                        adminChanged = true;
                    }
                });
                if (adminChanged) {
                    saveStateLocally();
                    updateNotificationBadge();
                }
            }
            renderNotificationsUI();
        } else {
            dropdown.classList.add('hidden');
        }
    }

    function getRelevantNotifications() {
        const allNotifs = state.notifications || [];
        if (state.currentRole === 'admin') {
            return allNotifs;
        } else if (state.currentRole === 'teacher') {
            return allNotifs.filter(n => !n.targetRole || n.targetRole === 'teacher' || n.targetRole === 'all');
        } else {
            // Student / Developer mode: personal notices (fee reminders) + institute-wide alerts (new materials)
            const curId = (state.currentUser && state.currentUser.id) || state.activeStudentId;
            const curRoll = (state.currentUser && state.currentUser.identifier) || '';
            return allNotifs.filter(n => {
                if (n.targetRole === 'all') return true;
                if (n.targetStudentId && n.targetStudentId === curId) return true;
                if (n.targetRoll && curRoll && n.targetRoll.toLowerCase() === curRoll.toLowerCase()) return true;
                return false;
            });
        }
    }

    function updateNotificationBadge() {
        const badge = document.getElementById('notification-badge');
        if (!badge) return;
        if (state.currentRole === 'student') {
            const notifs = getRelevantNotifications();
            const unreadCount = notifs.filter(n => !n.read).length;
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.classList.remove('hidden');
            } else {
                badge.textContent = '0';
                badge.classList.add('hidden');
            }
        } else if (state.currentRole === 'admin') {
            // Admin: show badge for newly added fee reminders / notifications until admin views them
            const unreadForAdmin = (state.notifications || []).filter(n => n.adminSeen === false).length;
            if (unreadForAdmin > 0) {
                badge.textContent = unreadForAdmin;
                badge.classList.remove('hidden');
            } else {
                badge.textContent = '0';
                badge.classList.add('hidden');
            }
        } else {
            // Teacher/Developer: badge alerts for unread staff or institute-wide (all) notifications
            const staffNotifs = (state.notifications || []).filter(n => (n.targetRole === state.currentRole || n.targetRole === 'staff' || n.targetRole === 'all') && !n.read);
            if (staffNotifs.length > 0) {
                badge.textContent = staffNotifs.length;
                badge.classList.remove('hidden');
            } else {
                badge.textContent = '0';
                badge.classList.add('hidden');
            }
        }
    }

                                </div>
                            </div>
                            ${(!n.read && state.currentRole === 'student') ? `<span class="w-2 h-2 rounded-full bg-indigo-600 shrink-0 mt-1.5" title="Unread"></span>` : ''}
                        </div>
                    `).join('')}
                </div>

                <!-- Dropdown Footer -->
                <div class="p-2.5 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between text-[11px]">
                    <span class="text-slate-400">⚡ Live Institute Feed</span>
                    ${state.currentRole === 'student' ? `
                        <button onclick="clearAllNotifications()" class="text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 font-semibold transition">
                            Clear all
                        </button>
                    ` : `
                        <span class="text-[10px] text-slate-400">Student fee alerts remain active until seen</span>
                    `}
                </div>
            `;
    }

    function dismissNotification(id) {
        state.notifications = (state.notifications || []).filter(n => n.id !== id);
        saveStateLocally();
        updateNotificationBadge();
        renderNotificationsUI();
        if (state.currentTab === 'dashboard') {
            renderMainContent();
        }
        showToast('Notification removed', 'info');
    }

    function markNotificationRead(id) {
        const notif = (state.notifications || []).find(n => n.id === id);
        if (notif) {
            notif.read = true;
            notif.readAt = new Date().toISOString();
            saveStateLocally();
            updateNotificationBadge();
            renderNotificationsUI();
            if (state.currentTab === 'dashboard') {
                renderMainContent();
            }
        }
    }

    function markAllNotificationsRead() {
        if (state.currentRole === 'student') {
            const relevant = getRelevantNotifications();
            relevant.forEach(n => {
                n.read = true;
                n.readAt = new Date().toISOString();
            });
        } else {
            (state.notifications || []).forEach(n => {
                if (n.targetRole !== 'student') n.read = true;
            });
        }
        saveStateLocally();
        updateNotificationBadge();
        renderNotificationsUI();
        if (state.currentTab === 'dashboard') {
            renderMainContent();
        }
        showToast('All notifications marked as read', 'success');
    }

    function clearAllNotifications() {
        if (state.currentRole === 'student') {
            const relevant = getRelevantNotifications();
            const relevantIds = new Set(relevant.map(n => n.id));
            state.notifications = (state.notifications || []).filter(n => !relevantIds.has(n.id));
        } else {
            // Admin clear all: NEVER delete student fee reminders that have not been seen by the student!
            state.notifications = (state.notifications || []).filter(n => n.targetRole === 'student' && !n.read);
        }
        saveStateLocally();
        updateNotificationBadge();
        renderNotificationsUI();
        if (state.currentTab === 'dashboard') {
            renderMainContent();
        }
        showToast('Notifications updated', 'info');
    }

    function handleNotificationAction(id, actionTab) {
        const notif = (state.notifications || []).find(n => n.id === id);
        if (notif && state.currentRole === 'student') {
            notif.read = true;
            notif.readAt = new Date().toISOString();
            saveStateLocally();
            updateNotificationBadge();
        }
        const dropdown = document.getElementById('notification-dropdown');
        if (dropdown) dropdown.classList.add('hidden');

        if (actionTab === 'fees') {
            if (state.currentRole === 'admin') {
                navigateTo('fees');
            } else if (state.currentRole === 'student') {
                const stuId = (notif && notif.targetStudentId) || (state.currentUser && state.currentUser.id) || state.activeStudentId;
                openStudentFeeDetailsModal(stuId);
            } else {
                showToast('Student fee details are restricted to Admin & Students.', 'warning');
            }
        } else if (actionTab) {
            navigateTo(actionTab);
        }
    }

    // Close notification dropdown when clicking outside
    document.addEventListener('click', function (e) {
        const dropdown = document.getElementById('notification-dropdown');
        const btn = document.getElementById('btn-notifications');
        if (dropdown && !dropdown.classList.contains('hidden')) {
            if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        }
    });

    // Initialize Application
    window.onload = function () {
        initTheme();
        loadCachedData();
        updateRoleUI();
        renderSidebar();
        renderMainContent();
        updateNotificationBadge();
        startNotificationPoller();
        const savedToken = loadAuthSession();
        if (savedToken) loadPortalData(savedToken);

        // Quiet background sync check when returning to window/tab
        window.addEventListener('focus', function () {
            if (state.isAuthenticated && Date.now() - lastPortalDataRefreshAt >= 60000) {
                loadPortalData(state.authToken);
            }
        });
        // Ensure root window and app container never retain unexpected focus-scroll offset
        window.addEventListener('scroll', function () {
            if (window.scrollY !== 0 || window.scrollX !== 0) {
                window.scrollTo(0, 0);
            }
        });
        const appRootEl = document.getElementById('app-root');
        if (appRootEl) {
            appRootEl.addEventListener('scroll', function () {
                if (appRootEl.scrollTop !== 0) appRootEl.scrollTop = 0;
            });
        }
    };
</script>
