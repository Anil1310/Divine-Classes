        function handleUploadMaterial(e) {
            e.preventDefault();
            const fileInput = document.getElementById('mat-file');
            const file = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0] : null;

            const metadata = {
                batchId: document.getElementById('mat-batch').value,
                category: document.getElementById('mat-category').value,
                uploadedBy: document.getElementById('mat-author').value.trim(),
                title: document.getElementById('mat-title').value.trim(),
                description: document.getElementById('mat-desc').value.trim()
            };

            if (!file) {
                showToast('Please choose a PDF/DOC file — the download link is generated from the uploaded file.', 'error');
                return;
            }

            const btn = document.getElementById('btn-publish-material');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Reading file...';
            }
            showToast('Preparing "' + file.name + '" for Google Drive...', 'info');

            const reader = new FileReader();
            reader.onprogress = function (progressEvent) {
                if (btn && progressEvent.lengthComputable) {
                    const percent = Math.round((progressEvent.loaded / progressEvent.total) * 100);
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Reading ' + percent + '%';
                }
            };
            reader.onload = function (evt) {
                const dataUrl = evt.target.result;

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    // Real upload: file → Google Drive, URL → database
                    if (btn) btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Saving to Drive...';
                    showToast('File read. Saving it to Drive now...', 'info');
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (res && res.success && res.material) {
                                state.materials = state.materials.filter(m => m.id !== res.material.id);
                                state.materials.unshift(res.material);

                                // Instant in-app notification (server also persists one for other devices)
                                if (!state.notifications) state.notifications = [];
                                state.notifications = state.notifications.filter(n => n.id !== 'notif_mat_' + res.material.id);
                                state.notifications.unshift({
                                    id: 'notif_mat_' + res.material.id,
                                    title: 'New ' + res.material.category + ' Uploaded',
                                    message: '"' + res.material.title + '" (' + res.material.fileSize + ') is now available in Assignments & DPPs. Download link saved to the database.',
                                    time: 'Just now',
                                    timestamp: Date.now(),
                                    read: false,
                                    adminSeen: false,
                                    type: 'info',
                                    icon: 'fa-file-arrow-up',
                                    iconColor: 'text-indigo-500',
                                    bgColor: 'bg-indigo-100 dark:bg-indigo-950/40',
                                    actionTab: 'materials',
                                    targetRole: 'all',
                                    materialId: res.material.id
                                });

                                saveStateLocally();
                                closeModal();
                                renderMainContent();
                                updateNotificationBadge();
                                checkNewNotificationSound();
                                const folderNote = res.uploadTargetFolder ? ' Saved in the owner\'s Drive folder.' : '';
                                showToast(`"${res.material.title}" uploaded ✓ — link saved in the database.${folderNote}`, 'success');
                            } else {
                                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }
                                showToast('Upload failed: ' + ((res && res.error) || 'unknown server error'), 'error');
                            }
                        })
                        .withFailureHandler(function (err) {
                            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }
                            showToast('Upload failed: ' + (err && err.message ? err.message : String(err)), 'error');
                        })
                        .apiUploadMaterialToDrive(dataUrl, file.name, metadata);
                } else {
                    // Local browser mode: metadata only (no Apps Script backend)
                    const newMat = {
                        id: 'm' + Date.now(),
                        batchId: metadata.batchId,
                        category: metadata.category,
                        uploadedBy: metadata.uploadedBy,
                        title: metadata.title,
                        description: metadata.description,
                        uploadDate: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),

                        downloads: 0
                    };

                    saveStateLocally();
                    closeModal();

                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Material'; }

        function filterMarksBatch(batchId) {
            state.marksBatchFilter = batchId;
            state.selectedTestId = null;
            renderMainContent();
        }

        function selectOfflineTest(testId) {
            state.selectedTestId = testId;
            renderMainContent();
        }

        function saveAllTestMarks(testId) {
            const test = state.offlineTests.find(t => t.id === testId);
            if (!test) { showToast('Test record not found.', 'error'); return; }
            const batch = state.batches.find(b => b.id === test.batchId);
            const bStudentIds = Array.isArray(batch?.studentIds) ? batch.studentIds : (Array.isArray(batch?.student_ids) ? batch.student_ids : []);
            const batchStudents = batch ? (state.students || []).filter(s => s && s.status !== 'Inactive' && (String(s.batchId) === String(batch.id) || bStudentIds.some(id => String(id) === String(s.id) || String(id) === String(s.roll)))) : [];

            if (!test.marks) test.marks = {};
            let count = 0;
            batchStudents.forEach(stu => {
                const sInput = document.getElementById(`score-${stu.id}`);
                const rInput = document.getElementById(`remark-${stu.id}`);
                if (sInput) {
                    let score = parseInt(sInput.value, 10);
                    if (isNaN(score)) score = 0;
                    score = Math.max(0, Math.min(score, test.maxMarks));
                    const remarks = rInput ? rInput.value.trim() : '';
                    test.marks[stu.id] = { score, remarks: remarks || 'Graded' };
                    count++;
                }
            });

            saveStateLocally();
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.apiSyncAllData(state);
            }
            renderMainContent();
            showToast(`Saved marks for ${count} students in "${test.title}"!`, 'success');
        }

        function saveStudentTestMark(testId, studentId) {
            const test = state.offlineTests.find(t => t.id === testId);
            const stu = state.students.find(s => s.id === studentId);
            if (!test || !stu) {
                showToast('Test or student record not found.', 'error');
                return;
            }
            if (state.currentRole !== 'admin' && state.currentRole !== 'developer' && state.currentRole !== 'teacher') {
                showToast('Only teachers and administrators can record offline test marks.', 'error');
                return;
            }
            const scoreVal = parseInt(document.getElementById(`score-${studentId}`).value, 10) || 0;
            const remarkVal = document.getElementById(`remark-${studentId}`).value.trim();

            if (scoreVal > test.maxMarks || scoreVal < 0) {
                showToast(`Marks must be between 0 and ${test.maxMarks}`, 'error');
                return;
            }

            if (!test.marks) test.marks = {};
            test.marks[studentId] = { score: scoreVal, remarks: remarkVal || 'Updated' };
            saveStateLocally();
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.apiSyncAllData(state);
            }
            renderMainContent();
            showToast(`Marks saved for ${stu.name} (${scoreVal}/${test.maxMarks})`, 'success');
        }

        function handleCreateTest(e) {
            e.preventDefault();
            const batchId = document.getElementById('test-batch').value;
            const batch = state.batches.find(b => b.id === batchId);
            if (!batch) {
                showToast('Target batch not found.', 'error');
                return;
            }
            const maxMarks = parseInt(document.getElementById('test-max').value, 10) || 100;
            const rawDate = document.getElementById('test-date').value || localTodayIso();
            const formattedDate = formatDateReadable(rawDate);

            const initialMarks = {};
            const bStudentIds = Array.isArray(batch.studentIds) ? batch.studentIds : (Array.isArray(batch.student_ids) ? batch.student_ids : []);
            const batchStudents = (state.students || []).filter(s => s && s.status !== 'Inactive' && (String(s.batchId) === String(batch.id) || bStudentIds.some(id => String(id) === String(s.id) || String(id) === String(s.roll))));
            batchStudents.forEach(stu => {
                initialMarks[stu.id] = { score: 0, remarks: 'Not graded yet' };
            });

            const newTest = {
                id: 't' + Date.now(),
                batchId,
                title: document.getElementById('test-title').value.trim(),
                subject: document.getElementById('test-subject').value.trim(),
                date: formattedDate,
                maxMarks,
                marks: initialMarks
            };

            if (!Array.isArray(state.offlineTests)) state.offlineTests = [];
            state.offlineTests.unshift(newTest);
            state.selectedTestId = newTest.id;
            state.marksBatchFilter = batchId;
            saveStateLocally();
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.apiSyncAllData(state);
            }
            closeModal();
            renderMainContent();
            showToast(`Offline test "${newTest.title}" created! You can now grade marks.`, 'success');

        function formatDateReadable(isoStr) {
            if (!isoStr) return '';
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const parts = String(isoStr).split('-');
            if (parts.length === 3) {
                const y = parts[0], m = parseInt(parts[1], 10) - 1, d = parts[2];
                return `${d} ${months[m] || ''} ${y}`;
            }
            return isoStr;
        }

        async function ensureHtml2Canvas() {
            if (window.html2canvas) return window.html2canvas;
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                s.onload = () => resolve(window.html2canvas);
                s.onerror = () => reject(new Error('Failed to load html2canvas. Check internet connection.'));
                document.head.appendChild(s);
            });
        }

        async function downloadReportCard(format, studentId) {
            const stu = state.students.find(s => s.id === studentId);
            const card = document.getElementById('student-report-card-container');
            if (!card || !stu) {
                showToast('Report card content not found.', 'error');
                return;
            }
            const safeName = String(stu.name || 'Student').replace(/[^a-z0-9_-]+/gi, '_');

            showToast(`Generating ${format.toUpperCase()} report card...`, 'info');

            try {
                const h2c = await ensureHtml2Canvas();
                const canvas = await h2c(card, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                if (format === 'jpeg') {
                    canvas.toBlob(blob => {
                        if (!blob) throw new Error('Could not create JPEG blob');
                        downloadBlob(blob, `Divine_Classes_Report_${safeName}.jpg`);
                        showToast('Report Card downloaded as high-resolution JPEG!', 'success');
                    }, 'image/jpeg', 0.95);
                } else if (format === 'pdf') {
                    const jpegUrl = canvas.toDataURL('image/jpeg', 0.95);
                    const pdfBlob = buildSingleImagePdf(jpegUrl, canvas.width, canvas.height);
                    downloadBlob(pdfBlob, `Divine_Classes_Report_${safeName}.pdf`);
                    showToast('Report Card downloaded as Digitally Signed PDF!', 'success');
                }
            } catch (err) {
                console.error('Report card download error:', err);
                showToast('Download failed: ' + (err.message || err), 'error');
            }
        }

        async function handleSelfTeacherPhotoPick(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            window.selfTeacherPhotoProcessing = true;
            try {
                window.selfTeacherPhotoData = await processImageUpload(file);
                window.selfTeacherPhotoDirty = true;
                const preview = document.getElementById('self-tch-photo-preview');
                if (preview) preview.innerHTML = `<img src="${window.selfTeacherPhotoData}" alt="Faculty photo preview" class="h-full w-full object-cover">`;
                showToast('Photo ready. Save it to update your faculty profile.', 'success');
            } catch (error) {
                event.target.value = '';
                showToast('Could not process this photo: ' + error, 'error');
            } finally {
                window.selfTeacherPhotoProcessing = false;
            }
        }

        function saveSelfTeacherPhoto(teacherId) {
            if (state.currentRole !== 'teacher' || String(state.activeTeacherId) !== String(teacherId)) {
                showToast('You can update only your own faculty photo.', 'error');
                return;
            }
            if (window.selfTeacherPhotoProcessing) { showToast('Please wait for the photo to finish processing.', 'warning'); return; }
            if (!window.selfTeacherPhotoDirty || !window.selfTeacherPhotoData) { showToast('Choose a photo before saving.', 'warning'); return; }
            const button = document.getElementById('btn-save-self-tch-photo');
            if (button) { button.disabled = true; button.textContent = 'Saving…'; }
            const finish = function(result) {
                if (!result || !result.success) {
                    if (button) { button.disabled = false; button.textContent = 'Save Photo'; }
                    showToast((result && (result.error || result.message)) || 'Could not save your photo. Please try again.', 'error');
                    return;
                }
                const teacher = (state.teachers || []).find(item => String(item.id) === String(teacherId));
                if (teacher) {
                    teacher.photo = result.photo || window.selfTeacherPhotoData;
                    teacher.photoFileId = result.photoFileId || '';
                }
                saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
                closeModal();
                renderMainContent();
                showToast('Your faculty photo has been updated.', 'success');
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(finish).withFailureHandler(function(error) {
                    if (button) { button.disabled = false; button.textContent = 'Save Photo'; }
                    showToast('Could not save photo: ' + (error && error.message ? error.message : String(error)), 'error');
                }).apiUpdateTeacherPhoto(teacherId, window.selfTeacherPhotoData);
            } else {
                finish({ success: true });
            }
        }

        /********************************************************************
         * AUTHENTICATION & ACCESS CONTROL ACTION HANDLERS
         ********************************************************************/
        function toggleStudentStatus(stuId) {
            const stu = state.students.find(s => s.id === stuId);
            if (!stu) return;
            const newStatus = stu.status === 'Blocked' ? 'Active' : 'Blocked';
            stu.status = newStatus;
            saveStateLocally();
            renderMainContent();
            updateRoleUI();

            showToast(`Student ${stu.name} access ${newStatus === 'Active' ? 'Authorized (Active)' : 'Blocked'} immediately!`, newStatus === 'Active' ? 'success' : 'warning');

            if (state.currentRole === 'student' && state.activeStudentId === stuId && newStatus === 'Blocked') {
                showAccessBlockedModal('student', stu.name, stu.roll);
            }

            // Push to Database
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        console.log(`Student ${stu.name} status synced to Database`);
                    })
                    .apiUpdateStudentAuth(stuId, stu.password, newStatus);
            }
        }

        function toggleTeacherStatus(trId) {
            const tr = state.teachers.find(t => t.id === trId);
            if (!tr) return;
            const newStatus = tr.status === 'Blocked' ? 'Active' : 'Blocked';
            tr.status = newStatus;
            saveStateLocally();
            renderMainContent();
            updateRoleUI();

            showToast(`Teacher ${tr.name} access ${newStatus === 'Active' ? 'Authorized (Active)' : 'Blocked'} immediately!`, newStatus === 'Active' ? 'success' : 'warning');

            if (state.currentRole === 'teacher' && state.activeTeacherId === trId && newStatus === 'Blocked') {
                showAccessBlockedModal('teacher', tr.name, tr.email);
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function() {
                        console.log(`Teacher ${tr.name} status synced to Database`);
                    })
                    .apiUpdateTeacherAuth(trId, tr.password, newStatus);
            }
        }

        function openEditPasswordModal(userType, id) {
            const target = userType === 'student' ? state.students.find(s => s.id === id) : state.teachers.find(t => t.id === id);
            if (!target) return;

            const modalHtml = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <div>
                            <h3 class="text-base font-bold text-slate-900 font-heading">Edit Login Password</h3>
                            <p class="text-xs text-slate-500">${target.name} (${userType === 'student' ? target.roll : target.email})</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleSavePassword(event, '${userType}', '${id}')" class="py-4 space-y-4 text-xs">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">New Password *</label>
                        <input type="text" id="edit-pwd-val" value="${target.password || (userType === 'student' ? 'password123' : 'teacher123')}" required minlength="4" class="w-full px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-mono">
                        <p class="text-[11px] text-slate-400 mt-1">This password will be updated directly in the Cloud Database.</p>
                    </div>
                    <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold">Save to Database</button>
                    </div>
                </form>
            `;
            openModal(modalHtml);
        }

        function handleSavePassword(e, userType, id) {
            e.preventDefault();
            const newPwd = document.getElementById('edit-pwd-val').value.trim();
            if (!newPwd) return;

            const target = userType === 'student' ? state.students.find(s => s.id === id) : state.teachers.find(t => t.id === id);
            if (!target) return;
            target.password = newPwd;
            saveStateLocally();
            closeModal();
            renderMainContent();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                if (userType === 'student') {
                    google.script.run
                        .withSuccessHandler(function() { showToast(`Password for ${target.name} updated in the database.`, 'success'); })
                        .apiUpdateStudentAuth(id, newPwd, target.status);
                } else {
                    google.script.run
                        .withSuccessHandler(function() { showToast(`Password for ${target.name} updated in the database.`, 'success'); })
                        .apiUpdateTeacherAuth(id, newPwd, target.status);
                }
            } else {
                showToast(`Password updated for ${target.name} successfully!`, 'success');
            }
        }

        function handleAuthLogin(e) {
            e.preventDefault();
            const pwdInput = document.getElementById('login-password');
            const pwd = pwdInput ? pwdInput.value.trim() : '';
            const rememberInput = document.getElementById('login-remember');
            const rememberMe = rememberInput ? rememberInput.checked : true;
            const idInput = document.getElementById('login-identifier');
            const idVal = idInput ? idInput.value.trim() : '';

            if (!idVal) {
                showToast('Please enter your Login ID (Roll Number, Email or Admin ID).', 'error');
                return;
            }
            if (!pwd) {
                showToast('Please enter your Password.', 'error');
                return;
            }

            const lowerId = idVal.toLowerCase();

            // Developer credentials are checked server-side against Script Properties.
            const isDevLogin = lowerId === 'anil.chahar170@gmail.com';
            if (isDevLogin) {
                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    showToast('Developer sign-in requires a secure server connection.', 'error');
                    return;
                }
                google.script.run
                    .withSuccessHandler(function (result) {
                        if (!result || !result.success) {
                            showToast(result && result.notConfigured ? 'Developer sign-in is not configured on the server yet.' : 'Invalid developer email or password.', 'error');
                            return;
                        }
                        state.isAuthenticated = true;
                        state.currentRole = 'developer';
                        state.isDeveloper = true;
                        state.currentUser = { role: 'developer', name: 'Anil', identifier: 'Lead Dev' };
                        saveAuthSession(rememberMe, idVal, pwd);
                        closeModal();
                        updateRoleUI();
                        renderSidebar();
                        renderMainContent();
                        showToast('Lead Dev sign-in successful.', 'success');
                    })
                    .withFailureHandler(function () { showToast('Developer sign-in could not be verified. Please try again.', 'error'); })
                    .apiVerifyDeveloperLogin(idVal, pwd);
                        closeModal();
                        updateRoleUI();
                        renderSidebar();
                        renderMainContent();
                        showToast('Lead Dev sign-in successful.', 'success');
                    })
                    .withFailureHandler(function () { showToast('Developer sign-in could not be verified. Please try again.', 'error'); })
                    .apiVerifyDeveloperLogin(idVal, pwd);
                return;
            }

            // 1. Admin Login (admin, anil, anil chahar, admin@divineclasses.in)
            const isAdmin = lowerId === 'admin' || lowerId === 'admin@divineclasses.in' || lowerId === 'anil' || lowerId === 'anil chahar';
            if (isAdmin) {
                const adminPwd = (state.settings && state.settings.adminPassword) ? state.settings.adminPassword : 'admin123';

                const adminDisplay = (state.settings && state.settings.adminName) ? state.settings.adminName : 'Administrator';

                state.currentRole = 'admin';

                closeModal();
                updateRoleUI();
                renderSidebar();
                renderMainContent();
                showToast('Welcome, ' + adminDisplay + '!', 'success');
                return;
            }

            // 2. Faculty / Teacher Login (email, phone, or name)
            const tch = state.teachers.find(t => 
                (t.email || '').toLowerCase() === lowerId || 
                (t.phone || '').replace(/[\s+-]/g, '').includes(idVal.replace(/[\s+-]/g, '')) || 
                t.name.toLowerCase() === lowerId
            );
            if (tch) {
                if (tch.status === 'Inactive') {
                    showToast('This faculty account is no longer active in Divine Classes.', 'error');
                    return;
                }
                if (tch.status === 'Blocked') {
                    closeModal();
                    showAccessBlockedModal('teacher', tch.name, tch.email);
                    return;
                }
                const correctPwd = tch.password || 'teacher123';
                if (pwd !== correctPwd) {
                    showToast('Invalid Password for faculty ' + tch.name + '.', 'error');
                    return;
                }
                state.isAuthenticated = true;
                state.currentRole = 'teacher';
                state.isDeveloper = false;
                state.activeTeacherId = tch.id;
                state.currentUser = { role: 'teacher', id: tch.id, name: tch.name, identifier: tch.email };
                saveAuthSession(rememberMe, idVal, pwd);
                closeModal();
                updateRoleUI();
                renderSidebar();
                renderMainContent();
                showToast(`Welcome, ${tch.name}!`, 'success');
                return;
            }

            // 3. Student Login (roll, phone, or name)
            const stu = state.students.find(s => 
                s.roll.toLowerCase() === lowerId || 
                s.phone.replace(/[\s+-]/g, '').includes(idVal.replace(/[\s+-]/g, '')) || 
                s.name.toLowerCase() === lowerId
            );
            if (stu) {
                if (stu.status === 'Inactive') {
                    showToast('This student record is no longer active in Divine Classes.', 'error');
                    return;
                }
                if (stu.status === 'Blocked') {
                    closeModal();
                    showAccessBlockedModal('student', stu.name, stu.roll);
                    return;
                }
                const correctPwd = stu.password || 'password123';
                if (pwd !== correctPwd) {
                    showToast('Invalid Password for ' + stu.name + '.', 'error');
                    return;
                }
                state.isAuthenticated = true;
                state.currentRole = 'student';
                state.isDeveloper = false;
                state.activeStudentId = stu.id;
                state.currentUser = { role: 'student', id: stu.id, name: stu.name, identifier: stu.roll };
                saveAuthSession(rememberMe, idVal, pwd);
                closeModal();
                updateRoleUI();
                renderSidebar();
                renderMainContent();
                updateNotificationBadge();

                // Check for unread fee reminders targeted to this student
                const studentNotifs = getRelevantNotifications();
                const unreadFeeNotifs = studentNotifs.filter(n => !n.read && n.actionTab === 'fees');
                if (unreadFeeNotifs.length > 0) {
                    const balance = stu.totalFee - stu.paidFee;

                    showToast(`Welcome back, ${stu.name}!`, 'success');
                }
                return;

            // Not found
            showToast(`User "${idVal}" not found. Please verify your Roll Number, Email, or Admin ID.`, 'error');
        }

        function openDriveFolder(subfolder) {
            const s = state.settings || {};
            const savedUrl = (s.driveUrl && /^https:\/\//i.test(String(s.driveUrl).trim())) ? String(s.driveUrl).trim() : '';
            const authEmail = String(s.driveEmail || '').trim();

            const finalize = function (baseUrl) {
                let target = baseUrl;
                // Open Google Drive as the saved account session (Google asks for password on ITS own login page)
                if (authEmail && target.indexOf('drive.google.com') !== -1 && target.indexOf('authuser=') === -1) {
                    target += (target.indexOf('?') === -1 ? '?' : '&') + 'authuser=' + encodeURIComponent(authEmail);
                }
                if (authEmail) {
                    showToast('Opening Google Drive as ' + authEmail + ' — complete the Google sign-in on the next tab if prompted.', 'info');
                } else {
                    showToast('Opening Divine Classes Google Drive Storage...', 'info');
                }
                window.open(target, '_blank');
            };

            // 1. Priority: Developer-saved Drive link from Settings
            if (savedUrl && !subfolder) {
                finalize(savedUrl);
                return;
            }

            // 2. Fallback: Portal Drive folder fetched from Google Drive API
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (info) {
                        if (info && info.success && info.rootUrl) {
                            const t = (subfolder && info.folders && info.folders[subfolder]) ? info.folders[subfolder] : info.rootUrl;
                            finalize(t);
                        } else {
                            finalize('https://drive.google.com/drive/my-drive');
                        }
                    })
                    .withFailureHandler(function () {
                        finalize('https://drive.google.com/drive/my-drive');
                    })
                    .apiGetDriveInfo();
            } else {
                finalize('https://drive.google.com/drive/my-drive');
            }
        }

        function createDummyDataAndRecords() {
            if (state.currentRole !== 'developer') {
                showToast('Only the Developer can create demo data and initialize database.', 'error');
                return;
            }
            if (typeof google === 'undefined' || !google.script || !google.script.run) {
                showToast('Open the deployed cloud app to create database records.', 'error');
                return;
            }
            const button = document.getElementById('btn-create-dummy-records');
            if (button) {
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating…';
            }
            const restoreButton = function() {
                const currentButton = document.getElementById('btn-create-dummy-records');
                if (currentButton) {
                    currentButton.disabled = false;
                    currentButton.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Create Dummy Data';
                }
            };
            google.script.run
                .withSuccessHandler(function(result) {
                    restoreButton();
                    if (!result || !result.success) {
                        showToast((result && result.error) || 'Could not create demo data.', 'error');
                        return;
                    }
                    if (!state.settings) state.settings = {};
                    state.settings.dummyDataWiped = false;
                    state.settings.showDummyData = true;
                    if (typeof savePersistentSettingsToLocal === 'function') {
                        savePersistentSettingsToLocal();
                    }
                    showToast('✓ Demo records created and synchronized with Cloud (' + (result.sheetCount || 8) + ' tables updated).', 'success');
                    google.script.run
                        .withSuccessHandler(function(remoteData) {
                            if (remoteData && remoteData.students) {
                                state.batches = remoteData.batches || [];
                                state.students = remoteData.students || [];
                                state.materials = remoteData.materials || [];

        async function executeClearDummyData(btn) {
            if (state.currentRole !== 'developer') {
                showToast('Only the Developer can clear dummy data.', 'error');
                return;
            }

            const originalHtml = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Clearing dummy data…';
            }

            try {
                const dummyStudentIds = new Set();
                (state.students || []).forEach(s => {
                    if (isDummySeedRecord(s)) dummyStudentIds.add(String(s.id));
                });

                // Strip dummy records from client state (externalLinks & settings are strictly preserved)
                state.students = (state.students || []).filter(s => !isDummySeedRecord(s));
                state.batches = (state.batches || []).filter(b => !isDummySeedRecord(b));
                state.materials = (state.materials || []).filter(m => !isDummySeedRecord(m));
                state.offlineTests = (state.offlineTests || []).filter(t => !isDummySeedRecord(t));
                state.teachers = (state.teachers || []).filter(tr => !isDummySeedRecord(tr));
                state.gallery = (state.gallery || []).filter(g => !isDummySeedRecord(g));
                state.feedbacks = (state.feedbacks || []).filter(f => !isDummySeedRecord(f));
                state.notifications = [];
                if (typeof updateNotificationBadge === 'function') {
                    updateNotificationBadge();
                }

                // Clean references in remaining client batches
                state.batches.forEach(b => {
                    if (Array.isArray(b.studentIds)) {
                        b.studentIds = b.studentIds.filter(sid => !dummyStudentIds.has(String(sid)));
                    }
                });

                // Clean references in remaining client offline tests
                state.offlineTests.forEach(t => {
                    if (t && t.marks && typeof t.marks === 'object') {
                        dummyStudentIds.forEach(sid => { delete t.marks[sid]; });
                    }
                });

                // If activeStudentId was a dummy student, point to first remaining student
                if (dummyStudentIds.has(String(state.activeStudentId))) {
                    const firstActive = state.students.find(s => s.status !== 'Inactive') || state.students[0];
                    state.activeStudentId = firstActive ? firstActive.id : null;
                }

                if (!state.settings) state.settings = {};
                state.settings.showDummyData = false;
                state.settings.dummyDataWiped = true;

                saveStateLocally();
                savePersistentSettingsToLocal();

                // 1. Clear dummy records from Supabase
                if (typeof supabaseClearDummyData === 'function') {
                    await supabaseClearDummyData().catch(e => console.warn('Supabase dummy clear notice:', e));
                }

                // 2. Clear dummy records from Google Sheets & Primary Cloud Database
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function(res) {
                            closeModal();
                            updateRoleUI();
                            renderSidebar();
                            renderMainContent();
                            showToast('✓ All dummy data permanently cleared from Cloud! Real client records, study links & settings preserved.', 'success');
                        })
                        .withFailureHandler(function(err) {
                            closeModal();
                            updateRoleUI();
                            renderSidebar();
                            renderMainContent();
                            showToast('Local & Cloud dummy data cleared. Cloud sync notice: ' + (err.message || err), 'warning');
                        })
                        .apiPermanentClearDummyData();
                } else {
                    closeModal();
                    updateRoleUI();
                    renderSidebar();
                    renderMainContent();
                    showToast('✓ All dummy data cleared! Real client records, study links & settings preserved.', 'success');
                }
            } catch (err) {
                closeModal();
                showToast('Error clearing dummy data: ' + (err.message || err), 'error');
            }
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            if (state.currentRole !== 'developer') {
                showToast('Only the Developer can change settings.', 'error');
                return;
            }
            if (!state.settings) state.settings = {};
            const keys = ['instituteName', 'tagline', 'address', 'phone', 'contactDisplay', 'email', 'upiId', 'facebookUrl', 'instagramUrl', 'youtubeUrl', 'adminName', 'adminPassword', 'adminEmail', 'showRequirementLabels', 'allowAdminFeedbackDelete', 'allowAdminLinkDelete', 'showDummyData', 'sheetsMirrorEnabled', 'supabaseEnabled', 'supabaseUrl', 'supabaseKey', 'driveFolderUrl', 'driveEmail', 'drivePassword', 'driveUrl'];
            keys.forEach(function (k) {
                const el = document.getElementById('set-' + k);
                if (el) {
                    if (el.type === 'checkbox') {
                        state.settings[k] = el.checked;
                        return;
                    }
                    let v = el.value.trim();
                    // Safety: Drive links must be real https URLs
                    if ((k === 'driveUrl' || k === 'driveFolderUrl') && v && !/^https:\/\//i.test(v)) {
                        showToast('Drive link must start with https:// — ' + (k === 'driveFolderUrl' ? 'owner folder' : 'drive') + ' link not saved.', 'error');
                        return;
                    }
                    if (k === 'driveFolderUrl' && v && !/drive\.google\.com/i.test(v)) {
                        showToast('That does not look like a Google Drive folder link (drive.google.com). Paste the folder link and try again.', 'warning');
                        return;
                    }
                    if (v) state.settings[k] = v;
                }
            });

            const form = e.currentTarget;
            if (form && form.dataset.saving === 'true') return;
            if (form) form.dataset.saving = 'true';
            const saveButton = form && form.querySelector('button[type="submit"]');
            const originalButtonHtml = saveButton ? saveButton.innerHTML : '';
            const mainScrollContainer = document.getElementById('main-content');
            const sidebarScrollContainer = document.getElementById('sidebar');
            const savedMainScrollTop = form && form.dataset.savedScrollTop !== undefined
                ? Number(form.dataset.savedScrollTop)
                : (mainScrollContainer ? mainScrollContainer.scrollTop : 0);
            const savedSidebarScrollTop = form && form.dataset.savedSidebarScrollTop !== undefined
                ? Number(form.dataset.savedSidebarScrollTop)
                : (sidebarScrollContainer ? sidebarScrollContainer.scrollTop : 0);
            if (form) {
                delete form.dataset.savedScrollTop;
                delete form.dataset.savedSidebarScrollTop;
            }
            const preserveSettingsScroll = function() {
                requestAnimationFrame(function() {
                    if (mainScrollContainer) mainScrollContainer.scrollTop = savedMainScrollTop;
                    if (sidebarScrollContainer) sidebarScrollContainer.scrollTop = savedSidebarScrollTop;
                });
            };
            if (saveButton) {
                saveButton.setAttribute('aria-busy', 'true');
                saveButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
            }
            preserveSettingsScroll();
            saveStateLocally();
            savePersistentSettingsToLocal();
            // Also save Supabase config to dedicated localStorage key (survives cache clears)
            saveSupabaseConfigToLocal();
            if (typeof supabaseSyncSettings === 'function') supabaseSyncSettings(state.settings);
            if (typeof autoSyncToSupabase === 'function') autoSyncToSupabase();
            updateRoleUI();
            renderSidebar();
            const restoreSaveButton = function() {
                if (form) delete form.dataset.saving;
                if (saveButton) {
                    saveButton.removeAttribute('aria-busy');
                    saveButton.innerHTML = originalButtonHtml;
                }
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (result) {
                        restoreSaveButton();
                        if (result && result.success === false) {
                            showToast(result.error || 'Settings could not be synced. Your changes are saved in this browser.', 'error');
                            return;
                        }
                        showToast('Settings saved and synced.', 'success');
                    })
                    .withFailureHandler(function (error) {
                        restoreSaveButton();
                        showToast('Settings saved in this browser, but cloud sync failed: ' + ((error && error.message) || 'Please try again.'), 'error');
                    })
                    .apiSyncAllData(state);
            } else {
                restoreSaveButton();
                showToast('Settings saved in this browser.', 'success');
            }
        }

         * NOTIFICATIONS & THEME ENGINE (LIGHT & DARK MODE)
         ********************************************************************/
        const defaultNotifications = [];

        /* --- THEME ENGINE --- */
        function initTheme() {
            const savedTheme = localStorage.getItem('DIVINE_THEME');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const targetTheme = isDark ? 'light' : 'dark';
            applyTheme(targetTheme);
            localStorage.setItem('DIVINE_THEME', targetTheme);
            showToast(`Switched to ${targetTheme === 'dark' ? 'Dark 🌙' : 'Light ☀️'} Theme`, 'info');
        }

        function applyTheme(theme) {
            const icon = document.getElementById('theme-toggle-icon');
            const label = document.getElementById('theme-toggle-label');
            const btn = document.getElementById('btn-theme-toggle');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                if (icon) {
                    icon.className = 'fa-solid fa-sun text-amber-400 text-sm';
                }
                if (label) {
                    label.textContent = 'Light';
                }
                if (btn) {
                    btn.title = 'Switch to Light Theme (Current: Dark)';
                }
            } else {
                document.documentElement.classList.remove('dark');
                if (icon) {
                    icon.className = 'fa-solid fa-moon text-indigo-600 text-sm';
                }
                if (label) {
                    label.textContent = 'Dark';
                }
                if (btn) {
                    btn.title = 'Switch to Dark Theme (Current: Light)';
                }
            }
        }

        /* --- NOTIFICATION SOUND & REAL-TIME POLLER --- */
        let notifAudioCtx = null;
        let notifSoundBaseline = null;
        let notifSoundSessionActive = false;
        let notifPollTimer = null;

        function isNotifSoundMuted() {
            try { return localStorage.getItem('dc_notif_sound_muted') === '1'; } catch (e) { return false; }
        }

        function toggleNotifSound() {
            const muted = !isNotifSoundMuted();
            try { localStorage.setItem('dc_notif_sound_muted', muted ? '1' : '0'); } catch (e) {}
            showToast(muted ? 'Notification sound muted 🔕' : 'Notification sound enabled 🔔', 'info');
            renderNotificationsUI();
        }

        function playNotificationSound() {
            if (isNotifSoundMuted()) return;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                if (!notifAudioCtx) notifAudioCtx = new AC();
                if (notifAudioCtx.state === 'suspended') notifAudioCtx.resume();
                const ctx = notifAudioCtx;
                const now = ctx.currentTime;
                // Pleasant two-note ascending chime (A5 → E6)
                [[880, 0], [1174.66, 0.13]].forEach(function (pair) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = pair[0];
                    gain.gain.setValueAtTime(0.0001, now + pair[1]);
                    gain.gain.exponentialRampToValueAtTime(0.22, now + pair[1] + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + pair[1] + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + pair[1]);
                    osc.stop(now + pair[1] + 0.55);
                });
            } catch (e) {
                console.warn('Notification sound failed:', e);
            }
        }

        // Plays a chime only for notifications that appeared AFTER login/sync
        // (never fires for ones already present when the session starts).
        function checkNewNotificationSound() {
            if (!state.isAuthenticated) {
                notifSoundSessionActive = false;
                notifSoundBaseline = null;
                return;
            }
            const current = getRelevantNotifications();
            if (!notifSoundSessionActive || !notifSoundBaseline) {
                notifSoundBaseline = new Set(current.map(function (n) { return n.id; }));
                notifSoundSessionActive = true;
                return;
            }
            const fresh = current.filter(function (n) { return !notifSoundBaseline.has(n.id); });
            current.forEach(function (n) { notifSoundBaseline.add(n.id); });
            if (fresh.length > 0) {
                playNotificationSound();
                updateNotificationBadge();
                showToast('🔔 New: ' + fresh[0].title, 'info');
            }
        }

        function pollNotifications() {
            if (!state.isAuthenticated || typeof google === 'undefined' || !google.script || !google.script.run) return;
            google.script.run
                .withSuccessHandler(function (remoteNotifs) {
                    if (!Array.isArray(remoteNotifs)) return;
                    const map = new Map();
                    (state.notifications || []).forEach(function (n) { if (n && n.id) map.set(n.id, n); });
                    remoteNotifs.forEach(function (n) {
                        if (n && n.id && (n.id.startsWith('notif_fee_') || n.id.startsWith('notif_mat_') || n.id.startsWith('monthly_fee_'))) {
                            if (!map.has(n.id)) map.set(n.id, n);
                            else map.set(n.id, Object.assign({}, n, map.get(n.id)));
                        }
                    });
                    state.notifications = Array.from(map.values());
                    checkNewNotificationSound();
                    updateNotificationBadge();
                    const dd = document.getElementById('notification-dropdown');
                    if (dd && !dd.classList.contains('hidden')) renderNotificationsUI();
                })
                .withFailureHandler(function () {})
                .apiGetNotifications();
        }

        function startNotificationPoller() {
            if (notifPollTimer) return;
            notifPollTimer = setInterval(pollNotifications, 20000);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) pollNotifications();
            });
        }

        /* --- NOTIFICATION CENTER --- */
        let currentNotificationFilter = 'all';

        function toggleNotificationDropdown() {
            const dropdown = document.getElementById('notification-dropdown');
            if (!dropdown) return;
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                // If a STUDENT is opening the dropdown, mark their notifications as read!
                // If ADMIN is opening, student fee notices MUST REMAIN UNREAD (pending student view) until the student opens them!
                if (state.currentRole === 'student') {
                    const relevant = getRelevantNotifications();
                    let changed = false;
                    relevant.forEach(n => {
                        if (!n.read) {
                            n.read = true;
                            n.readAt = new Date().toISOString();
                            changed = true;
                        }
                    });
                    if (changed) {
                        saveStateLocally();
                        updateNotificationBadge();
                        if (state.currentTab === 'dashboard') {
                            renderMainContent();
                        }
                    }
                } else if (state.currentRole === 'admin') {
                    // Admin opens dropdown: mark as seen by admin so admin's badge clears to 0, while student's n.read stays protected!
                    let adminChanged = false;
                    (state.notifications || []).forEach(n => {
                        if (n.adminSeen === false) {
                            n.adminSeen = true;
                            adminChanged = true;
                        }
                    });
                    if (adminChanged) {
                        saveStateLocally();
                        updateNotificationBadge();
                    }
                }
                renderNotificationsUI();
            } else {
                dropdown.classList.add('hidden');
            }
        }

        function getRelevantNotifications() {
            const allNotifs = state.notifications || [];
            // Rewrite older saved notification copy so the portal consistently
            // describes the data store as the database.
            allNotifs.forEach(n => {
                if (n && typeof n.message === 'string') {
                    n.message = n.message.replace(/Google Sheets?/gi, 'Cloud').replace(/spreadsheets?/gi, 'Cloud').replace(/Supabase/gi, 'Cloud').replace(/GSheet/gi, 'Cloud');
                }
            });
            if (state.currentRole === 'admin') {
                return allNotifs;
            } else if (state.currentRole === 'teacher') {
                return allNotifs.filter(n => !n.targetRole || n.targetRole === 'teacher' || n.targetRole === 'all');
            } else {
                // Student / Developer mode: personal notices (fee reminders) + institute-wide alerts (new materials)
                const curId = (state.currentUser && state.currentUser.id) || state.activeStudentId;
                const curRoll = (state.currentUser && state.currentUser.identifier) || '';
                return allNotifs.filter(n => {
                    if (n.targetRole === 'all') return true;
                    if (n.targetStudentId && n.targetStudentId === curId) return true;
                    if (n.targetRoll && curRoll && n.targetRoll.toLowerCase() === curRoll.toLowerCase()) return true;
                    return false;
                });
            }
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notification-badge');
            if (!badge) return;
            if (state.currentRole === 'student') {
                const notifs = getRelevantNotifications();
                const unreadCount = notifs.filter(n => !n.read).length;
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.classList.remove('hidden');
                } else {
                    badge.textContent = '0';
                    badge.classList.add('hidden');
                }
            } else if (state.currentRole === 'admin') {
                // Admin: show badge for newly added fee reminders / notifications until admin views them
                const unreadForAdmin = (state.notifications || []).filter(n => n.adminSeen === false).length;
                if (unreadForAdmin > 0) {
                    badge.textContent = unreadForAdmin;
                    badge.classList.remove('hidden');
                } else {
                    badge.textContent = '0';
                    badge.classList.add('hidden');
                }
            } else {
                // Teacher/Developer: badge alerts for unread staff or institute-wide (all) notifications
                const staffNotifs = (state.notifications || []).filter(n => (n.targetRole === state.currentRole || n.targetRole === 'staff' || n.targetRole === 'all') && !n.read);
                if (staffNotifs.length > 0) {
                    badge.textContent = staffNotifs.length;
                    badge.classList.remove('hidden');
                } else {
                    badge.textContent = '0';
                    badge.classList.add('hidden');
                }
            }
        }

        function renderNotificationsUI(filter) {
            if (filter) currentNotificationFilter = filter;
            const dropdown = document.getElementById('notification-dropdown');
            if (!dropdown) return;

            const notifs = getRelevantNotifications();

            if (currentNotificationFilter === 'unread') {
                displayed = notifs.filter(n => !n.read);

            dropdown.innerHTML = `

                        <i class="fa-solid fa-bell text-amber-500"></i>

                        ${unreadCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-200">${unreadCount} ${state.currentRole === 'student' ? 'New' : 'Pending Student View'}</span>` : `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-200">0 Unread</span>`}
                    </div>
                    <div class="flex items-center gap-2">
                        ${state.currentRole === 'student' ? `
                            <button onclick="markAllNotificationsRead()" class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 hover:underline">
                                Mark all read
                            </button>
                        ` : ''}
                        <button onclick="toggleNotifSound()" title="${isNotifSoundMuted() ? 'Enable notification sound' : 'Mute notification sound'}" class="p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Toggle notification sound">
                            <i class="fa-solid ${isNotifSoundMuted() ? 'fa-volume-xmark text-slate-400' : 'fa-volume-high text-amber-500'} text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="px-3 pt-2 pb-1 border-b border-slate-100 dark:border-slate-700/60 flex items-center gap-1.5 text-[11px]">
                    <button onclick="renderNotificationsUI('all')" class="px-2.5 py-1 rounded-lg font-semibold transition ${currentNotificationFilter === 'all' ? 'bg-indigo-600 text-white shadow-2xs' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                        All (${notifs.length})
                    </button>
                    <button onclick="renderNotificationsUI('unread')" class="px-2.5 py-1 rounded-lg font-semibold transition ${currentNotificationFilter === 'unread' ? 'bg-indigo-600 text-white shadow-2xs' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                        Unread (${unreadCount})
                    </button>
                    <button onclick="renderNotificationsUI('alerts')" class="px-2.5 py-1 rounded-lg font-semibold transition ${currentNotificationFilter === 'alerts' ? 'bg-indigo-600 text-white shadow-2xs' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                        Alerts
                    </button>
                </div>

                <!-- Notifications List -->
                <div class="max-h-72 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50">
                    ${displayed.length === 0 ? `
                        <div class="p-6 text-center text-slate-400 text-xs">
                            <i class="fa-solid fa-circle-check text-2xl text-emerald-500 mb-2 block"></i>
                            No notifications in this view (0 unread)
                        </div>
                    ` : displayed.map(n => `
                        <div class="p-3 transition hover:bg-slate-50 dark:hover:bg-slate-800/60 flex items-start gap-3 relative ${!n.read ? 'bg-indigo-50/40 dark:bg-indigo-950/20' : ''}">
                            <div class="w-8 h-8 rounded-xl ${n.bgColor || 'bg-slate-100'} ${n.iconColor || 'text-slate-700'} flex items-center justify-center shrink-0 text-xs shadow-2xs mt-0.5">

                                <div class="flex items-center justify-between gap-1">
                                    <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100 truncate">${escapeHtml(n.title)}</h4>
                                    <span class="text-[10px] text-slate-400 shrink-0">${escapeHtml(n.time)}</span>
                                </div>
                                <p class="text-[11px] text-slate-600 dark:text-slate-300 line-clamp-2 mt-0.5 leading-snug">${escapeHtml(n.message)}</p>
                                <div class="mt-2 flex items-center justify-between gap-2">
                                    ${state.currentRole === 'student' ? `
                                        <button onclick="handleNotificationAction('${n.id}', '${n.actionTab}')" class="text-[11px] font-bold text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 flex items-center gap-1 hover:underline">

                                                    <i class="fa-solid fa-check"></i>
                                                </button>
                                            ` : ''}
                                            <button onclick="dismissNotification('${n.id}')" title="Remove notification" class="text-[10px] text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 p-1">

                                            </button>
                                        </div>
                                    ` : `
                                        <div class="flex items-center gap-2">
                                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${n.read ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'}">
                                                ${n.actionTab === 'materials' ? (n.read ? '✓ Opened' : '⏳ New Material') : (n.read ? '✓ Seen by Student' : '⏳ Pending Student View')}
                                            </span>
                                            ${n.actionTab === 'materials' ? `
                                                <button onclick="handleNotificationAction('${n.id}', 'materials')" class="text-[11px] font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
                                                    View in Assignments
                                                </button>
                                            ` : `
                                                <button onclick="navigateTo('fees')" class="text-[11px] font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
