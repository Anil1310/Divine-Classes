            if (str === null || str === undefined) return '';
            return String(str)

                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');

        const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
        const TEN_DAYS_MS = 10 * 24 * 60 * 60 * 1000; // 10 days for Remember Me credentials
        const INACTIVITY_TIMEOUT_MS = 2 * 60 * 60 * 1000; // 2 hours of inactivity auto-logout

        function escapeAttr(str) {
            return (str || '').toString().replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        let _lastActivityRecorded = Date.now();
        let _inactivityTimer = null;

        function recordUserActivity() {
            _lastActivityRecorded = Date.now();
            try {
                localStorage.setItem('DIVINE_LAST_ACTIVITY', String(_lastActivityRecorded));
            } catch (e) {}
        }

        function checkInactivityTimeout() {
            if (!state.isAuthenticated) return;
            let lastAct = _lastActivityRecorded;
            try {
                const stored = parseInt(localStorage.getItem('DIVINE_LAST_ACTIVITY') || '0', 10);
                if (stored && stored > lastAct) lastAct = stored;
            } catch (e) {}
            if (Date.now() - lastAct >= INACTIVITY_TIMEOUT_MS) {
                console.warn('[Auth] Automatically logged out after 2 hours of inactivity (Browser & Mobile APK).');
                try {
                    localStorage.removeItem('DIVINE_AUTH_SESSION');
                    sessionStorage.removeItem('DIVINE_AUTH_SESSION');
                    localStorage.removeItem('DIVINE_LAST_ACTIVITY');
                } catch(e) {}
                state.isAuthenticated = false;
                state.currentUser = null;

                renderAuthHeader();

                showToast('Logged out due to 2 hours of inactivity.', 'info');
            }
        }

        function initInactivityTracker() {
            if (window._inactivityTrackerInitialized) return;
            window._inactivityTrackerInitialized = true;
            recordUserActivity();
            const activityEvents = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'touchmove', 'scroll', 'click'];
            let throttleTimer = null;
            function onUserInteraction() {
                if (!throttleTimer) {
                    throttleTimer = setTimeout(function() {
                        recordUserActivity();
                        throttleTimer = null;
                    }, 5000);
                }
            }
            activityEvents.forEach(function(evt) {
                window.addEventListener(evt, onUserInteraction, { passive: true });
            });
            if (_inactivityTimer) clearInterval(_inactivityTimer);
            _inactivityTimer = setInterval(checkInactivityTimeout, 30000);
        }

        function getSavedCredentials() {
            try {
                const raw = localStorage.getItem('DIVINE_SAVED_CREDS');
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data && data.expiresAt && Date.now() <= data.expiresAt) {
                        return {
                            identifier: data.identifier || '',
                            password: data.password || ''
                        };
                    }
                    // Expired after 10 days
                    localStorage.removeItem('DIVINE_SAVED_CREDS');
                }
            } catch (e) {
                console.warn('Could not read saved credentials', e);
            }
            return { identifier: '', password: '' };
        }

        function saveAuthSession(rememberMe, identifier, password) {
            try {
                const expiresAt = Date.now() + THIRTY_DAYS_MS;
                if (state.isAuthenticated && state.currentUser) {
                    const sessData = JSON.stringify({
                        isAuthenticated: true,
                        role: state.currentRole,
                        userId: state.currentUser.id || null,
                        userName: state.currentUser.name,
                        identifier: state.currentUser.identifier,
                        remember: !!rememberMe,
                        expiresAt: expiresAt
                    });
                    if (rememberMe) {
                        localStorage.setItem('DIVINE_AUTH_SESSION', sessData);
                        sessionStorage.removeItem('DIVINE_AUTH_SESSION');
                    } else {
                        sessionStorage.setItem('DIVINE_AUTH_SESSION', sessData);
                        localStorage.removeItem('DIVINE_AUTH_SESSION');
                    }
                }
                // 10-day Credential Remember (compatible with Browser & Mobile APK WebView)
                if (rememberMe && (identifier || password)) {
                    const credData = JSON.stringify({
                        identifier: identifier || '',
                        password: password || '',
                        expiresAt: Date.now() + TEN_DAYS_MS
                    });
                    localStorage.setItem('DIVINE_SAVED_CREDS', credData);
                } else if (!rememberMe) {
                    localStorage.removeItem('DIVINE_SAVED_CREDS');
                }
                recordUserActivity();
            } catch (e) {
                console.warn('Could not save auth session', e);
            }
        }

        function loadAuthSession() {
            try {
                // Check 2-hour inactivity before restoring session
                const lastAct = parseInt(localStorage.getItem('DIVINE_LAST_ACTIVITY') || '0', 10);
                if (lastAct && (Date.now() - lastAct >= INACTIVITY_TIMEOUT_MS)) {
                    console.log('[Auth] Prior session expired due to 2 hours of inactivity.');
                    localStorage.removeItem('DIVINE_AUTH_SESSION');
                    sessionStorage.removeItem('DIVINE_AUTH_SESSION');
                    return;
                }

                let saved = sessionStorage.getItem('DIVINE_AUTH_SESSION');
                if (!saved) {
                    saved = localStorage.getItem('DIVINE_AUTH_SESSION');
                }
                if (saved) {
                    const sess = JSON.parse(saved);
                    // Check if 30-day session has expired
                    if (sess && sess.expiresAt && Date.now() > sess.expiresAt) {
                        localStorage.removeItem('DIVINE_AUTH_SESSION');
                        sessionStorage.removeItem('DIVINE_AUTH_SESSION');
                        return;
                    }
                    if (sess && sess.isAuthenticated) {
                        recordUserActivity();
                        if (sess.role === 'developer') {
                            state.isAuthenticated = true;
                            state.currentRole = 'developer';
                            state.isDeveloper = true;
                            state.currentUser = { role: 'developer', name: 'Anil', identifier: 'Lead Dev' };
                        } else if (sess.role === 'admin') {
                            state.isAuthenticated = true;
                            state.currentRole = 'admin';
                            state.isDeveloper = false;
                            state.currentUser = { role: 'admin', name: sess.userName || 'Administrator', identifier: 'Admin Master' };
                        } else if (sess.role === 'teacher') {
                            state.isDeveloper = false;
                            const tch = state.teachers.find(t => t.id === sess.userId) || state.teachers[0];
                            if (tch && tch.status !== 'Blocked' && tch.status !== 'Inactive') {
                                state.isAuthenticated = true;
                                state.currentRole = 'teacher';
                                state.activeTeacherId = tch.id;
                                state.currentUser = { role: 'teacher', id: tch.id, name: tch.name, identifier: tch.email };
                            }
                        } else if (sess.role === 'student') {
                            state.isDeveloper = false;
                            const stu = state.students.find(s => s.id === sess.userId) || state.students[0];
                            if (stu && stu.status !== 'Blocked' && stu.status !== 'Inactive') {
                                state.isAuthenticated = true;
                                state.currentRole = 'student';
                                state.activeStudentId = stu.id;
                                state.currentUser = { role: 'student', id: stu.id, name: stu.name, identifier: stu.roll };
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('Could not load auth session', e);
            }
        }

        function showCurrentUserDetails() {
            const user = state.currentUser;
            if (!state.isAuthenticated || !user) return;

            const roleNames = { admin: 'Administrator', developer: 'Lead Dev', teacher: 'Teacher', student: 'Student' };
            const details = [['Login ID', user.identifier]];
            let summaryLabel = roleNames[user.role] || 'Account';
            let summaryValue = user.name || 'Active';
            let summaryNote = user.identifier || 'Active account';
            let summaryIcon = 'fa-user';

            if (user.role === 'student') {
                const student = (state.students || []).find(item => String(item.id) === String(user.id || state.activeStudentId));
                if (student) {
                    const batches = (state.batches || []).filter(batch => (batch.studentIds || []).some(id => String(id) === String(student.id) || String(id) === String(student.roll))).map(batch => batch.name);
                    details.push(['Mobile', student.phone], ['Parent / Guardian', student.parentName], ['Batch', batches.join(', ')], ['Status', student.status]);
                    const balance = Math.max(0, Number(student.totalFee || 0) - Number(student.paidFee || 0));
                    summaryLabel = balance ? 'Pending fees' : 'Fee status';
                    summaryValue = balance ? `₹${balance.toLocaleString('en-IN')}` : 'All clear';
                    summaryNote = `${student.name} · ${student.roll}`;
                    summaryIcon = 'fa-indian-rupee-sign';
                }
            } else if (user.role === 'teacher') {
                const teacher = (state.teachers || []).find(item => String(item.id) === String(user.id || state.activeTeacherId));
                if (teacher) {
                    details.push(['Email', teacher.email], ['Mobile', teacher.phone], ['Subject', teacher.subject], ['Qualification', teacher.qualification], ['Experience', teacher.experience], ['Status', teacher.status]);

                    summaryValue = teacher.name || user.name || 'Faculty';
                    summaryNote = teacher.subject || teacher.experience || user.identifier || 'Active faculty account';

                summaryValue = user.name || 'Administrator';
                summaryNote = (state.settings && state.settings.adminEmail) || 'Administrator account';
                summaryIcon = 'fa-user-tie';

                summaryLabel = 'System access';
                summaryValue = user.name || 'Anil';
                summaryNote = user.identifier || 'Developer account';
                summaryIcon = 'fa-user-gear';

        function changeActiveStudent(studentId) {
            if (state.currentRole === 'student' && String(studentId) !== String(state.activeStudentId)) {
                showToast('You can view only your own student portal.', 'error');
                return;
            }
            state.activeStudentId = studentId;
            const s = state.students.find(st => st.id === studentId);
            if (s && s.status === 'Blocked') {
                showAccessBlockedModal('student', s.name, s.roll);
            } else if (s) {
                showToast(`Now viewing portal as ${s.name} (${s.roll})`, 'info');
            }
            updateRoleUI();
            renderMainContent();

        function navigateTo(tabId) {
            if (tabId === 'fees' && state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Access Denied! Student fees are visible ONLY to Admin.', 'error');
                return;
            }
            if (tabId === 'access' && state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Access Denied! Access Control is restricted to Admin.', 'error');
                return;
            }
            if (tabId === 'settings' && state.currentRole !== 'developer') {
                showToast('Access Denied! Institute Settings are visible ONLY to the Developer role.', 'error');
                return;
            }
            state.activeTab = tabId;
            renderSidebar();
            renderMainContent();
            // Close mobile sidebar if open
            if (window.innerWidth < 1024) {
                const sb = document.getElementById('sidebar');
                if (sb && !sb.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            if (!sb) return;
            if (window.innerWidth >= 1024) {
                sb.classList.toggle('lg:hidden');
            } else {
                sb.classList.toggle('-translate-x-full');
                if (bd) bd.classList.toggle('hidden');
            }
        }
        window.toggleSidebar = toggleSidebar;
        window.toggleMobileSidebar = toggleSidebar;

        function toggleSidebarSubmenu(groupId) {
            const menu = document.getElementById('sidebar-submenu-' + groupId);
            const button = document.getElementById('sidebar-menu-' + groupId);
            if (!menu || !button) return;
            const open = menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !open);
            button.setAttribute('aria-expanded', String(open));
            const arrow = button.querySelector('.sidebar-menu-arrow');
            if (arrow) arrow.classList.toggle('rotate-180', open);
            if (!window.sidebarSubmenuState) window.sidebarSubmenuState = {};
            window.sidebarSubmenuState[groupId] = open;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            const navContainer = document.getElementById('nav-links');
            if (!state.isAuthenticated) {
                if (sidebar) sidebar.style.display = 'none';
                if (navContainer) navContainer.innerHTML = '';
                const primaryLinks = document.getElementById('primary-menu-links');
                if (primaryLinks) primaryLinks.innerHTML = '';
                return;
            }
            if (sidebar) sidebar.style.display = '';
            if (!navContainer) return;

            // Rebuilding the navigation can reset its own scroll position. Keep
            // the sidebar where the user left it when switching pages (including
            // opening Settings), and restore after the browser has laid out the
            // replacement buttons.
            const navScrollTop = navContainer.scrollTop;

            // Developer sees every Admin tab plus Settings.
            const allowedItems = navItems.filter(item =>
                item.roles.includes(state.currentRole) ||
                (state.currentRole === 'developer' && (item.roles.includes('admin') || item.roles.includes('developer')))
            );

            try {
                if (!window.sidebarSubmenuState) window.sidebarSubmenuState = {};
                const activeGroup = sidebarNavigationGroups.find(group => group.items.includes(state.activeTab));
                if (activeGroup) window.sidebarSubmenuState[activeGroup.id] = true;
                const renderNavItem = item => {
                    const active = state.activeTab === item.id;
                    return `<button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition group ${active ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'}"><i class="fa-solid ${item.icon} w-5 text-center shrink-0 ${active ? 'text-white' : 'text-slate-400 group-hover:text-indigo-400'}"></i><span class="text-left whitespace-normal leading-snug">${item.label}</span></button>`;
                };
                navContainer.innerHTML = sidebarNavigationGroups.map(group => {
                    const groupItems = allowedItems.filter(item => group.items.includes(item.id));
                    if (!groupItems.length) return '';
                    const open = window.sidebarSubmenuState[group.id] === true || groupItems.some(item => item.id === state.activeTab);
                    window.sidebarSubmenuState[group.id] = open;
                    return `<section class="mb-2"><button id="sidebar-menu-${group.id}" type="button" onclick="toggleSidebarSubmenu('${group.id}')" aria-expanded="${open}" aria-controls="sidebar-submenu-${group.id}" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[10px] font-bold tracking-wider text-slate-400 hover:text-white hover:bg-slate-800/70 transition"><span>${group.label}</span><i class="fa-solid fa-chevron-down sidebar-menu-arrow text-[9px] transition-transform ${open ? 'rotate-180' : ''}"></i></button><div id="sidebar-submenu-${group.id}" class="space-y-1 px-1 ${open ? '' : 'hidden'}">${groupItems.map(renderNavItem).join('')}</div></section>`;
                }).join('');
            } catch (menuError) {
                console.error('Sidebar menu fallback:', menuError);
                navContainer.innerHTML = allowedItems.map(item => `<button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800/80 hover:text-white"><i class="fa-solid ${item.icon} w-5 text-center shrink-0"></i><span class="text-left whitespace-normal leading-snug">${item.label}</span></button>`).join('');
            }

            const primaryLinks = document.getElementById('primary-menu-links');
            if (primaryLinks) {
                primaryLinks.innerHTML = allowedItems.filter(item => primaryMenuIds.includes(item.id)).map(item => {
                    const active = state.activeTab === item.id;
                    return `<button type="button" onclick="navigateTo('${item.id}')" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition ${active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}" ${active ? 'aria-current="page"' : ''}><i class="fa-solid ${item.icon}"></i><span>${item.label}</span></button>`;
                }).join('');
            }
            navContainer.scrollTop = navScrollTop;
            requestAnimationFrame(() => {
                if (navContainer.isConnected) navContainer.scrollTop = navScrollTop;
            });
        }

                </footer>

            try { normalizeAppCollections(); } catch (e) { console.warn('normalizeAppCollections error:', e); }
            try {

            if (!state.isAuthenticated) {

                if (subtitleEl) subtitleEl.textContent = 'Sign in with your credentials to access Student, Faculty, or Administrative tools';

                return;
            }

            const titles = {
                dashboard: ['Institute Overview Dashboard', 'Divine Classes • Real-time stats, batches, results, and quick actions'],
                batches: ['Batch Creation & Student Roster', 'Requirement #1: Create batches and add or remove students seamlessly'],
                attendance: ['Student Attendance Register', 'Mark daily attendance and review monthly class records'],
                fees: ['Student Fees & Reminder Center', 'Requirement #2 & #5: Strictly Admin-only fee tracking & instant WhatsApp/SMS reminders'],
                materials: ['Batch Assignments, DPPs & Test Papers', 'Requirement #3: Upload and download PDF assignments, worksheets, and papers'],
                marks: ['Offline Class Test Marks Tracker', 'Requirement #4: Track and update student marks scored in offline tests & report cards'],
                teachers: ['Expert Faculty Profiles', 'Requirement #6: View teacher qualifications, subjects, and doubt-clearing timings'],
                gallery: ['Result Banners & Coaching Gallery', 'Requirement #8: Previous result banners and classroom achievements'],
                links: ['External Study Material Hub', 'Requirement #9: Curated study material links from trusted educational websites'],
                feedback: ['Parent & Student Feedback Portal', 'Requirement #10: Submit and review feedback from parents and students'],
                access: ['Access Control & Password Settings', 'Requirement #11: Manage student/faculty passwords and authorize app access synced with the database'],
                settings: ['Settings', 'Manage institute details, access, and connected services']
            };

            const [rawTitle, rawSubtitle] = titles[state.activeTab] || titles.dashboard;
            let title = rawTitle;
            let subtitle = rawSubtitle;
            // Client demo mode: strip "Requirement #N:" tags from page headers when OFF
            if (!shouldShowReqLabels()) {
                subtitle = subtitle.replace(/^Requirement\s*[^:]*:\s*/i, '');
            }
            if (titleEl) titleEl.textContent = title;
            if (subtitleEl) subtitleEl.textContent = subtitle;

            const pageModule = window.DIVINE_PAGE_MODULES && window.DIVINE_PAGE_MODULES[state.activeTab];
            if (pageModule) {
                if (container.dataset) container.dataset.pageModule = pageModule.id;
                const allowed = !pageModule.access || pageModule.access.length === 0 || pageModule.access.includes(state.currentRole) || (state.activeTab === 'attendance' && state.currentRole === 'student');
                const templateExists = document.getElementById(pageModule.templateId);
                const renderer = (state.activeTab === 'attendance' && state.currentRole === 'student' && typeof window.renderStudentAttendanceView === 'function')
                    ? window.renderStudentAttendanceView
                    : window[pageModule.renderer];
                if (!allowed) {
                    container.innerHTML = '';
                    return;
                }
                if (templateExists && typeof renderer === 'function') {
                    const pageShell = templateExists.content.cloneNode(true);
                    const pageRoot = pageShell.querySelector('[data-page-root]');
                    if (pageRoot) {
                        pageRoot.innerHTML = renderer();
                        if (typeof container.replaceChildren === 'function') {
                            container.replaceChildren(pageShell);
                        } else {
                            container.innerHTML = '';
                            container.appendChild(pageShell);
                        }
                    } else {
                        container.innerHTML = renderer();
                    }
                    appendAppFooter(container);
                    return;
                }
            } else {
                if (container.dataset) delete container.dataset.pageModule;
            }

            switch (state.activeTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'batches':
                    container.innerHTML = renderBatchesView();
                    break;
                case 'attendance':
                    container.innerHTML = (state.currentRole === 'student') ? renderStudentAttendanceView() : ((state.currentRole === 'admin' || state.currentRole === 'developer' || state.currentRole === 'teacher') ? renderAttendanceView() : '');
                    break;
                case 'fees':
                    container.innerHTML = (state.currentRole === 'admin' || state.currentRole === 'developer') ? renderFeesView() : '';
                    break;
                case 'access':
                    container.innerHTML = (state.currentRole === 'admin' || state.currentRole === 'developer') ? renderAccessView() : '';
                    break;
                case 'settings':
                    container.innerHTML = (state.currentRole === 'developer') ? renderSettingsView() : '';
                    break;
                case 'materials':
                    container.innerHTML = renderMaterialsView();
                    break;
                case 'marks':
                    container.innerHTML = renderMarksView();
                    break;
                case 'teachers':
                    container.innerHTML = renderTeachersView();
                    break;
                case 'gallery':
                    container.innerHTML = renderGalleryView();
                    break;
                case 'links':
                    container.innerHTML = renderLinksView();
                    break;
                case 'feedback':
                    container.innerHTML = renderFeedbackView();
                    break;
            }
            appendAppFooter(container);
            } catch (renderError) {
                console.error('App page render failed:', renderError);
                container.innerHTML = `<div class="m-6 rounded-2xl border border-rose-200 bg-white p-6 text-slate-800 shadow-sm"><h2 class="text-base font-bold text-rose-700">This page could not be displayed</h2><p class="mt-2 text-sm text-slate-600">Your data is still available. Reload the page to try again.</p><button type="button" onclick="renderMainContent()" class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">Reload this page</button></div>`;
            }
        }

        // Refresh data without moving the user's position in the scrollable panel.
        function renderMainContentPreservingScroll() {

        /********************************************************************
         * HELPER: RESOLVE CURRENT STUDENT & ENROLLED BATCH
         ********************************************************************/
        function getCurrentStudentAndBatch() {
            const curStudent = (state.students || []).find(s =>
                (state.activeStudentId && String(s.id) === String(state.activeStudentId)) ||
                (state.currentUser && String(s.id) === String(state.currentUser.id)) ||
                (state.currentUser && String(s.roll) === String(state.currentUser.identifier))
            ) || (state.currentRole === 'student' ? (state.students && state.students[0]) : null);

            if (!curStudent) return { student: null, batch: null, batchId: '' };

            let curBatch = null;
            if (curStudent.batchId) {
                curBatch = (state.batches || []).find(b => String(b.id) === String(curStudent.batchId));
            }
            if (!curBatch) {
                curBatch = (state.batches || []).find(b => {
                    const ids = Array.isArray(b.studentIds) ? b.studentIds : (Array.isArray(b.student_ids) ? b.student_ids : []);
                    return ids.some(id => String(id) === String(curStudent.id) || String(id) === String(curStudent.roll));
                });
            }
            if (!curBatch && state.batches && state.batches.length > 0) {
                curBatch = state.batches[0];
            }
            const batchId = curBatch ? (curBatch.id || curBatch.batch_id || '') : '';
            return { student: curStudent, batch: curBatch, batchId: batchId };
        }

        function getCurrentTeacher() {
            if (state.currentRole !== 'teacher') return null;
            return (state.teachers || []).find(t =>
                (state.activeTeacherId && String(t.id) === String(state.activeTeacherId)) ||
                (state.currentUser && String(t.id) === String(state.currentUser.id)) ||
                (state.currentUser && String(t.email || '').toLowerCase() === String(state.currentUser.identifier || '').toLowerCase())
            ) || (state.teachers && state.teachers[0]) || null;
        }

        function isBatchAssignedToCurrentTeacher(batch) {
            if (state.currentRole !== 'teacher') return true;
            if (!batch) return false;
            const teacher = (state.teachers || []).find(function(item) { 
                return String(item.id) === String(state.activeTeacherId); 
            }) || (state.currentUser && state.currentUser.role === 'teacher' ? state.currentUser : null);
            if (!teacher) return false;

            const tId = String(teacher.id || '').trim();
            const tEmail = String(teacher.email || teacher.identifier || '').trim().toLowerCase();
            const bTeacherId = String(batch.teacherId || batch.teacher_id || '').trim();
            const bTeacherEmail = String(batch.teacherEmail || batch.teacher_email || '').trim().toLowerCase();

            // 1. Direct ID match
            if (tId && bTeacherId && tId === bTeacherId) return true;

            // 2. Direct Email match
            if (tEmail && bTeacherEmail && tEmail === bTeacherEmail) return true;

            // 3. Name match with normalized titles / suffixes stripped (e.g. "Er. Rajesh Chahar (Ex-IITian)" matches "Er. Rajesh Chahar")
            const cleanTName = String(teacher.name || '')
                .toLowerCase()
                .replace(/\(.*?\)/g, '')
                .replace(/^(er\.|dr\.|mr\.|mrs\.|ms\.)\s*/i, '')
                .trim();
            const cleanBTeacher = String(batch.teacher || batch.lead_faculty || '')
                .toLowerCase()
                .replace(/\(.*?\)/g, '')
                .replace(/^(er\.|dr\.|mr\.|mrs\.|ms\.)\s*/i, '')
                .trim();

            if (cleanTName && cleanBTeacher) {
                if (cleanTName === cleanBTeacher) return true;
                if (cleanBTeacher.includes(cleanTName) || cleanTName.includes(cleanBTeacher)) return true;
            }

            return false;

        function handleCreateBatch(e) {
            e.preventDefault();
            const newBatch = {
                id: 'b' + Date.now(),
                name: document.getElementById('batch-name').value.trim(),
                subject: document.getElementById('batch-subject').value.trim(),
                teacher: document.getElementById('batch-teacher').value,
                schedule: document.getElementById('batch-schedule').value.trim(),
                room: document.getElementById('batch-room').value.trim(),
                studentIds: []
            };
            state.batches.unshift(newBatch);
            saveStateLocally();
            closeModal();
            renderMainContent();
            showToast(`Batch "${newBatch.name}" created! You can now add students.`, 'success');
        }

        function openAddStudentToBatchModal(initialBatchId) {
            if (state.currentRole !== 'admin' && state.currentRole !== 'developer' && state.currentRole !== 'teacher') {
                showToast('Only administrators or faculty can assign students to batches.', 'error');
                return;
            }
            const allBatches = state.batches || [];
            if (!allBatches.length) {
                showToast('No batches exist yet to add students to.', 'warning');
                return;
            }
            const currentBatchId = initialBatchId || (allBatches.find(isBatchAssignedToCurrentTeacher) || allBatches[0]).id;
            const batch = allBatches.find(b => b.id === currentBatchId) || allBatches[0];
            const batchStudentIds = Array.isArray(batch.studentIds) ? batch.studentIds : (Array.isArray(batch.student_ids) ? batch.student_ids : []);
            const availableStudents = (state.students || []).filter(s => s && s.status !== 'Inactive' && !batchStudentIds.includes(s.id) && !batchStudentIds.includes(s.roll));

            const modal = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div>
                        <h3 class="text-base font-bold text-slate-900 font-heading">Add Student to Batch</h3>
                        <p class="text-xs text-slate-500">${escapeHtml(batch.name || ('Batch ' + batch.id))}</p>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>

                    <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100">

                            <i class="fa-solid fa-users-rectangle text-indigo-600"></i> Target Coaching Batch:
                        </label>
                        <select id="modal-target-batch-id" onchange="openAddStudentToBatchModal(this.value)" class="w-full px-3 py-2 text-xs border border-indigo-200 rounded-lg bg-white font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            ${allBatches.map(b => `
                                <option value="${b.id}" ${b.id === batch.id ? 'selected' : ''}>
                                    ${escapeHtml(b.name || b.id)}${isBatchAssignedToCurrentTeacher(b) ? ' ★ (My Batch)' : ''}
                                </option>
                            `).join('')}
                        </select>
                    </div>

                    <!-- Option A: Select Existing Student -->
                    ${availableStudents.length > 0 ? `
                    <form onsubmit="handleAddExistingStudent(event, '${batch.id}')" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <label class="block text-xs font-bold text-slate-700">Option 1: Select from Existing Institute Directory</label>
                        <div class="flex gap-2">
                            <select id="existing-student-id" class="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-xl bg-white focus:outline-none">
                                ${availableStudents.map(s => `<option value="${s.id}">${s.name} (${s.roll})</option>`).join('')}
                            </select>
                            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700 shrink-0">Add to Batch</button>
                        </div>
                    </form>
                    ` : `
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center text-xs text-slate-500">
                        All active institute students are already enrolled in this batch. You can enroll a brand-new student below.
                    </div>
                    `}

                    <!-- Option B: Register Brand New Student -->
                    <form onsubmit="handleAddNewStudentToBatch(event, '${batch.id}')" class="space-y-3">
                        <label class="block text-xs font-bold text-slate-700">Option 2: Enroll Brand New Student</label>
                        <div class="flex flex-col items-center gap-2 rounded-xl border border-indigo-100 bg-indigo-50 px-4 py-5">
                            <label for="new-stu-photo-input" class="student-photo-picker relative block w-28 h-28 rounded-full bg-white border-2 border-dashed border-indigo-300 hover:border-indigo-500 hover:ring-4 hover:ring-indigo-100 overflow-hidden cursor-pointer transition group" title="Click to upload or change the student photo">
                                <div id="new-stu-photo-preview" class="w-full h-full rounded-full flex items-center justify-center text-indigo-500 bg-indigo-50">
                                    <div class="flex flex-col items-center gap-1">
                                        <i class="fa-solid fa-camera text-2xl" aria-hidden="true"></i>
                                        <span class="text-[10px] font-semibold">Add photo</span>
                                    </div>
                                </div>
                                <input type="file" id="new-stu-photo-input" accept="image/jpeg,image/png,image/webp" aria-required="true" aria-label="Required student photo. Click to upload or change the photo." class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleNewStudentPhotoPick(event)">
                                <span class="absolute bottom-1 right-1 w-8 h-8 rounded-full bg-indigo-600 text-white border-2 border-white flex items-center justify-center shadow-sm pointer-events-none"><i class="fa-solid fa-plus text-xs"></i></span>
                            </label>
                            <div class="text-center">
                                <p class="text-xs font-bold text-slate-700">Student photo <span class="text-rose-600">*</span></p>
                                <p class="text-[10px] text-slate-600">Required · Click the circle to upload or replace</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">Student Full Name *</label>

        async function handleNewStudentPhotoPick(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            window.newStudentPhotoProcessing = true;
            try {
                showToast('Compressing photo for storage...', 'info');
                const dataUrl = await processImageUpload(file);
                window.newStudentPhotoData = dataUrl;
                const prev = document.getElementById('new-stu-photo-preview');
                if (prev) {
                    prev.innerHTML = `<img src="${dataUrl}" alt="Student photo preview" class="w-full h-full object-cover rounded-full">`;
                }
                showToast('Photo ready for enrollment!', 'success');
            } catch (err) {
                window.newStudentPhotoData = '';
                event.target.value = '';
                showToast('Failed to process photo: ' + err, 'error');

        function nextMonthlyDueDate(isoDate) {
            const parts = String(isoDate || '').split('-').map(Number);
            if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return '';
            const target = new Date(parts[0], parts[1], 1);
            const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
            return `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}-${String(Math.min(parts[2], lastDay)).padStart(2, '0')}`;
        }

        function localTodayIso() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function processImageUpload(file, maxWidth = 260, maxHeight = 260, quality = 0.82) {
            return new Promise((resolve, reject) => {
                if (!file) return reject('No file selected');
                if (!file.type || !file.type.startsWith('image/')) return reject('Please select a valid image file');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > h) {
                            if (w > maxWidth) {
                                h = Math.round((h * maxWidth) / w);
                                w = maxWidth;
                            }
                        } else {
                            if (h > maxHeight) {
                                w = Math.round((w * maxHeight) / h);
                                h = maxHeight;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = () => reject('Could not decode image');
                    img.src = e.target.result;
                };
                reader.onerror = () => reject('Could not read image file');
                reader.readAsDataURL(file);
            });
        }

        function persistStudentPhoto(studentId, photoDataUrl, reopenCard) {
            return new Promise(resolve => {
                const stu = state.students.find(item => String(item.id) === String(studentId));
                if (!stu || !canCurrentUserViewStudentProfile(studentId)) { showToast('Student profile is not available.', 'error'); resolve(false); return; }
                showToast(`Saving photo for ${stu.name}...`, 'info');
                const finish = function(result) {
                    if (!result || !result.success) {
                        showToast((result && (result.error || result.message)) || 'Photo could not be saved. Please try again.', 'error');
                        resolve(false);
                        return;
                    }
                    stu.photo = result.photo || photoDataUrl;

                    saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {

                    renderMainContent();
                    updateRoleUI();
                    if (reopenCard) openStudentIdCard(studentId);
                    showToast(`Photo for ${stu.name} saved.`, 'success');
                    resolve(true);
                };
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(finish).withFailureHandler(function(error) {
                        showToast('Photo save failed: ' + (error && error.message ? error.message : String(error)), 'error');
                        resolve(false);
                    }).apiUpdateStudentPhoto(studentId, photoDataUrl);
                } else finish({ success: true });
            });
        }

            openModal(`
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">

                if (!video) { stream.getTracks().forEach(track => track.stop()); return; }
                video.srcObject = stream;

        async function captureStudentCameraPhoto(studentId) {
            const video = document.getElementById('student-camera-preview');
            if (!video || !video.videoWidth || !video.videoHeight) { showToast('Camera is not ready yet.', 'warning'); return; }
            const canvas = document.createElement('canvas');
            const size = Math.min(video.videoWidth, video.videoHeight);
            const sx = Math.round((video.videoWidth - size) / 2);
            const sy = Math.round((video.videoHeight - size) / 2);
            canvas.width = 320; canvas.height = 320;
            canvas.getContext('2d').drawImage(video, sx, sy, size, size, 0, 0, 320, 320);
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.84);
            closeModal();
            await persistStudentPhoto(studentId, photoDataUrl, true);
        }

        function handleSaveEditStudent(e, studentId) {

            const roll = document.getElementById('edit-stu-roll').value.trim();
            const phone = document.getElementById('edit-stu-phone').value.trim();
            const parentName = document.getElementById('edit-stu-parent').value.trim();
            const batchId = document.getElementById('edit-stu-batch').value;
            const status = document.getElementById('edit-stu-status').value;
            const totalFee = parseInt(document.getElementById('edit-stu-totalfee').value, 10) || 0;
            const paidFee = parseInt(document.getElementById('edit-stu-paidfee').value, 10) || 0;
            const dueDate = document.getElementById('edit-stu-duedate').value.trim();
            const monthlyFee = parseInt(document.getElementById('edit-stu-monthly-fee').value, 10) || 0;
            const admissionDate = document.getElementById('edit-stu-admission-date').value;
            const password = document.getElementById('edit-stu-pwd').value.trim();
            const photoVal = document.getElementById('edit-stu-photo-val');
            const photo = photoVal ? photoVal.value : (stu.photo || '');

            stu.name = name;
            stu.roll = roll;
            stu.phone = phone;
            stu.parentName = parentName;
            stu.status = status;
            stu.totalFee = totalFee;
            stu.paidFee = paidFee;
            stu.dueDate = dueDate || stu.dueDate;
            stu.monthlyFee = monthlyFee;
            stu.admissionDate = admissionDate || stu.admissionDate || '';
            stu.password = password || 'password123';
            stu.photo = photo;

            // Batch assignment
            (state.batches || []).forEach(b => {
                b.studentIds = (b.studentIds || []).filter(id => id !== studentId);
                if (b.id === batchId && status !== 'Inactive') {
                    b.studentIds.push(studentId);
                }
            });

            saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
            closeModal();
            renderMainContent();
            updateRoleUI();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (result && result.success) {
                            const updatedStudent = state.students.find(item => String(item.id) === String(studentId));
                            if (updatedStudent) { updatedStudent.photo = result.photo; updatedStudent.photoFileId = result.photoFileId || ''; }

            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
                        }

                showToast(`Student ${name} updated successfully!`, 'success');

        async function handleEditTeacherPhotoPick(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            window.editTeacherPhotoProcessing = true;
            try {
                const dataUrl = await processImageUpload(file);
                window.editTeacherPhotoData = dataUrl;
                window.editTeacherPhotoDirty = true;
                const preview = document.getElementById('edit-tch-photo-preview');
                if (preview) preview.innerHTML = `<img src="${dataUrl}" alt="Faculty photo preview" class="h-full w-full object-cover">`;
                showToast('Faculty photo ready. Save the profile to apply it.', 'success');
            } catch (error) {
                showToast('Could not process faculty photo: ' + error, 'error');
                event.target.value = '';
            } finally {
                window.editTeacherPhotoProcessing = false;
            }
        }

        function handleSaveEditTeacher(e, teacherId) {
            e.preventDefault();
            const isAdmin = state.currentRole === 'admin' || state.currentRole === 'developer';
            const isSelfTeacher = state.currentRole === 'teacher' && String(state.activeTeacherId) === String(teacherId);
            if (!isAdmin && !isSelfTeacher) {
                showToast('Permission denied: You cannot edit this faculty profile.', 'error');
                return;
            }
            if (window.editTeacherPhotoProcessing) {
                showToast('Please wait for the faculty photo to finish processing.', 'warning');
                return;
            }
            const tch = (state.teachers || []).find(t => t.id === teacherId);
            if (!tch) return;

            const name = document.getElementById('edit-tch-name').value.trim();
            const email = document.getElementById('edit-tch-email').value.trim();
            const subject = document.getElementById('edit-tch-subject').value.trim();
            const qualification = document.getElementById('edit-tch-qual').value.trim();
            const experience = document.getElementById('edit-tch-exp').value.trim();
            const phone = document.getElementById('edit-tch-phone').value.trim();
            const statusEl = document.getElementById('edit-tch-status');
            const status = statusEl ? statusEl.value : (tch.status || 'Active');
            const specialization = document.getElementById('edit-tch-spec').value.trim();
            const bio = document.getElementById('edit-tch-bio').value.trim();
            const password = document.getElementById('edit-tch-pwd').value.trim();
            const photo = window.editTeacherPhotoDirty ? (window.editTeacherPhotoData || '') : (tch.photo || '');

            tch.name = name;
            tch.email = email;
            tch.subject = subject;
            tch.qualification = qualification;
            tch.experience = experience;
            tch.phone = phone;
            tch.status = isAdmin ? status : (tch.status || 'Active');
            tch.specialization = specialization;
            tch.bio = bio;
            tch.password = password || tch.password || 'teacher123';
            tch.photo = photo;
            tch.initials = name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();

            if (isSelfTeacher && state.currentUser) {
                state.currentUser.name = name;
                state.currentUser.identifier = email;
                renderAuthHeader();
            }

            saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
            closeModal();
            renderMainContent();
            showToast('Faculty profile updated successfully.', 'success');

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (!result || !result.success) {
                            saveStateLocally();
                            showToast((result && result.error) || 'Faculty profile saved on this device; cloud sync will retry.', 'warning');
                            return;
                        }
                        if (result.photo) { tch.photo = result.photo; tch.photoFileId = result.photoFileId || ''; saveStateLocally(true); }
                        window.editTeacherPhotoDirty = false;
                        showToast(`Faculty ${name} profile saved.`, 'success');
                    })
                    .withFailureHandler(function(error) {
                        saveStateLocally();
                        showToast('Faculty profile saved on this device; cloud sync will retry: ' + (error && error.message ? error.message : String(error)), 'warning');
                    })
                    .apiUpdateTeacherProfile(teacherId, {
                        name, email, subject, qualification, experience, phone, status, specialization, bio, password, photo
                    });
            } else {
                showToast(`Faculty ${name} updated successfully!`, 'success');
            }
        }

        function toggleFeeRowDetails(studentId, button) {
            const details = document.getElementById(`fee-details-${studentId}`);
            if (!details || !button) return;
            const willExpand = details.classList.contains('hidden');
            details.classList.toggle('hidden', !willExpand);
            button.setAttribute('aria-expanded', String(willExpand));
            button.title = willExpand ? 'Hide fee details' : 'Show all fee details';
            const icon = button.querySelector('i');
            if (icon) icon.className = willExpand ? 'fa-solid fa-minus' : 'fa-solid fa-plus';
        }

        function addFeeReminderNotification(studentId, channel = 'App Notification') {
            const stu = state.students.find(s => s.id === studentId);
            if (!stu) return;
            const balance = stu.totalFee - stu.paidFee;
            if (balance <= 0) return;

            if (!state.notifications) state.notifications = [];

            // Remove any older unread fee reminder for this specific student to avoid duplicates
            state.notifications = state.notifications.filter(n => !(n.targetStudentId === stu.id && n.actionTab === 'fees' && !n.read));

            const newNotif = {
                id: 'notif_fee_' + stu.id + '_' + Date.now(),
                title: `Fee Payment Reminder: ₹${balance.toLocaleString('en-IN')}`,
                message: `Dear ${stu.name} (${stu.roll}), your tuition fee installment balance of ₹${balance.toLocaleString('en-IN')} is due on ${stu.dueDate || 'this week'}. Sent via ${channel}. Please clear via UPI: ${state.settings.upiId || 'divineclasses@upi'}.`,
                time: 'Just now',
                timestamp: Date.now(),
                read: false,
                adminSeen: false,
                type: 'warning',
                icon: 'fa-bell',
                iconColor: 'text-amber-500',
                bgColor: 'bg-amber-100 dark:bg-amber-950/40',
                actionTab: 'fees',
                targetStudentId: stu.id,
                targetRoll: stu.roll,
                targetRole: 'student',
                studentName: stu.name,
                feeBalance: balance
            };

            state.notifications.unshift(newNotif);
            saveStateLocally();
            updateNotificationBadge();
        }

                        n.read = true;
                        n.readAt = new Date().toISOString();
                        changed = true;

                    ${!isPaid ? `

                            <div class="flex items-center gap-2 text-amber-800 font-bold">
                                <i class="fa-solid fa-bell animate-pulse text-amber-600"></i>
                                <span>Fee Due Date: ${stu.dueDate || 'Immediate'}</span>
                            </div>
                            <p class="text-[11px] text-amber-900 leading-relaxed">
                                Please clear the pending fee balance of <strong>₹${balance.toLocaleString('en-IN')}</strong> to maintain active batch enrollment and test reports.

                            <div class="flex items-center justify-between p-2.5 bg-white rounded-lg border border-amber-200 mt-2">
                                <div>
                                    <p class="text-xs text-slate-500 font-semibold">Official Institute UPI ID</p>

                                <button onclick="navigator.clipboard.writeText('${upiId}'); showToast('UPI ID copied to clipboard! Ready to paste into GPay / PhonePe / Paytm.', 'success');" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded text-[11px] transition">
                                    Copy UPI
                                </button>
                            </div>
                        </div>
                    ` : `
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-center text-emerald-800">
                            <i class="fa-solid fa-circle-check text-xl mb-1 text-emerald-600"></i>
                            <p class="font-bold">Tuition Fees Fully Paid!</p>
                            <p class="text-[11px] text-emerald-600 mt-0.5">Thank you for keeping your account in good standing.</p>
                        </div>
                    `}

                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <button onclick="printFeeReceipt('${stu.id}')" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition flex items-center gap-1.5">

                            <span>Print / View Fee Receipt</span>

        function sendWhatsAppFeeReminder(studentId) {
            const stu = state.students.find(s => s.id === studentId);
            if (!stu) return;
            const balance = stu.totalFee - stu.paidFee;
            stu.lastReminder = 'Just now (WhatsApp)';
            addFeeReminderNotification(studentId, 'WhatsApp & Notification');
            saveStateLocally();
            renderMainContent();

            // Construct sanitized phone number
            const cleanPhone = (stu.phone || '').replace(/[^0-9]/g, '');
            const phoneParam = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;

            const text = encodeURIComponent(
                `Dear ${stu.parentName},\nGreetings from *Divine Classes*.\nThis is a gentle reminder regarding ${stu.name}'s (Roll: ${stu.roll}) pending tuition fee balance of *₹${balance.toLocaleString('en-IN')}* due on ${stu.dueDate}.\nKindly clear the dues at your earliest convenience to ensure uninterrupted class materials & test series.\nUPI ID: ${state.settings.upiId}\nThank you,\nAdministration, Divine Classes`
            );

            const waUrl = 'https://wa.me/' + phoneParam + '?text=' + text;
            window.open(waUrl, '_blank');
            showToast(`WhatsApp reminder opened & added to Bell Icon for ${stu.parentName}!`, 'success');
        }

        function sendSingleFeeReminder(studentId) {
            const stu = state.students.find(s => s.id === studentId);
            if (!stu) return;
            const balance = stu.totalFee - stu.paidFee;
            stu.lastReminder = 'Just now (In-App & Bell)';
            addFeeReminderNotification(studentId, 'In-App & Bell Notification');
            saveStateLocally();
            renderMainContent();
            showToast(`Fee Reminder dispatched & added to Bell Icon for ${stu.name} (Roll: ${stu.roll})!`, 'success');
        }

        function sendBulkFeeReminders() {
            const pending = (state.students || []).filter(s => s.status !== 'Inactive' && s.paidFee < s.totalFee);
            if (pending.length === 0) {
                showToast('All students have paid their fees in full!', 'info');
                return;
            }
            pending.forEach(s => {
                s.lastReminder = 'Just now (Bulk)';
                addFeeReminderNotification(s.id, 'Bulk Notification & SMS');
            });
            saveStateLocally();
            renderMainContent();
            showToast(`Bulk Fee Reminders dispatched & added to Bell Icon for ${pending.length} students!`, 'success');
        }

        function openRecordPaymentModal(studentId) {
            const stu = state.students.find(s => s.id === studentId);
            const balance = stu.totalFee - stu.paidFee;

            const modal = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div>
                        <h3 class="text-base font-bold text-slate-900 font-heading">Record Fee Payment</h3>

                </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Payment Amount (₹) *</label>

                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Payment Mode *</label>

                            <option value="UPI / QR">UPI / QR (Google Pay, PhonePe, Paytm)</option>

                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Transaction Ref / Receipt Note</label>

                    </div>
                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                        <button id="btn-record-payment" type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700">Record & Generate Receipt</button>
                    </div>
                </form>
            `;

        function handleRecordPayment(e, studentId) {
            e.preventDefault();
            const stu = state.students.find(s => s.id === studentId);
            if (!stu) { showToast('Student record could not be found.', 'error'); return; }
            const amount = Number(document.getElementById('pay-amount').value) || 0;
            const mode = document.getElementById('pay-mode').value;
            const ref = document.getElementById('pay-ref').value.trim() || 'N/A';
            const balance = Math.max(0, Number(stu.totalFee || 0) - Number(stu.paidFee || 0));
            if (!Number.isFinite(amount) || amount <= 0 || amount > balance) {
                showToast(amount > balance ? 'Payment cannot exceed the outstanding balance.' : 'Enter a valid payment amount.', 'error');
                return;
            }
            const button = document.getElementById('btn-record-payment');
            if (button) { button.disabled = true; button.textContent = 'Saving payment…'; }
            const finish = function(result) {
                if (!result || !result.success) {
                    if (button) { button.disabled = false; button.textContent = 'Record & Generate Receipt'; }
                    showToast((result && (result.error || result.message)) || 'Could not save this payment. Please try again.', 'error');
                    return;
                }
                stu.paidFee = Number(result.paidFee);
                stu.dueDate = result.dueDate || stu.dueDate;
                if (!Array.isArray(stu.paymentHistory)) stu.paymentHistory = [];
                if (result.payment) stu.paymentHistory.unshift(result.payment);
                saveStateLocally();
            if (typeof syncPendingDataToSupabase === 'function') {
                syncPendingDataToSupabase();
            }
                closeModal();
                renderMainContent();
                showToast(`₹${amount.toLocaleString('en-IN')} payment recorded for ${stu.name}!`, 'success');
                printFeeReceipt(stu.id, amount, mode, ref);
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(finish).withFailureHandler(function(err) {
                    if (button) { button.disabled = false; button.textContent = 'Record & Generate Receipt'; }
                    showToast('Could not save payment: ' + (err && err.message ? err.message : String(err)), 'error');
                }).apiRecordStudentPayment(studentId, amount, mode, ref);

        function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle) {
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
            ctx.fill();
        }

        function loadCanvasImage(src) {
            return new Promise(resolve => {

                const image = new Image();
                image.crossOrigin = 'anonymous';
                image.onload = () => resolve(image);
                image.onerror = () => resolve(null);
                image.src = src;
            });
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);

        function buildSingleImagePdf(jpegDataUrl, width, height) {
            const binary = atob(jpegDataUrl.split(',')[1]);
            const imageBytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) imageBytes[i] = binary.charCodeAt(i);
            const encoder = new TextEncoder();
            const ascii = value => encoder.encode(value);
            const pageWidth = 252, pageHeight = Math.round(pageWidth * height / width);
            const content = `q ${pageWidth} 0 0 ${pageHeight} 0 0 cm /Im0 Do Q`;
            const objects = [
                ascii('<< /Type /Catalog /Pages 2 0 R >>'),
                ascii('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'),
                ascii(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`),
                [ascii(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imageBytes.length} >>\nstream\n`), imageBytes, ascii('\nendstream')],
                ascii(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)
            ];
            const parts = [ascii('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
            const offsets = [0]; let position = parts[0].length;
            objects.forEach((object, index) => {
                offsets.push(position);
                const start = ascii(`${index + 1} 0 obj\n`); const end = ascii('\nendobj\n');
                parts.push(start); position += start.length;
                const objectParts = Array.isArray(object) ? object : [object];
                objectParts.forEach(part => { parts.push(part); position += part.length; });
                parts.push(end); position += end.length;
            });
            const xrefOffset = position;
            let xref = `xref\n0 ${offsets.length}\n0000000000 65535 f \n`;
            offsets.slice(1).forEach(offset => { xref += String(offset).padStart(10, '0') + ' 00000 n \n'; });
            xref += `trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
            parts.push(ascii(xref));
            return new Blob(parts, { type: 'application/pdf' });
        }

        function selectTeacherForFeedback(teacherId, teacherName) {
            const selectEl = document.getElementById('feedback-teacher-id');

        function handleFacultyFeedbackSubmit(event) {
            if (event) event.preventDefault();
            const teacherSelect = document.getElementById('feedback-teacher-id');
            const roleSelect = document.getElementById('feedback-author-role');
            const ratingSelect = document.getElementById('feedback-star-rating');
            const catSelect = document.getElementById('feedback-category');
            const commentEl = document.getElementById('feedback-comments');

            if (!teacherSelect || !commentEl || !commentEl.value.trim()) {
                showToast('Please enter your feedback comments.', 'error');
                return;
            }

            const teacherId = teacherSelect.value;
            const teacherObj = (state.teachers || []).find(t => String(t.id) === String(teacherId));
            const teacherName = teacherObj ? teacherObj.name : 'Faculty';
            const authorRole = roleSelect ? roleSelect.value : 'Student';
            const rating = ratingSelect ? Number(ratingSelect.value) || 5 : 5;
            const category = catSelect ? catSelect.value : 'Teaching & Concept Clarity';
            const comment = commentEl.value.trim();
            const authorName = state.currentUser ? state.currentUser.name : 'Student';

            const newFb = {
                id: 'FB' + Date.now(),
                teacherId: teacherId,
                targetFaculty: teacherName,
                authorName: authorName,
                studentName: authorName,
                studentId: state.currentUser ? state.currentUser.id : '',
                role: authorRole,
                rating: rating,
                category: category,
                comment: comment,
                message: comment,
                date: new Date().toISOString().split('T')[0],
                created_at: new Date().toISOString(),
                status: 'Published'
            };

            if (!state.feedbacks) state.feedbacks = [];
            state.feedbacks.unshift(newFb);
            saveStateLocally();

            // Cloud sync if available
            if (typeof syncCollectionToSupabase === 'function' && state.settings && state.settings.supabaseEnabled) {
                syncCollectionToSupabase('feedbacks', state.feedbacks);
            }

            showToast('Thank you! Your feedback for ' + teacherName + ' has been submitted successfully.', 'success');
            closeModal();
        }

        function filterMaterialsByBatch(batchId) {
            state.selectedBatchFilter = batchId;
            renderMainContent();
        }

        function getMaterialFileMeta(mat) {
            const name = String(mat.fileName || '').toLowerCase();
            let ext = String(mat.fileType || '').toLowerCase();
            if (!ext && name.includes('.')) ext = name.split('.').pop();
            if (!ext) {
                const t = String(mat.title || '').toLowerCase();
                if (/\.pdf|\bpdf\b/.test(t)) ext = 'pdf';
                else if (/\.docx?|\bdocx?\b/.test(t)) ext = 'docx';
                else if (/\.xlsx?|excel|\bxls\b/.test(t)) ext = 'xlsx';
                else if (/\.pptx?|\bpptx?\b/.test(t)) ext = 'pptx';
            }
            if (ext === 'pdf') return { ext: 'PDF', icon: 'fa-file-pdf', color: 'text-red-600', kind: 'pdf' };
            if (ext === 'doc' || ext === 'docx') return { ext: 'Word', icon: 'fa-file-word', color: 'text-blue-600', kind: 'office' };
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return { ext: 'Excel', icon: 'fa-file-excel', color: 'text-emerald-600', kind: 'office' };
            if (ext === 'ppt' || ext === 'pptx') return { ext: 'PPT', icon: 'fa-file-powerpoint', color: 'text-orange-600', kind: 'office' };
            return { ext: 'File', icon: 'fa-file-lines', color: 'text-slate-500', kind: 'other' };
        }

        function downloadMaterial(matId) {
            const mat = (state.materials || []).find(m => m.id === matId);
            if (!mat) {
                showToast('Material not found.', 'error');
                return;
            }

            // Strict authorization check for student role: only enrolled batch
            if (state.currentRole === 'student') {
                const { batchId: myBatchId } = getCurrentStudentAndBatch();
                const mBatch = String(mat.batchId || mat.batch || '').trim();
                if (mBatch && mBatch !== 'all' && mBatch !== 'general' && myBatchId && String(mBatch) !== String(myBatchId)) {
                    showToast('Access Denied: You are only allowed to download study materials uploaded for your enrolled batch.', 'error');
                    return;
                }
            }

            const fileId = mat.driveFileId || '';
            const mobileUrl = fileId ? 'https://drive.usercontent.google.com/download?id=' + fileId + '&export=download&confirm=t' : '';
            const url = mat.downloadUrl || mobileUrl || mat.driveUrl || '';
            if (!url) {
                showToast('No download link is attached to this material yet. Your teacher/admin needs to upload the file to generate the link.', 'warning');
                return;
            }
            mat.downloads = (mat.downloads || 0) + 1;
            saveStateLocally();
            window.open(url, '_blank');
            renderMainContent();
            const fm = getMaterialFileMeta(mat);
            if (fm.kind === 'pdf') {
                showToast(`Opening PDF "${mat.title}" — it opens directly in your browser. Tap ⋮ → Download to save it on your phone.`, 'success');
            } else if (fm.kind === 'office') {
                showToast(`${fm.ext} file "${mat.title}" is downloading — open it from your Files/Downloads app or the notification panel.`, 'success');
            } else {
                showToast(`Downloading "${mat.title}" (${mat.fileSize}) — check your Files/Downloads app on your phone.`, 'success');
            }
        }

        function deleteMaterial(matId) {
            if (state.currentRole !== 'admin' && state.currentRole !== 'developer') {
                showToast('Only Admin can delete assignments. Teachers can upload & edit, but deletion is admin-only.', 'error');
                return;
            }
            const mat = state.materials.find(m => m.id === matId);
            if (!mat) return;
            const hasLink = !!(mat.downloadUrl || mat.driveUrl || mat.driveFileId);
            showConfirmDialog({
                title: 'Delete "' + mat.title + '"?',
                message: hasLink
                    ? 'This will remove the material from the portal and database, and delete its Google Drive file. Students will no longer be able to download it.'
                    : '⚠ This is an old record with NO Drive link — the file was never actually uploaded.\n\nDelete it, then re-upload the file so students get a working download.',
                confirmText: 'Yes, Delete',
                cancelText: 'Keep It',
                danger: true
            }).then(function (confirmed) {
                if (!confirmed) return;

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (res && res.success) {
                                state.materials = state.materials.filter(m => m.id !== matId);
                                saveStateLocally();
                                renderMainContent();
                                showToast('"' + mat.title + '" deleted from the database and Drive.', 'success');
                            } else {
                                showToast('Delete failed: ' + ((res && res.error) || 'unknown error'), 'error');
                            }
                        })
                        .withFailureHandler(function (err) {
                            showToast('Delete failed: ' + (err && err.message ? err.message : String(err)), 'error');
                        })
                        .apiDeleteMaterial(matId);
                } else {
                    state.materials = state.materials.filter(m => m.id !== matId);
                    saveStateLocally();
                    renderMainContent();
                }
            });
        }
